[pytest]
testpaths = 04_testing_tdd/tests 05_web_apis_fastapi/tests 11_coding_challenges
# 11_coding_challenges files are named by topic (01_anagram_grouping.py, ...), not test_*.py,
# since each file doubles as a standalone runnable demo (`python 01_anagram_grouping.py`).
# List them explicitly so pytest still discovers their embedded test_* functions.
python_files = test_*.py 01_anagram_grouping.py 02_sliding_window_max.py 03_lru_cache.py 04_reverse_string.py
asyncio_mode = auto

er must migrate to KRaft (via 3.x) before upgrading. **Queues for Kafka / share groups** let multiple consumers cooperatively read the same partition with per-record acknowledgement (early access in 4.0, preview in 4.1) - helpful for queue-style workloads. Say \"check the current release notes\" for production use."}, {"n": 21, "level": "design", "q": "Design an event pipeline: ingest court files -> parse -> publish to Kafka -> sink to a database.", "a": "Files land in S3 -> an S3 event/notification triggers a parser (Quarkus CLI/Lambda) -> normalised JSON/Avro events keyed by record id are produced to Kafka -> a consumer group batches records, validates, upserts into the DB (idempotent), then commits offsets -> failures go to a DLT with the reason and original offset -> replay tool re-drives the DLT. Metrics: lag, parse failures per court/format, DLT size. Make parsers pure and unit-testable."}, {"n": 22, "level": "design", "q": "Design a notification system handling 50k events/sec with retries and ordering per user.", "a": "Key by `userId` (ordering per user), enough partitions (e.g. 48-96) and consumers, producers with idempotence, a consumer that deduplicates by event id, channel-specific retry topics with backoff (email/SMS/push) and a DLT, rate limiting per provider, templates in a separate service, and a read model of delivery status. Scale by partitions; protect providers with circuit breakers."}, {"n": 23, "level": "design", "q": "Design a Change Data Capture (CDC) pipeline from Oracle/PostgreSQL to Kafka.", "a": "Debezium (Kafka Connect) reads the DB log (LogMiner/XStream for Oracle, logical decoding for Postgres) and emits change events per table; use the outbox event router for domain events; schema registry for evolution; sink connectors to search/analytics; handle initial snapshot, DDL changes, large transactions and monitoring of connector lag."}, {"n": 24, "level": "intermediate", "q": "How do you test Kafka code?", "a": "Unit-test handlers as plain methods; integration-test with **Testcontainers Kafka** (or `@EmbeddedKafka`, KRaft-only now) and Awaitility for async assertions; test retries/DLT paths and duplicate delivery; contract-test schemas. Avoid `Thread.sleep`."}, {"n": 25, "level": "intermediate", "q": "Honest answer if asked \"have you run Kafka clusters yourself?\"", "a": "Say what is true: \"I've built producers/consumers and the delivery/retry/DLT patterns, and operated them on managed services (e.g. MSK). Broker administration (partition reassignment, KRaft quorum) was handled by the platform team, but I understand the concepts - replication, ISR, min.insync.replicas, retention - and can reason about capacity and failure modes.\""}]}, {"id": "10-sql-oracle", "title": "SQL & Oracle (with PostgreSQL/MySQL notes)", "focus": "Query tuning, indexes, transactions, window functions, Oracle specifics", "intro": "", "questions": [{"n": 1, "level": "basic", "q": "What are the SQL join types?", "a": "INNER (matching rows), LEFT/RIGHT OUTER (all rows from one side), FULL OUTER (all from both), CROSS (cartesian product), SELF join. A frequent trap: a filter on the right table in the `WHERE` clause turns a LEFT JOIN into an inner join - put it in the `ON` clause."}, {"n": 2, "level": "basic", "q": "WHERE vs HAVING? GROUP BY rules?", "a": "`WHERE` filters rows before grouping; `HAVING` filters groups after aggregation. Every non-aggregated selected column must be in `GROUP BY`. Logical order: FROM -> WHERE -> GROUP BY -> HAVING -> SELECT -> ORDER BY -> LIMIT/FETCH."}, {"n": 3, "level": "basic", "q": "DELETE vs TRUNCATE vs DROP?", "a": "DELETE: row-by-row, can have WHERE, logged, rollbackable, fires triggers. TRUNCATE: removes all rows fast, resets high-water mark, DDL (auto-commit in Oracle). DROP: removes the object itself."}, {"n": 4, "level": "basic", "q": "Primary key vs unique key vs foreign key; NULL behaviour?", "a": "PK: unique + not null, one per table. Unique: allows NULL (Oracle allows multiple NULLs in a single-column unique index; behaviour differs by DB). FK: referential integrity. `NULL = NULL` is unknown, use `IS NULL`; Oracle treats empty string as NULL (a classic Oracle trap)."}, {"n": 5, "level": "intermediate", "q": "How do indexes work and when do they not help?", "a": "A B-tree index keeps keys sorted so lookups are O(log n). Not used when: you wrap the column in a function (`WHERE TRUNC(date_col)=...` -> use a function-based index or a range), leading wildcard `LIKE '%abc'`, implicit type conversion, low selectivity on a big share of rows, or stale statistics. Composite index order matters: **leftmost prefix** rule."}, {"n": 6, "level": "intermediate", "q": "How do you read an execution plan? (Oracle)", "a": "`EXPLAIN PLAN FOR ...; SELECT * FROM TABLE(DBMS_XPLAN.DISPLAY);` or `DBMS_XPLAN.DISPLAY_CURSOR` for the real plan with runtime stats. Look for full table scans on big tables, wrong join order/method (nested loops vs hash join), big difference between estimated and actual rows (stale stats), `TABLE ACCESS BY INDEX ROWID` repeated millions of times. Fix with indexes, stats (`DBMS_STATS`), rewriting the query, or hints as a last resort. PostgreSQL: `EXPLAIN (ANALYZE, BUFFERS)`."}, {"n": 7, "level": "intermediate", "q": "A query that was fast is now slow. What do you check?", "a": "Plan change (stats updated, data skew, bind-variable peeking), data growth, missing/invalid index, lock waits, parameter/type mismatch, a new code path (N+1), resource limits. Compare the old and new plan (AWR/SQL Monitor in Oracle, `pg_stat_statements` in Postgres)."}, {"n": 8, "level": "intermediate", "q": "Window functions - examples?", "a": "```sql\nSELECT emp_id, dept, salary,\n  RANK() OVER (PARTITION BY dept ORDER BY salary DESC) AS rnk,\n  salary - LAG(salary) OVER (PARTITION BY dept ORDER BY hire_date) AS diff,\n  SUM(salary) OVER (PARTITION BY dept) AS dept_total\nFROM employees;\n```\nKnow `ROW_NUMBER` vs `RANK` vs `DENSE_RANK`, `LEAD/LAG`, running totals with `ROWS BETWEEN`."}, {"n": 9, "level": "intermediate", "q": "Find the Nth highest salary / duplicates / delete duplicates.", "a": "```sql\n-- 2nd highest\nSELECT salary FROM (SELECT salary, DENSE_RANK() OVER (ORDER BY salary DESC) r FROM emp) WHERE r = 2;\n-- duplicates\nSELECT email, COUNT(*) FROM users GROUP BY email HAVING COUNT(*) > 1;\n-- delete duplicates keeping the lowest id\nDELETE FROM users WHERE id NOT IN (SELECT MIN(id) FROM users GROUP BY email);\n```"}, {"n": 10, "level": "intermediate", "q": "What are ACID and the isolation anomalies?", "a": "Atomicity, Consistency, Isolation, Durability. Anomalies: dirty read, non-repeatable read, phantom read, lost update, write skew. Oracle/Postgres default READ COMMITTED (a statement sees data committed before it started); Oracle also offers SERIALIZABLE and read-only; its **MVCC** (undo) means readers don't block writers."}, {"n": 11, "level": "intermediate", "q": "Locks and deadlocks in a database?", "a": "Row locks on update; a second session waits (`ORA-00054` for `NOWAIT`, `ORA-00060` deadlock detected). Avoid by updating rows in a consistent order, keeping transactions short, indexing foreign keys (unindexed FKs cause table-level lock escalation in Oracle), and using `SELECT ... FOR UPDATE SKIP LOCKED` for work queues."}, {"n": 12, "level": "intermediate", "q": "Normalization vs denormalization?", "a": "Normalise (3NF) to avoid update anomalies for OLTP; denormalise deliberately for read performance/reporting (summary tables, materialized views), accepting redundancy and the need to keep it in sync."}, {"n": 13, "level": "intermediate", "q": "Oracle-specific: sequences, `ROWNUM`, `MERGE`, `DUAL`, partitioning?", "a": "Sequences for ids (`NEXTVAL`, 12c identity columns). `ROWNUM` is assigned before `ORDER BY` - use `FETCH FIRST n ROWS ONLY` (12c+) or a subquery. `MERGE` = upsert. `DUAL` = one-row dummy table. **Partitioning** (range/list/hash) speeds pruning and archiving of large tables. Know PL/SQL: packages, bulk collect/`FORALL`, cursors, exceptions."}, {"n": 14, "level": "advanced", "q": "How do you handle a table with 500 million rows?", "a": "Partition by date/key, index only what queries need, archive old data, use covering indexes, avoid `SELECT *`, batch deletes (don't delete 50M rows in one transaction), parallel query for reporting, materialized views for aggregates, and keyset pagination. Consider moving analytics to a warehouse/lakehouse."}, {"n": 15, "level": "advanced", "q": "Optimistic locking and idempotent upsert patterns in SQL?", "a": "`UPDATE t SET ..., version = version + 1 WHERE id = ? AND version = ?` -> zero rows updated means conflict. Idempotent insert: `INSERT ... ON CONFLICT (event_id) DO NOTHING` (Postgres) or `MERGE` / unique constraint + catch `ORA-00001` (Oracle)."}, {"n": 16, "level": "advanced", "q": "Bind variables vs literals and SQL injection?", "a": "Bind variables let the DB reuse the parsed plan (less hard-parsing) and prevent SQL injection. Never concatenate user input; use `PreparedStatement`/named parameters. Dynamic ORDER BY needs a whitelist."}, {"n": 17, "level": "advanced", "q": "How do you do online schema change on a big table?", "a": "Add nullable columns (cheap), backfill in small batches, add index concurrently (`CREATE INDEX CONCURRENTLY` in Postgres, `ONLINE` in Oracle), use expand/contract, avoid long locks, run in a low-traffic window, and rehearse on a copy."}, {"n": 18, "level": "advanced", "q": "Backup, recovery and replication basics you should know?", "a": "RPO (data loss tolerated) and RTO (downtime tolerated) drive design. Oracle: RMAN backups, Data Guard standby; Postgres: WAL archiving, streaming replicas, PITR; Aurora/RDS: automated backups and Multi-AZ failover (30-60 s; connections must reconnect). **A backup is real only if the restore has been tested.**"}, {"n": 19, "level": "design", "q": "Design the schema for a multi-tenant SaaS (e.g. ERP).", "a": "Options: shared tables with `tenant_id` (cheapest, needs row-level security and tenant-leading indexes), schema-per-tenant (better isolation, harder migrations), database-per-tenant (strongest isolation, costly). Choose by tenant count and compliance. Always enforce the tenant filter centrally (Hibernate filter/RLS) and test cross-tenant leaks."}, {"n": 20, "level": "design", "q": "Design reporting on a busy OLTP database without slowing it.", "a": "Read replica or standby for reports, summary/materialized tables refreshed incrementally, CDC to a warehouse, caching of dashboards, query timeouts and resource limits (Oracle Resource Manager), and scheduled heavy jobs off-peak."}]}, {"id": "11-nosql", "title": "NoSQL (Couchbase, MongoDB, Cassandra) - from SQL to NoSQL thinking", "focus": "Weak-area topic - concepts first, then Couchbase specifics, with honest-answer guidance", "intro": "Strategy: your base is SQL and limited Couchbase exposure. Interviewers accept \"I know the model and trade-offs; I have used X at a basic level\" - they punish bluffing about operations you never did. Always map NoSQL ideas back to SQL ones you know well.", "questions": [{"n": 1, "level": "basic", "q": "What is NoSQL and why use it?", "a": "Databases that are not table/relational: document, key-value, wide-column, graph. Reasons: flexible schema, horizontal scale by sharding, high write throughput, low-latency key access. Cost: weaker joins/transactions, query flexibility depends on your access patterns."}, {"n": 2, "level": "basic", "q": "Name the NoSQL types with one example each.", "a": "Key-value (Redis, DynamoDB), Document (MongoDB, Couchbase), Wide-column (Cassandra, HBase), Graph (Neo4j), Search (Elasticsearch/OpenSearch). Couchbase combines key-value access, JSON documents, N1QL (SQL for JSON) and full-text search."}, {"n": 3, "level": "basic", "q": "SQL vs NoSQL - how do you choose?", "a": "SQL: strong consistency, complex joins/transactions, stable schema, reporting (orders, payments, ERP). NoSQL: massive scale, flexible/evolving documents, known access patterns, high availability across regions (profiles, catalogs, sessions, events). Many systems use both (polyglot persistence)."}, {"n": 4, "level": "intermediate", "q": "Explain the CAP theorem and what \"eventual consistency\" means.", "a": "In a network partition you must choose Consistency or Availability (partition tolerance is not optional). CP systems refuse some requests to stay consistent; AP systems answer but may return stale data. **Eventual consistency**: replicas converge if no new writes arrive. PACELC adds: even without partitions you trade latency vs consistency."}, {"n": 5, "level": "intermediate", "q": "How do you model data in a document database?", "a": "Model for your **queries**, not for normalisation. Embed data read together (order + line items); reference data that is large, shared or changes independently (customer). Watch the document size limit (16 MB in MongoDB) and unbounded arrays. Denormalise on purpose and own the update path."}, {"n": 6, "level": "intermediate", "q": "What is Couchbase and what are its main building blocks?", "a": "A distributed JSON document database with a memory-first architecture. Terms: **bucket -> scope -> collection** (like database -> schema -> table), documents keyed by id, **vBuckets** (1024 shards spread over nodes), services (Data, Query, Index, Search, Eventing, Analytics) that can be scaled separately (Multi-Dimensional Scaling), and XDCR for cross-cluster replication."}, {"n": 7, "level": "intermediate", "q": "How do you query in Couchbase?", "a": "Primary access is by key (fastest, `get`). For queries use **SQL++ / N1QL**: `SELECT o.id, o.total FROM orders o WHERE o.customerId = $1 AND o.status = \"PAID\"`. N1QL needs a **GSI** (global secondary index) matching the filter; without an index you get a primary scan (slow) or an error. Use `EXPLAIN` to confirm the index is used, and covering indexes to avoid fetching documents."}, {"n": 8, "level": "intermediate", "q": "Couchbase consistency, durability and concurrency?", "a": "Single-document operations are atomic. Use **CAS** (compare-and-swap) for optimistic locking. Durability levels (`majority`, `majorityAndPersistToActive`, `persistToMajority`) trade latency for safety. Multi-document ACID transactions exist (since 6.5) but are slower - design aggregates as one document where possible. N1QL queries may be stale unless `scan_consistency=REQUEST_PLUS`."}, {"n": 9, "level": "intermediate", "q": "How do you use Couchbase from Spring Boot?", "a": "Spring Data Couchbase (`CouchbaseRepository`, `@Document`, `@Field`, N1QL `@Query`) or the Java SDK directly for key-value access and reactive/async use. Configure connection string, bucket/scope/collection, timeouts and a shared `Cluster` bean (one per app). Handle `DocumentNotFoundException`, `CasMismatchException` and `TimeoutException` with retry only when safe."}, {"n": 10, "level": "intermediate", "q": "MongoDB essentials?", "a": "Collections of BSON documents, `_id`, rich query/aggregation pipeline (`$match`, `$group`, `$lookup`), indexes (compound, TTL, text), replica sets (primary + secondaries, automatic failover), sharding by shard key (a bad key creates hot shards), multi-document transactions on replica sets, write concern (`w:majority`) and read concern/preference."}, {"n": 11, "level": "intermediate", "q": "Cassandra essentials?", "a": "Wide-column, masterless ring, consistent hashing, tunable consistency (`ONE`, `QUORUM`, `LOCAL_QUORUM`), writes go to commitlog + memtable then SSTables (very fast writes). Model **one table per query**; partition key decides distribution, clustering key decides order inside a partition. No joins, avoid `ALLOW FILTERING`, avoid unbounded partitions and tombstone-heavy deletes. Great for time-series and write-heavy workloads."}, {"n": 12, "level": "intermediate", "q": "What is a quorum and how does `R + W > N` give consistency?", "a": "With N replicas, reading R and writing W nodes so that R + W > N guarantees the read overlaps the latest write. N=3, QUORUM (2) reads + QUORUM (2) writes -> strong consistency for that key; ONE/ONE is faster but may be stale."}, {"n": 13, "level": "intermediate", "q": "Compare sharding strategies and rebalancing.", "a": "Hash sharding (even spread, no range scans), range sharding (range scans, hot spots), directory/lookup sharding. Consistent hashing/vBuckets minimise data movement when nodes join or leave. Choose a key with high cardinality that matches your main access path."}, {"n": 14, "level": "advanced", "q": "How do you handle schema evolution in a schemaless store?", "a": "\"Schemaless\" really means schema-on-read: the application owns the schema. Keep a `schemaVersion` in each document, write readers that tolerate old versions (lazy migration on read) or run a background migration, and test with real old documents. Document the model like an API."}, {"n": 15, "level": "advanced", "q": "How do you do transactions/relationships without joins?", "a": "Prefer one-document aggregates (atomic). For cross-document consistency use sagas/outbox, idempotent updates, CAS, and reconciliation. Use references and application-side joins (or `$lookup`/N1QL JOIN for small sets) sparingly."}, {"n": 16, "level": "advanced", "q": "Caching with Redis - patterns and pitfalls?", "a": "Cache-aside (read -> miss -> load -> set with TTL; on write invalidate), write-through, write-behind. Pitfalls: stampede (use a lock/single-flight or jittered TTLs), stale data, big keys, hot keys, eviction policy surprises, treating a cache as the source of truth. Redis also does rate limits, distributed locks (lease + fencing token) and pub/sub."}, {"n": 17, "level": "advanced", "q": "How do you migrate a feature from Oracle to Couchbase/MongoDB?", "a": "Pick one bounded context with key-based access, model aggregates around queries, dual-write or CDC to populate, shadow-read and compare, switch reads then writes, keep the old store for rollback, and measure latency/consistency. Do not move relational reporting workloads."}, {"n": 18, "level": "design", "q": "Design a user-profile/session store for 50M users with <10 ms reads, multi-region.", "a": "Key = userId, one JSON document per user (preferences, flags), key-value reads, TTL for sessions. Cluster in each region with XDCR/multi-region replication, local reads and conflict resolution (last-write-wins by timestamp or CRDT-like merge for counters), cache hot profiles, back it with an event stream for downstream consumers. Capacity: memory quota for the working set, 3 replicas, monitor ejection/resident ratio."}, {"n": 19, "level": "design", "q": "Design a product catalog with flexible attributes and search.", "a": "Documents per product with an `attributes` map (different per category), index category/brand/price in the DB, and replicate to OpenSearch/Elasticsearch for full-text, facets and ranking via CDC or events. Writes go to the source of truth; search is eventually consistent and rebuildable."}, {"n": 20, "level": "intermediate", "q": "Honest answer: \"How much NoSQL have you actually done?\"", "a": "Say it plainly: \"My production database work is mostly Oracle and PostgreSQL. I've had basic exposure to Couchbase - key-value access and N1QL with indexes - and I've used OpenSearch/Elasticsearch and cache stores. I understand the modelling and consistency trade-offs, and I would ramp up quickly because the hard part - data modelling around access patterns and idempotent writes - is the same discipline I use in SQL.\""}]}, {"id": "12-cloud-azure-aws", "title": "Cloud - Azure (weak area) mapped to AWS (your strength)", "focus": "Translate your AWS experience (S3, Lambda, SES, MWAA, CloudWatch, IAM, ECS) into Azure terms", "intro": "Your strength is AWS (S3, EC2, Lambda, SES, MWAA, CloudWatch, IAM, Bedrock, ECS Fargate/RDS from the hackathon). Use the mapping table to answer Azure questions honestly: \"I've worked on AWS; the Azure equivalent is X, and here's how it differs.\"", "questions": [{"n": 1, "level": "basic", "q": "Map the common AWS services to Azure.", "a": "| Need | AWS | Azure |\n|---|---|---|\n| VMs | EC2 | Virtual Machines |\n| Object storage | S3 | Blob Storage |\n| Serverless functions | Lambda | Azure Functions |\n| Containers (managed) | ECS/Fargate | Container Apps / ACI |\n| Kubernetes | EKS | AKS |\n| Relational DB | RDS/Aurora | Azure SQL / Azure Database for PostgreSQL |\n| NoSQL | DynamoDB | Cosmos DB |\n| Queue / pub-sub | SQS/SNS | Service Bus / Event Grid |\n| Streaming | MSK/Kinesis | Event Hubs (Kafka-compatible) |\n| Identity | IAM | Entra ID (Azure AD) + RBAC |\n| Secrets/keys | Secrets Manager/KMS | Key Vault |\n| Monitoring | CloudWatch | Azure Monitor / Application Insights / Log Analytics |\n| Workflow | MWAA/Step Functions | Data Factory / Logic Apps / Durable Functions |\n| Email | SES | Azure Communication Services |\n| IaC | CloudFormation/Terraform | ARM/Bicep/Terraform |"}, {"n": 2, "level": "basic", "q": "What are regions, availability zones and resource groups in Azure?", "a": "Region = geographic area; Availability Zones = separate datacentres inside a region (deploy across zones for HA). **Resource group** = logical container for resources that share a lifecycle (delete the group to delete everything); a subscription holds many groups; tags and policies apply on top."}, {"n": 3, "level": "intermediate", "q": "How does Azure identity and access (RBAC) work?", "a": "Users/apps are identities in **Microsoft Entra ID**; permissions are **role assignments** (role + identity + scope: management group/subscription/resource group/resource). Apps use a **managed identity** (system- or user-assigned) instead of secrets - similar to an IAM role attached to EC2/Lambda. Secrets go into **Key Vault**."}, {"n": 4, "level": "intermediate", "q": "Which Azure services would host a Spring Boot microservice?", "a": "Azure App Service (simplest PaaS), **Azure Container Apps** (serverless containers with KEDA scaling, Dapr optional), **AKS** (full Kubernetes control), Azure Spring Apps (managed Spring; note its retirement path - verify the current status before recommending it). Choose Container Apps for most teams, AKS when you need Kubernetes features/mesh/custom operators."}, {"n": 5, "level": "intermediate", "q": "Azure messaging: Service Bus vs Event Hubs vs Event Grid?", "a": "Service Bus: enterprise queues/topics with sessions, dead-lettering, transactions, scheduled delivery (like RabbitMQ/SQS+SNS). Event Hubs: high-throughput event streaming with partitions and consumer groups, **Kafka protocol compatible** (like Kafka/Kinesis). Event Grid: reactive events/routing from Azure resources (like EventBridge)."}, {"n": 6, "level": "intermediate", "q": "Azure data services for a Java app?", "a": "Azure SQL / PostgreSQL Flexible Server (managed relational, zone-redundant HA, read replicas), **Cosmos DB** (multi-model, global distribution, tunable consistency levels: strong, bounded staleness, session, consistent prefix, eventual; throughput in RUs), Blob Storage, Redis Cache. Cosmos DB's partition key choice is the key design decision."}, {"n": 7, "level": "intermediate", "q": "How would you monitor a Java app on Azure?", "a": "Application Insights (Java agent: auto-instrumentation, traces, dependencies, exceptions), Azure Monitor metrics/alerts, Log Analytics with KQL queries, dashboards/Workbooks, and OpenTelemetry export if you want vendor neutrality. Equivalent to CloudWatch + X-Ray or Datadog, which you've used."}, {"n": 8, "level": "intermediate", "q": "Azure Functions vs AWS Lambda - differences that matter?", "a": "Same idea (triggers: HTTP, queue, timer, Blob, Event Hub). Hosting plans: Consumption (scale to zero, cold starts), Premium (pre-warmed instances), Dedicated. **Durable Functions** give stateful orchestration (like Step Functions). Java supported; mind cold starts and connection reuse across invocations."}, {"n": 9, "level": "intermediate", "q": "How do you secure an application in the cloud (any provider)?", "a": "Least-privilege identities (no long-lived keys), private networking (VNet/VPC, private endpoints), secrets in a vault with rotation, encryption in transit and at rest with managed keys, WAF/gateway at the edge, policy-as-code (Azure Policy/SCP), audit logs, vulnerability scanning of images and dependencies, and separate subscriptions/accounts per environment."}, {"n": 10, "level": "intermediate", "q": "How would you build a CI/CD pipeline for Azure?", "a": "Azure DevOps Pipelines or GitHub Actions (you've used GitHub Actions/Jenkins): build + test + scan -> push image to Azure Container Registry -> deploy via Helm/Kustomize or Bicep/Terraform to staging -> approval gate -> production with canary/blue-green. Use OIDC federation instead of storing cloud secrets in the pipeline."}, {"n": 11, "level": "intermediate", "q": "Explain Infrastructure as Code and why.", "a": "Describe infra in version-controlled files (Terraform, Bicep, CloudFormation) so environments are reproducible, reviewable and auditable; plan -> review -> apply; remote state with locking; modules for reuse; drift detection. Your hackathon agent generated Terraform for ECS Fargate + RDS + ALB - a good concrete example."}, {"n": 12, "level": "advanced", "q": "Cloud cost optimisation (FinOps) - what do you do?", "a": "Right-size instances/pods, autoscale, use spot/low-priority for stateless/batch, reserved/savings plans for steady load, lifecycle rules (S3/Blob tiers), delete idle resources, tag everything for cost allocation, set budgets/alerts, watch egress and log-ingestion costs, and make cost a design review item."}, {"n": 13, "level": "advanced", "q": "Multi-region and disaster recovery strategies?", "a": "Backup & restore (cheapest, slow RTO) -> pilot light -> warm standby -> active-active (fastest, most complex, needs conflict handling). Choose by RTO/RPO and cost. Components: global traffic routing (Traffic Manager/Front Door, Route 53), replicated data, IaC to rebuild, regular failover drills."}, {"n": 14, "level": "intermediate", "q": "Serverless vs containers vs VMs - how do you choose?", "a": "Serverless: event-driven, spiky, low ops, watch cold starts/time limits/vendor lock-in. Containers: portable, steady services, more control. VMs: legacy/special OS needs. For a Java service with steady traffic, containers; for glue/ETL triggers, functions."}, {"n": 15, "level": "advanced", "q": "How do you connect on-prem/legacy systems securely to the cloud?", "a": "Site-to-site VPN or dedicated links (ExpressRoute / Direct Connect), private DNS, private endpoints, IP allow-lists, mTLS, and a message broker or API gateway as the integration boundary. Plan for latency and failure of the link."}, {"n": 16, "level": "design", "q": "Design a file-ingestion workflow on Azure equivalent to your S3/MWAA/Lambda solution.", "a": "Files arrive in Blob Storage (SFTP support or upload via pre-signed SAS URL) -> Event Grid triggers an Azure Function or a Container Apps job -> parsers convert to normalised JSON -> publish to Event Hubs/Service Bus -> consumers write to Azure SQL/Cosmos with idempotent upserts -> Data Factory or Durable Functions orchestrate multi-step workflows -> alerts via Azure Monitor/Communication Services -> dead-letter and replay. Same architecture, different names."}, {"n": 17, "level": "intermediate", "q": "Honest answer: \"Have you worked on Azure?\"", "a": "\"My hands-on cloud experience is AWS - S3, Lambda, MWAA, SES, CloudWatch, IAM and ECS in production. On Azure I've had only basic exposure. The concepts transfer directly - identity, networking, managed services, IaC, observability - and I can map each service I've used to its Azure equivalent. I'd be productive in a few weeks and would start with Microsoft Learn's AZ-204 path.\""}, {"n": 18, "level": "intermediate", "q": "What is Azure Key Vault and managed identity in a Spring app?", "a": "Store secrets/keys/certs in Key Vault; the app authenticates with its **managed identity** (no credentials in config), and Spring Cloud Azure can load secrets as properties. Same pattern as reading Secrets Manager via an IAM role."}, {"n": 19, "level": "advanced", "q": "Explain private networking: VNet, subnets, NSG, private endpoint.", "a": "VNet = isolated network; subnets segment it; NSGs are allow/deny rules per subnet/NIC; **private endpoints** give a PaaS service (SQL, Storage) a private IP in your VNet so traffic never crosses the public internet. AWS equivalents: VPC, subnets, security groups/NACLs, VPC endpoints/PrivateLink."}, {"n": 20, "level": "design", "q": "Design a landing zone / environment strategy for a team.", "a": "Separate subscriptions (or AWS accounts) for dev/test/prod, a shared network hub, central logging, policies (allowed regions, required tags, no public storage), RBAC groups (not individual users), budgets, IaC for everything, and a pipeline that is the only way to change production."}]}, {"id": "13-k8s-openshift", "title": "Docker, Kubernetes & OpenShift for Java Services", "focus": "Weak-ish area (K8s 4/10, OpenShift none) - core objects, deployment, troubleshooting, OpenShift differences", "intro": "", "questions": [{"n": 1, "level": "basic", "q": "Container vs VM? What is a Docker image vs container?", "a": "A container shares the host kernel and isolates processes with namespaces/cgroups: lighter and faster to start than a VM. Image = immutable layered template; container = running instance of an image."}, {"n": 2, "level": "basic", "q": "How do you write a good Dockerfile for a Spring Boot app?", "a": "Multi-stage or layered jar, small JRE base image (distroless/Temurin JRE), **non-root user**, copy dependencies layer before app layer for caching, set `JAVA_TOOL_OPTIONS`/`MaxRAMPercentage`, a `HEALTHCHECK` or K8s probes, no secrets in layers. Or skip the Dockerfile: `./mvnw spring-boot:build-image` (Buildpacks) / Jib."}, {"n": 3, "level": "basic", "q": "Name the main Kubernetes objects.", "a": "Pod (smallest unit, 1+ containers), Deployment (replicas + rolling updates via ReplicaSet), Service (stable virtual IP/DNS), Ingress/Gateway API (HTTP routing), ConfigMap/Secret, Namespace, StatefulSet (stable identity/storage), DaemonSet, Job/CronJob, PersistentVolume(Claim), HPA, Node."}, {"n": 4, "level": "intermediate", "q": "Explain liveness, readiness and startup probes.", "a": "Liveness failing -> kubelet **restarts** the container. Readiness failing -> pod is removed from Service endpoints (no restart). Startup probe gives slow-starting apps time before liveness starts. With Spring Boot: `management.endpoint.health.probes.enabled=true` -> `/actuator/health/liveness` and `/readiness`. Don't make liveness depend on the database - a DB blip would restart every pod."}, {"n": 5, "level": "intermediate", "q": "Requests vs limits and how they affect scheduling and OOM?", "a": "`requests` = what the scheduler reserves (affects placement); `limits` = hard cap. CPU over the limit is throttled; memory over the limit gets **OOMKilled**. Set memory request = limit for Java (predictable), CPU limit carefully (throttling hurts latency); align JVM `MaxRAMPercentage` with the limit."}, {"n": 6, "level": "intermediate", "q": "How does a rolling update work and how do you roll back?", "a": "The Deployment creates new pods gradually (`maxSurge`, `maxUnavailable`), waiting for readiness before removing old ones. Roll back with `kubectl rollout undo deployment/orders` (history via `rollout history`). For stronger control use canary/blue-green (Argo Rollouts, Flagger, service mesh)."}, {"n": 7, "level": "intermediate", "q": "How do you scale in Kubernetes?", "a": "HPA scales replicas on CPU/memory or custom metrics (RPS, queue lag via KEDA); VPA adjusts requests; Cluster Autoscaler/Karpenter adds nodes. Kafka consumers: scale by lag with KEDA but never beyond partitions. Ensure pods are stateless and start quickly."}, {"n": 8, "level": "intermediate", "q": "ConfigMap vs Secret, and how do you manage secrets safely?", "a": "ConfigMap: non-sensitive config; Secret: base64-encoded (NOT encrypted by default) sensitive data. Enable encryption at rest, restrict RBAC, prefer external secret managers (External Secrets Operator, CSI driver for Vault/AWS/Azure Key Vault), mount as files or env vars, rotate regularly."}, {"n": 9, "level": "intermediate", "q": "How do pods communicate and how is traffic exposed?", "a": "Pods get cluster IPs; a `Service` (ClusterIP) gives a stable name and load-balances across ready pods; `NodePort`/`LoadBalancer` expose externally; **Ingress** (or Gateway API) provides L7 routing/TLS. NetworkPolicies restrict pod-to-pod traffic (default allow-all otherwise)."}, {"n": 10, "level": "intermediate", "q": "A pod is in CrashLoopBackOff. How do you debug?", "a": "`kubectl describe pod` (events, last state/exit code), `kubectl logs <pod> --previous`, check exit code 137 (OOMKilled/SIGKILL), 1 (app error), probe failures, missing config/secret, wrong image/command. `kubectl get events --sort-by=.lastTimestamp`; `kubectl exec`/ephemeral `kubectl debug` for a shell. Fix the root cause rather than raising the limits blindly."}, {"n": 11, "level": "intermediate", "q": "Pod stuck in Pending / ImagePullBackOff?", "a": "Pending: insufficient CPU/memory on nodes, unsatisfied node selector/affinity/taints, unbound PVC - read `describe` events. ImagePullBackOff: wrong tag, private registry without `imagePullSecret`, no network to the registry."}, {"n": 12, "level": "intermediate", "q": "What are Helm and Kustomize?", "a": "Helm = package manager with templated charts and values per environment (releases, rollback). Kustomize = patch-based overlays on plain YAML (no templating). GitOps (Argo CD/Flux) applies the desired state from Git and continuously reconciles drift."}, {"n": 13, "level": "advanced", "q": "What is a StatefulSet and when do you avoid running databases in K8s?", "a": "StatefulSet gives stable pod names, ordered rollout and per-pod persistent volumes - used for Kafka, Cassandra, databases. Operating stateful systems yourself is hard (backups, upgrades, failover); prefer managed services (RDS, MSK, Cosmos) unless you have an operator and the skills."}, {"n": 14, "level": "advanced", "q": "Pod disruption, anti-affinity and topology spread - why?", "a": "To survive node/zone loss and maintenance: `podAntiAffinity` or `topologySpreadConstraints` spread replicas across nodes/zones; `PodDisruptionBudget` keeps a minimum number available during voluntary disruptions (node drain); `preStop` hook + graceful termination avoid dropped requests."}, {"n": 15, "level": "advanced", "q": "RBAC and security best practices in Kubernetes?", "a": "Namespaces per team/env, least-privilege Roles/ServiceAccounts, no `cluster-admin` for apps, Pod Security Standards (non-root, read-only root filesystem, drop capabilities), NetworkPolicies, image scanning and signing, admission policies (Kyverno/OPA Gatekeeper), secrets management, and audit logs."}, {"n": 16, "level": "basic", "q": "What is OpenShift and how does it differ from Kubernetes?", "a": "OpenShift = Red Hat's enterprise Kubernetes distribution with batteries included: built-in image registry and build tooling (S2I, BuildConfigs), **Routes** (HAProxy-based, predate Ingress), **Projects** (namespaces + extra metadata), integrated CI/CD (OpenShift Pipelines = Tekton, GitOps = Argo CD), an operator catalogue (OperatorHub), a web console, and stricter default security. Same core API: your Kubernetes skills transfer."}, {"n": 17, "level": "intermediate", "q": "OpenShift security difference to know: SCCs and non-root.", "a": "OpenShift runs containers with an **arbitrary non-root UID** by default under **Security Context Constraints (SCC)** (default `restricted`). Images that need root or fixed UID fail - build images to run as non-root and with group-0 writable directories. This is the #1 migration problem from plain Docker/K8s."}, {"n": 18, "level": "intermediate", "q": "Route vs Ingress; DeploymentConfig vs Deployment; `oc` basics?", "a": "Routes expose services (edge/passthrough/re-encrypt TLS, weighted routes for canary). DeploymentConfig is legacy - use standard Deployments. `oc login`, `oc project`, `oc get pods`, `oc logs`, `oc rsh`, `oc new-app`, `oc rollout` mirror `kubectl`."}, {"n": 19, "level": "design", "q": "Design the deployment of 10 Spring Boot services on Kubernetes/OpenShift.", "a": "Namespace per environment, Helm/Kustomize per service, Deployments with 3 replicas across zones, HPA + PDB, readiness/liveness/startup probes, resource requests/limits tuned from load tests, Ingress/Route + TLS at the edge, ConfigMaps/Secrets from a vault, centralised logging and Prometheus metrics, GitOps pipeline with canary and automated rollback, NetworkPolicies and non-root images."}, {"n": 20, "level": "intermediate", "q": "Honest answer on OpenShift.", "a": "\"I've worked with Kubernetes - deployments, services, probes, config, troubleshooting. I haven't operated OpenShift directly. I know it's Kubernetes plus Routes, SCC-based security, Operators and integrated CI/CD, so the main adjustments are building non-root images and using `oc`/Routes. I'd be productive quickly.\""}]}, {"id": "14-observability", "title": "Observability - Splunk, Grafana, Prometheus (+ your Datadog & CloudWatch)", "focus": "Zero-experience tools; explain concepts via Datadog/CloudWatch you have used, plus SLOs and alerting", "intro": "You have used Datadog and CloudWatch. Splunk (logs), Prometheus (metrics) and Grafana (dashboards) solve the same problems. Learn the vocabulary below and map: Datadog metrics = Prometheus + Grafana; Datadog/CloudWatch Logs = Splunk; Datadog APM = Tempo/Jaeger/OpenTelemetry.", "questions": [{"n": 1, "level": "basic", "q": "What are metrics, logs and traces?", "a": "Metrics: numbers over time (cheap, good for alerting). Logs: detailed events (good for \"what happened\"). Traces: one request's path through services with timings (good for \"where is it slow\"). Use a shared `traceId` to jump between the three."}, {"n": 2, "level": "basic", "q": "What is Prometheus and how does it collect data?", "a": "An open-source time-series database and alerting system that **pulls** (scrapes) `/metrics` over HTTP from targets at an interval. Targets are found by service discovery (Kubernetes). Data model: metric name + labels, queried with **PromQL**. Short-lived jobs push to a Pushgateway. Long-term storage via Thanos/Mimir/Cortex."}, {"n": 3, "level": "intermediate", "q": "Prometheus metric types?", "a": "Counter (only goes up: requests_total), Gauge (up/down: queue size), Histogram (bucketed observations: latency; aggregable across instances), Summary (client-side quantiles; not aggregable). Prefer histograms for latency SLOs."}, {"n": 4, "level": "intermediate", "q": "Write the PromQL you use most.", "a": "```promql\n# requests per second per service\nsum by (service) (rate(http_server_requests_seconds_count[5m]))\n# error ratio\nsum(rate(http_server_requests_seconds_count{status=~\"5..\"}[5m]))\n  / sum(rate(http_server_requests_seconds_count[5m]))\n# p95 latency from a histogram\nhistogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket[5m])))\n```\nUse `rate()` on counters, never graph a raw counter."}, {"n": 5, "level": "intermediate", "q": "How do you expose Prometheus metrics from Spring Boot?", "a": "Add Actuator + `micrometer-registry-prometheus`; expose `/actuator/prometheus`. Micrometer provides JVM, HTTP, datasource (Hikari), Kafka and custom metrics (`Counter`, `Timer`, `Gauge`). Tag with low-cardinality labels only (route template, status) - **never** userId/orderId/raw URL."}, {"n": 6, "level": "intermediate", "q": "What is Grafana and what do you build in it?", "a": "A visualisation and alerting tool that queries many data sources (Prometheus, Loki, Elasticsearch/OpenSearch, CloudWatch, Datadog, SQL, Tempo). You build dashboards (panels, variables for env/service), alert rules and annotations (deploy markers). Dashboards-as-code (JSON/Terraform/Grafonnet) keep them reviewable."}, {"n": 7, "level": "intermediate", "q": "Which dashboards do you build first for a service?", "a": "Golden signals / RED: **Rate**, **Errors**, **Duration** per endpoint; **saturation**: CPU, memory, GC pause, thread pool and connection pool usage, queue/consumer lag. Plus dependencies (DB, downstream latency), deploy markers, and JVM heap after GC."}, {"n": 8, "level": "basic", "q": "What is Splunk and what is SPL?", "a": "A platform to ingest, index, search and analyse machine data (logs, events, metrics). Forwarders ship logs to indexers; search heads run queries in **SPL** (Search Processing Language). Used heavily for security and operations in large enterprises."}, {"n": 9, "level": "intermediate", "q": "Write a few Splunk SPL examples.", "a": "```\nindex=prod sourcetype=app service=orders level=ERROR earliest=-15m\n| stats count by exception, host\n| sort - count\n\nindex=prod service=orders | timechart span=1m avg(duration_ms) p95(duration_ms)\n\nindex=prod traceId=\"abc123\" | sort _time\n```\nMapping: `stats` ~ SQL `GROUP BY`; pipes pass results to the next command. Also `rex` (regex extraction), `eval`, `top`, `transaction`, `dedup`."}, {"n": 10, "level": "intermediate", "q": "How do you design logging so it works in Splunk/ELK/Datadog?", "a": "Structured JSON logs (one event per line) with `timestamp`, `level`, `service`, `env`, `traceId`, `spanId`, `userId` (hashed if sensitive), `event`, `durationMs`; log to stdout in containers; consistent levels; no secrets/PII; sample noisy logs; set retention by value. Use MDC for correlation ids."}, {"n": 11, "level": "intermediate", "q": "What is OpenTelemetry and why does it matter?", "a": "A vendor-neutral standard (API/SDK/Collector) for traces, metrics and logs. Instrument once (Java agent or Micrometer tracing), send via the **OTel Collector** to Datadog, Grafana Tempo/Prometheus, Splunk or X-Ray without changing code. Propagates `traceparent` over HTTP and Kafka headers."}, {"n": 12, "level": "intermediate", "q": "What is an SLI, SLO, SLA and error budget?", "a": "SLI = a measured indicator (percent of requests < 300 ms and non-5xx). SLO = target (99.9% over 30 days). SLA = contract with penalties. Error budget = `1 - SLO` (43 minutes per 30 days at 99.9%); spend it on releases, freeze risky changes when it is burned."}, {"n": 13, "level": "advanced", "q": "How do you write good alerts and avoid alert fatigue?", "a": "Alert on **symptoms users feel** (error rate, latency SLO burn) rather than every cause (CPU 80%). Use multi-window burn-rate alerts (fast: 5m+1h; slow: 6h+3d). Every alert must be actionable, have an owner and a runbook link, severity levels (page vs ticket), and be reviewed after incidents; delete noisy ones."}, {"n": 14, "level": "advanced", "q": "Cardinality - what is it and why can it take Prometheus down?", "a": "Each unique label combination is a separate time series. Labelling by `userId` or full URL creates millions of series -> memory blow-up and slow queries. Use route templates and bounded enums; put per-entity detail in logs/traces."}, {"n": 15, "level": "intermediate", "q": "How would you monitor a Kafka consumer service?", "a": "Metrics: consumer lag, records/sec, processing duration histogram, error and DLT counts, rebalances; JVM/pool metrics; logs with topic/partition/offset on failure; a lag alert that fires when lag keeps increasing for N minutes; trace context carried in message headers."}, {"n": 16, "level": "intermediate", "q": "Datadog / CloudWatch you've used: how do they map?", "a": "Datadog agent/APM ~ OTel + Prometheus + Tempo; Datadog dashboards/monitors ~ Grafana dashboards/alert rules; CloudWatch Logs Insights ~ Splunk SPL/Loki LogQL; CloudWatch alarms ~ Prometheus Alertmanager. Be ready to describe a real incident you solved with them."}, {"n": 17, "level": "advanced", "q": "What is Alertmanager?", "a": "Receives alerts from Prometheus, then deduplicates, groups, silences, inhibits and routes them to Slack, PagerDuty or email by label. Configuration controls who is paged and avoids alert storms."}, {"n": 18, "level": "design", "q": "Design the observability platform for a 30-service Kubernetes estate.", "a": "Micrometer/OTel in every service -> OTel Collector DaemonSet -> metrics to Prometheus (long-term in Mimir/Thanos), logs to Loki/Splunk/OpenSearch, traces to Tempo/Jaeger -> Grafana as the single pane with data-source links by `traceId` -> Alertmanager to PagerDuty/Slack -> SLO dashboards per team -> cost controls (sampling, retention tiers, label limits) -> standard library/starter that adds all of it to a new service."}, {"n": 19, "level": "design", "q": "A latency spike is reported at 2 a.m. - walk through the investigation using these tools.", "a": "Check the SLO dashboard (which service/endpoint, since when) -> compare with deploy markers -> look at traces for the slow spans (DB vs downstream vs CPU) -> look at saturation: pools, GC, threads, lag -> search logs by `traceId` for errors/timeouts -> mitigate first (rollback, scale, disable feature, shed load) -> then root cause and write the RCA."}, {"n": 20, "level": "intermediate", "q": "Honest answer: \"You haven't used Splunk/Grafana/Prometheus?\"", "a": "\"Not hands-on. My production monitoring has been Datadog and CloudWatch - dashboards, monitors, log search and APM traces. Prometheus/Grafana/Splunk use the same ideas - metrics with labels and PromQL, SPL for logs - so the difference is syntax and operating the stack. I've set up Micrometer metrics and structured logging, and I'd pick up PromQL/SPL quickly.\""}]}, {"id": "15-system-design", "title": "Distributed Systems & System Design", "focus": "Core theory plus worked design questions (rated 6/10 - invest here)", "intro": "Design answer template: **1) clarify requirements and scale -> 2) APIs and data model -> 3) high-level components -> 4) deep dive on the bottleneck -> 5) failure modes and trade-offs -> 6) metrics/operations.** Say assumptions out loud.", "questions": [{"n": 1, "level": "basic", "q": "What are the fallacies of distributed computing in practice?", "a": "The network is not reliable, latency is not zero, bandwidth is finite, the network is not secure, topology changes, there are many administrators, transport has a cost, the network is not homogeneous. Practical result: timeouts, retries, idempotency, backpressure and observability on every remote call."}, {"n": 2, "level": "basic", "q": "Explain CAP and PACELC in one minute.", "a": "During a partition choose consistency (CP: reject/limit requests) or availability (AP: serve possibly stale data). PACELC: Else (no partition) choose latency vs consistency. Payments tend to CP; feeds/profiles tend to AP."}, {"n": 3, "level": "intermediate", "q": "What consistency models should you know?", "a": "Strong (linearizable), sequential, causal, read-your-writes, monotonic reads, eventual. Pick the weakest that is correct for the feature - e.g. read-your-writes for profile edits, strong for account balance."}, {"n": 4, "level": "intermediate", "q": "How do you scale a stateless service and a database?", "a": "Service: horizontal replicas behind a load balancer, autoscaling, no local state, shared cache. Database: vertical scale -> read replicas (reads) -> caching -> partitioning/sharding (writes) -> CQRS/separate stores. Remove bottlenecks in this order, measuring each step."}, {"n": 5, "level": "intermediate", "q": "Caching strategies and invalidation?", "a": "Cache-aside, read-through, write-through, write-behind; TTL + explicit invalidation on write; versioned keys; protection against stampede (single-flight/lock, jittered TTL, serve-stale-while-revalidate); two levels (local Caffeine + Redis). \"There are two hard things: cache invalidation...\" - say what staleness is acceptable."}, {"n": 6, "level": "intermediate", "q": "Load balancing algorithms and levels?", "a": "L4 (TCP) vs L7 (HTTP, path/header routing). Algorithms: round robin, least connections, weighted, consistent hashing (sticky by key, cache-friendly). Health checks remove bad nodes; connection draining for deploys."}, {"n": 7, "level": "intermediate", "q": "How do you achieve idempotency across a distributed flow?", "a": "Every command carries a unique id; each service stores processed ids (unique constraint) and returns the original result for duplicates; side effects to third parties use their idempotency keys; retries are then safe. It is the foundation of \"at-least-once + idempotent = effectively once\"."}, {"n": 8, "level": "intermediate", "q": "What are consistent hashing and why is it used?", "a": "Keys and nodes are mapped on a ring; a key belongs to the next node clockwise. Adding/removing a node moves only ~1/N keys instead of reshuffling everything. Used in caches, Cassandra, Couchbase vBuckets, load balancers; virtual nodes even out the load."}, {"n": 9, "level": "intermediate", "q": "Explain leader election, consensus and distributed locks.", "a": "Consensus (Raft/Paxos; used by etcd, ZooKeeper-style systems, Kafka KRaft) lets nodes agree on one value/leader despite failures. For app-level locks use a lease (Redis `SET NX PX`, DB row, etcd/ZooKeeper) with a **fencing token** so a paused old holder can't corrupt data. Prefer designs that avoid locks (partitioning, idempotency)."}, {"n": 10, "level": "advanced", "q": "What happens with clock skew and ordering of events?", "a": "Wall clocks differ between machines; never use timestamps alone to order concurrent updates. Use per-entity version numbers, sequence/offset (Kafka partition offset), logical/vector clocks, or a single writer per key. Last-write-wins by timestamp can silently drop updates."}, {"n": 11, "level": "advanced", "q": "Backpressure, load shedding and bulkheads?", "a": "Backpressure: slow producers when consumers can't keep up (bounded queues, Kafka lag-based scaling, reactive streams). Load shedding: reject low-priority work early (429/503) to protect the core. Bulkheads: separate pools/queues per dependency or tenant so one slow dependency cannot exhaust shared resources."}, {"n": 12, "level": "advanced", "q": "Retry storms and thundering herd - prevention?", "a": "Exponential backoff **with jitter**, retry budgets (cap retries to a % of traffic), circuit breakers, request deadlines propagated downstream, and don't retry at every layer (multiplies load). Cache locking and staggered TTLs prevent herd on cache expiry."}, {"n": 13, "level": "advanced", "q": "How do you handle hot partitions / hot keys?", "a": "Detect via per-partition metrics; add a salt to the key or split by sub-key when ordering allows, local caching for hot reads, rate limit heavy tenants, choose a higher-cardinality partition key, dedicated partitions/queues for top tenants."}, {"n": 14, "level": "advanced", "q": "Eventual consistency in the UI - how do you handle it?", "a": "Return `202` + status endpoint, optimistic UI updates, show \"processing\" states, read-your-writes via reading from the primary for a short window or passing a version token, and make the UI tolerant of reordering/duplicates."}, {"n": 15, "level": "design", "q": "Design a URL shortener.", "a": "Requirements: 100M new URLs/month, 10:1 read:write, <50 ms redirects, no collisions. API: `POST /urls`, `GET /{code}` -> 301/302. Code generation: base62 of a distributed counter/ID range per node (no collisions) or hash + collision check. Storage: key-value (code -> url, owner, expiry). Reads: cache hot codes (Redis/CDN), replicas. Analytics: async click events to Kafka. Trade-offs: 301 (cacheable, less analytics) vs 302; custom aliases; expiry cleanup; abuse/rate limiting."}, {"n": 16, "level": "design", "q": "Design a notification service (email/SMS/push).", "a": "Producers publish `NotificationRequested` events (Kafka) -> router resolves user preferences/templates -> per-channel queues with workers calling providers (SES/Twilio/FCM) behind circuit breakers and per-provider rate limits -> status updates stored -> retry with backoff then DLQ -> dedupe by notification id -> user opt-out/quiet hours -> metrics: delivery rate, latency, failures per provider."}, {"n": 17, "level": "design", "q": "Design a rate-limited API gateway for partners.", "a": "Auth (API keys/OAuth2 client credentials) -> per-partner token bucket in Redis (Lua for atomicity) -> quotas per plan (daily/monthly) -> `429` with `Retry-After` -> async usage metering to Kafka for billing -> dashboards and alerts. Decide behaviour when Redis is down (fail-open for low risk, fail-closed for abuse-sensitive)."}, {"n": 18, "level": "design", "q": "Design a file processing platform (bulk files from many sources to a database/Kafka).", "a": "Ingestion adapters (SFTP, email attachments, web download, upload) -> object storage (S3) with metadata record -> event triggers a parser by file type/source (plugin per format) -> normalise to a canonical schema -> validate -> publish to Kafka/DB with idempotent keys -> orchestration with Airflow (retry, schedule, SLAs) -> notifications (SES) -> audit trail and replay. Handle huge files with streaming/multipart, checksum dedupe, quarantine for bad files, and per-source metrics."}, {"n": 19, "level": "design", "q": "Design a payment/wallet transfer system (strong correctness).", "a": "Double-entry ledger table (immutable entries), transfers executed in a single DB transaction per account shard or via saga across services; idempotency keys; optimistic locking/serializable for balance checks; outbox for events; reconciliation jobs; audit; strict CP choice. Discuss exactly-once illusions and how retries are made safe."}, {"n": 20, "level": "design", "q": "Design a real-time chat / notification push system (WebSocket/SSE).", "a": "Gateway layer holding WebSocket connections (sticky by connection id), a presence registry in Redis, messages through Kafka/Redis pub-sub keyed by conversation, persistence in a scalable store (Cassandra/Couchbase) ordered by conversation + time, offline delivery via push notifications, and reconnect with last-seen id to avoid gaps."}, {"n": 21, "level": "design", "q": "Design a distributed job scheduler (run a cron job once across 10 pods).", "a": "Options: leader election (Kubernetes lease), DB-based lock with `SELECT ... FOR UPDATE SKIP LOCKED`, ShedLock, Quartz in cluster mode, or a K8s CronJob (one pod per run). Make jobs idempotent, record runs and status, add timeouts/heartbeat to recover from a crashed worker, and alert on missed runs."}, {"n": 22, "level": "design", "q": "How do you design for zero-downtime deployments including database changes?", "a": "Backward-compatible API and schema (expand/contract), rolling/canary deploys with readiness gates, feature flags, graceful shutdown, versioned events, and automated rollback on SLO regression. Never deploy a code change that needs a schema change in the same step."}, {"n": 23, "level": "intermediate", "q": "What is the difference between horizontal and vertical scaling and the limit of each?", "a": "Vertical: bigger machine, simplest, hard cap and single point of failure. Horizontal: more machines, near-linear for stateless tiers, requires partitioning/replication for state and brings consistency problems."}, {"n": 24, "level": "intermediate", "q": "Back-of-envelope estimation - show the method.", "a": "Example: 10M DAU x 20 requests/day = 200M/day ~ 2,300 RPS average, ~10k RPS peak (x4). 1 KB per record x 100M new records/year = 100 GB/year. State assumptions, compute QPS, storage, bandwidth, then derive node counts with headroom. The method matters more than the exact numbers."}]}, {"id": "16-troubleshooting-rca", "title": "Production Troubleshooting & Root Cause Analysis (RCA)", "focus": "Incident method, JVM/DB/Kafka/K8s failure patterns, writing RCAs (rated 8/10 - tell real stories)", "intro": "Use the **STAR + metrics** form for stories: Situation, Task, Action (what you checked, in order), Result (time to detect/mitigate/resolve, what you prevented next time).", "questions": [{"n": 1, "level": "basic", "q": "What is your general approach when production is down?", "a": "1. Confirm impact and scope (who, since when, which region/feature). 2. Declare the incident and assign roles. 3. **Mitigate first** (rollback, scale, feature flag off, failover) - stop the bleeding before the root cause hunt. 4. Gather evidence (dashboards, logs, traces, recent changes). 5. Communicate regularly. 6. After recovery: RCA, action items, follow-up."}, {"n": 2, "level": "basic", "q": "What is an RCA and what does a good one contain?", "a": "A blameless written analysis: summary and impact, timeline (UTC), detection (how we found out and how long it took), root cause and contributing factors, what went well/badly, mitigation, **corrective actions with owners and dates** (prevent, detect faster, recover faster). Use \"5 Whys\" but stop at systemic causes, not \"human error\"."}, {"n": 3, "level": "intermediate", "q": "What is the difference between an incident, a problem and a change?", "a": "Incident = service disruption (restore ASAP). Problem = the underlying cause of one or more incidents (fix permanently). Change = any modification; most outages are triggered by a recent change - always ask \"what changed?\" first (deploy, config, data volume, certificate, dependency)."}, {"n": 4, "level": "intermediate", "q": "Service is slow - what is your checklist?", "a": "Trace which hop is slow (APM/trace) -> check saturation: CPU, memory/GC, thread pools, DB/HTTP connection pools, queue depth -> check dependencies (DB slow queries/locks, downstream latency) -> check traffic (spike, bot, retry storm) -> check recent deploys -> reproduce with a profile (JFR/flame graph). Mitigate with scale-out, cache, shed load, or rollback."}, {"n": 5, "level": "intermediate", "q": "OutOfMemoryError - how do you handle each type?", "a": "- `Java heap space`: heap dump -> MAT -> find the retainer (cache/list/session); fix leak or size.\n- `Metaspace`: classloader leak / dynamic proxies / many redeploys.\n- `unable to create native thread`: too many threads or low OS/container limit; reduce pools, check `ulimit`, use virtual threads wisely.\n- `Direct buffer memory`: Netty/NIO buffers not released.\n- Container OOMKilled (exit 137): non-heap memory plus heap exceed the limit.\nEnable `-XX:+HeapDumpOnOutOfMemoryError` and `ExitOnOutOfMemoryError`."}, {"n": 6, "level": "intermediate", "q": "Thread dump says all threads are WAITING/BLOCKED. What now?", "a": "Take several dumps and compare. Group by stack: many threads waiting on the same lock = contention (find the owner thread); all waiting on a socket read = slow downstream without a timeout; all waiting for a connection pool = pool exhausted by slow queries or leaked connections (missing close/long transactions). Add timeouts and fix the slow resource."}, {"n": 7, "level": "intermediate", "q": "Connection pool exhausted (HikariCP \"Connection is not available\").", "a": "Check `hikaricp.connections.active/pending`, long-running transactions or a connection held during a remote call, slow queries, leaked connections (`leakDetectionThreshold`), pool smaller than concurrency, DB max connections reached across pods. Fix the cause (shorten transactions, add timeouts) before enlarging the pool."}, {"n": 8, "level": "intermediate", "q": "Kafka consumer lag increases after a deploy.", "a": "Look for rebalance loops (`max.poll.interval.ms` exceeded), a new slow code path, a poison message retrying, fewer consumers than before (crash loop, readiness), DB slowness in the sink, or partition skew. Fix and, if needed, scale consumers (up to partitions) and replay safely."}, {"n": 9, "level": "intermediate", "q": "Intermittent 502/503/504 behind a load balancer.", "a": "Mismatched idle timeouts (LB timeout shorter/longer than the app's keep-alive), pods terminating without graceful drain, failing readiness, upstream timeouts, connection resets from NAT/firewall idle expiry, or overload. Align timeouts (client < LB < server), add preStop sleep, retries on idempotent calls."}, {"n": 10, "level": "intermediate", "q": "Database CPU 100% - what do you do?", "a": "Find top SQL (AWR/`v$sql`/`pg_stat_statements`), check recent plan changes, missing index, a runaway report, lock waits, connection storm. Mitigate: kill/limit the offending session, add index online, scale reads to a replica, enable caching, throttle the caller. Then fix the query and add a slow-query alert."}, {"n": 11, "level": "advanced", "q": "Deadlock between two transactions in the database.", "a": "The DB picks a victim (`ORA-00060` / `deadlock detected`). Read the deadlock trace to get both statements, then fix ordering (always lock tables/rows in the same order), shorten transactions, index foreign keys, and retry the victim transaction safely."}, {"n": 12, "level": "advanced", "q": "Memory keeps growing slowly for days then the pod restarts.", "a": "Classic leak: compare heap dumps taken hours apart (histogram diff), check static maps/caches without eviction, unclosed streams, listeners, `ThreadLocal`, large metrics label sets (cardinality), Hibernate session caches in long loops, Netty direct memory. Add a size-bounded cache with metrics and an alert on heap-after-GC trend."}, {"n": 13, "level": "advanced", "q": "Duplicate records/events in production.", "a": "Root causes: at-least-once delivery without idempotent writes, retries on non-idempotent calls, rebalance reprocessing, double-submit from UI, dual writes. Fix with idempotency keys/unique constraints, outbox pattern, and a one-time cleanup script with a dry-run and backups."}, {"n": 14, "level": "advanced", "q": "Data inconsistency between two services.", "a": "Find the first divergence in the event/timeline, check lost events (consumer offset commit before processing, DLT ignored), out-of-order events (use version/sequence), failed compensations. Add reconciliation jobs and alerts for drift; repair with replay from the log."}, {"n": 15, "level": "advanced", "q": "An expired certificate / secret rotation caused an outage - how do you prevent it?", "a": "Monitor certificate expiry (alert at 30/14/7 days), automate renewal (cert-manager/ACM), support dual-valid keys during rotation, test rotation in staging, store secrets centrally, and make apps reload credentials without restart. (Relates to the API key rotation work.)"}, {"n": 16, "level": "advanced", "q": "How do you debug something that only fails in production?", "a": "Add targeted structured logging and trace attributes behind a dynamic log level (Actuator loggers), capture the failing payload safely (masked), compare config/env/data volume with staging, use feature flags/canary to test the fix, replay traffic (shadowing), and write a regression test as soon as you reproduce."}, {"n": 17, "level": "intermediate", "q": "How do you reduce Mean Time To Detect and Mean Time To Recover?", "a": "Detect: SLO-based alerts, synthetic checks, good dashboards, deploy markers. Recover: one-click rollback, feature flags, runbooks, tested failover, on-call rota with clear escalation, game days/chaos drills, immutable infra."}, {"n": 18, "level": "design", "q": "Design a blameless post-incident process for a team of 20.", "a": "Severity definitions, incident commander + comms roles, timeline document started during the incident, a post-incident review within 3-5 working days, RCA template, action items tracked in the backlog with owners and due dates, monthly review of repeat causes, sharing learnings in a searchable archive."}, {"n": 19, "level": "design", "q": "Design a runbook for \"orders API p95 latency > 2 s\".", "a": "Impact check -> dashboard links -> decision tree (recent deploy? rollback; DB slow? top SQL, kill/limit; downstream slow? circuit breaker/fallback; CPU/GC? scale/heap analysis; traffic spike? rate limit/scale) -> commands (kubectl, jcmd) -> escalation contacts -> verification steps and when to close."}, {"n": 20, "level": "intermediate", "q": "Tell me about a production issue you solved (template).", "a": "Pick one real story: **Situation** (system, impact, scale) -> **Detection** (alert/customer) -> **Investigation** (3-4 concrete steps and tools) -> **Root cause** (precise) -> **Fix and prevention** (code + alert + test + process) -> **Result** (numbers: downtime minutes, errors avoided). Fill with an actual case from Cvent/CBOS/Sambasafety work."}, {"n": 21, "level": "intermediate", "q": "What is a good logging practice during incidents?", "a": "Correlation ids in every line, one log per event at the right level, include identifiers (orderId, partition/offset), avoid logging inside tight loops, don't swallow exceptions (log with cause once), and keep a switch to raise log level temporarily without redeploying."}, {"n": 22, "level": "advanced", "q": "Explain graceful degradation versus failing fast.", "a": "Degrade: serve cached/partial data or disable non-critical features (recommendations) so the core path (checkout) keeps working. Fail fast: when a dependency is down and no useful fallback exists, return a quick clear error instead of holding resources. Decide per feature and document it."}]}, {"id": "17-patterns-architecture", "title": "Design Patterns, SOLID, Clean/Hexagonal Architecture", "focus": "Code-level and application-level design; how a Lead guides design decisions", "intro": "", "questions": [{"n": 1, "level": "basic", "q": "Explain the SOLID principles with one example each.", "a": "S: a class has one reason to change (separate `InvoicePrinter` from `InvoiceCalculator`). O: extend behaviour without modifying code (new `DiscountStrategy`). L: subtypes must work wherever the base type is used (a `Square` that breaks `Rectangle` setters violates it). I: small client-specific interfaces. D: depend on abstractions, inject implementations (Spring DI)."}, {"n": 2, "level": "basic", "q": "Which design patterns do you use most in Java/Spring?", "a": "Strategy (pluggable algorithms, e.g. court-specific parsers), Factory/Abstract Factory, Builder, Singleton (Spring beans), Template Method (`JdbcTemplate`), Decorator/Proxy (AOP), Observer (events), Adapter (integrations), Chain of Responsibility (filters). Give a project example for each you claim."}, {"n": 3, "level": "intermediate", "q": "Strategy vs State vs Template Method?", "a": "Strategy: the caller picks an interchangeable algorithm. State: the object changes behaviour as its internal state changes (order status). Template Method: base class defines the skeleton and subclasses fill steps. Example: a `Parser` interface with `CsvParser`, `XmlParser` chosen by a registry keyed by file type."}, {"n": 4, "level": "intermediate", "q": "Implement a thread-safe Singleton and say why Spring beans make it mostly unnecessary.", "a": "Best: `enum Singleton { INSTANCE }` or the holder idiom:\n```java\nclass Config { private Config(){}\n  private static class H { static final Config I = new Config(); }\n  static Config get(){ return H.I; } }\n```\nIn Spring prefer a singleton-scoped bean injected where needed - testable, no static access."}, {"n": 5, "level": "intermediate", "q": "Builder vs telescoping constructors vs records?", "a": "Builder for objects with many optional fields (readable, validated in `build()`); records for simple immutable data with required fields; static factory methods for named constructors. Lombok's `@Builder` is common - but generate sparingly and keep invariants in the constructor."}, {"n": 6, "level": "intermediate", "q": "What is Dependency Inversion vs Dependency Injection vs IoC?", "a": "DIP: high-level policy shouldn't depend on low-level details - both depend on abstractions. DI: a technique to supply dependencies from outside. IoC: the container controls creation and lifecycle. DIP is the design principle; DI/IoC are the mechanisms."}, {"n": 7, "level": "intermediate", "q": "Composition vs inheritance?", "a": "Prefer composition: it avoids fragile base classes and allows runtime changes. Use inheritance for a true is-a relationship with a stable base. Interfaces + delegation give reuse without tight coupling."}, {"n": 8, "level": "intermediate", "q": "What is Domain-Driven Design - the key terms?", "a": "Ubiquitous language, **bounded context**, **entity** (identity), **value object** (immutable, compared by value), **aggregate** (consistency boundary with a root; one transaction per aggregate), **repository**, **domain service**, **domain event**. Helps find microservice boundaries and keep business logic out of controllers."}, {"n": 9, "level": "intermediate", "q": "Explain Hexagonal (Ports & Adapters) / Clean Architecture.", "a": "The domain core has no dependency on frameworks. **Ports** are interfaces the core defines (`OrderRepository`, `PaymentGateway`); **adapters** implement them (JPA, REST client, Kafka). Inbound adapters (controllers, consumers) call use cases. Benefits: testable core, swap infrastructure, clearer dependency rule (dependencies point inward). Enforce with ArchUnit tests."}, {"n": 10, "level": "intermediate", "q": "What is an anti-corruption layer?", "a": "A translation layer between your domain and an external/legacy model so their concepts don't leak into your code - e.g. an adapter mapping a vendor's court-record XML into your canonical record."}, {"n": 11, "level": "advanced", "q": "Anemic domain model vs rich domain model?", "a": "Anemic: entities are just data and all logic is in services - easy but spreads rules and allows invalid states. Rich: entities enforce invariants (`order.addItem()` checks status). Don't overdo it: pragmatic teams put invariants in aggregates and orchestration in application services."}, {"n": 12, "level": "advanced", "q": "How do you manage technical debt as a Lead?", "a": "Make it visible (a debt register with impact), allocate a fixed capacity (e.g. 15-20% per sprint), tie items to business risk (incidents, velocity), prioritise by cost-of-delay, use the boy-scout rule in feature work, automate guard rails (Sonar quality gate, ArchUnit, dependency updates), and avoid giant rewrites."}, {"n": 13, "level": "advanced", "q": "Code review: what do you look for and how do you give feedback?", "a": "Correctness and edge cases, tests, readability, naming, security (injection, authz, secrets), performance (N+1, blocking), error handling and logging, API compatibility, observability. Feedback: be specific, explain why, prefer questions to commands, separate must-fix from nits, automate style (formatter/linter) so reviews focus on design."}, {"n": 14, "level": "advanced", "q": "Event-driven architecture: events vs commands vs messages?", "a": "Event = fact that happened (`OrderPlaced`), many consumers, producer doesn't care. Command = request to do something (`ChargeCard`), one handler. Message = the transport envelope. Name events in the past tense, keep payloads stable and versioned, and don't create hidden coupling by making consumers depend on producer internals."}, {"n": 15, "level": "advanced", "q": "Feature flags - benefits and risks?", "a": "Decouple deploy from release, enable canary, kill switch, A/B tests. Risks: flag debt (remove after rollout), combinatorial testing, hidden coupling. Use a platform (LaunchDarkly, Unleash, Spring Cloud Config/AppConfig), give each flag an owner and an expiry date."}, {"n": 16, "level": "design", "q": "Design an extensible parser framework for 100+ file formats/sources.", "a": "Define `FileParser` (`supports(FileMeta)`, `parse(InputStream) -> Stream<Record>`) and a registry that discovers implementations (Spring beans / `ServiceLoader` / Quarkus CDI). Canonical record schema with versioning; per-source mapping config; streaming parsing (no whole-file in memory); validation + quarantine for bad rows; contract tests with sample files per source; metrics per parser; CLI wrapper (Picocli) for local runs."}, {"n": 17, "level": "design", "q": "Design an audit-trail capability for an ERP.", "a": "Capture who/what/when/before/after for sensitive entities via JPA entity listeners/Hibernate Envers or CDC; write to an append-only store; include correlation id and tenant; ensure audit write is in the same transaction (or via outbox for async); protect from tampering (restricted writes, hashes), retention policy and search UI."}, {"n": 18, "level": "design", "q": "Design a multi-step approval workflow engine.", "a": "Model workflow definitions (steps, conditions, approvers) as data; a state machine per instance (Spring Statemachine or a simple enum + transitions table); persisted history; timers for escalation (scheduler/Quartz); idempotent actions; notifications via events; consider Camunda/Temporal for complex cases rather than building from scratch."}, {"n": 19, "level": "intermediate", "q": "How do you decide build vs buy vs open source?", "a": "Compare total cost (build + run + maintain), time to market, fit with requirements, vendor lock-in, security/licensing, community health, and team skills. Build only what differentiates the business; document the decision (ADR)."}, {"n": 20, "level": "intermediate", "q": "What is an Architecture Decision Record (ADR)?", "a": "A short document: context, options considered, decision, consequences. Stored in the repo, immutable (superseded by a new ADR). Gives new team members the \"why\", prevents repeated debates and shows leadership maturity."}]}, {"id": "18-testing-cicd", "title": "Testing, CI/CD, Code Quality & Security Hygiene", "focus": "JUnit 5, Mockito, Testcontainers, pipelines, quality gates, supply-chain security", "intro": "", "questions": [{"n": 1, "level": "basic", "q": "What is the test pyramid?", "a": "Many fast unit tests, fewer integration tests (real DB/broker), very few end-to-end UI tests. Fast feedback and low flakiness at the bottom; confidence in real wiring in the middle; a thin top for critical user journeys."}, {"n": 2, "level": "basic", "q": "JUnit 5 essentials?", "a": "`@Test`, `@BeforeEach/@AfterEach`, `@ParameterizedTest` with `@CsvSource/@MethodSource`, `@Nested`, `assertThrows`, `assertAll`, extensions (`@ExtendWith`), `@Tag` for grouping, `@DisplayName`. Combine with AssertJ for readable assertions."}, {"n": 3, "level": "intermediate", "q": "Mock vs Stub vs Spy vs Fake?", "a": "Stub returns canned answers; mock verifies interactions; spy wraps a real object; fake is a working lightweight implementation (in-memory repo). Prefer fakes/state assertions; over-mocking couples tests to implementation."}, {"n": 4, "level": "intermediate", "q": "Mockito: common patterns and pitfalls?", "a": "`when(repo.find(1)).thenReturn(x)`, `verify(repo).save(captor.capture())`, `ArgumentCaptor`, `doThrow` for void methods, `@InjectMocks`. Pitfalls: mocking value objects, verifying too much, mocking static/final unless necessary, tests that pass with no assertion."}, {"n": 5, "level": "intermediate", "q": "Spring Boot test slices?", "a": "`@WebMvcTest` (controller + MVC only, mock services), `@DataJpaTest` (JPA + embedded/Testcontainers DB), `@JsonTest`, `@RestClientTest`, and `@SpringBootTest` (full context, use sparingly - slow). Boot 4 modularises test starters. `@MockBean` is replaced by `@MockitoBean` in Spring Framework 6.2+."}, {"n": 6, "level": "intermediate", "q": "What is Testcontainers and why use it over H2?", "a": "Runs real dependencies (PostgreSQL, Oracle XE, Kafka, Redis, Couchbase) in Docker for tests, so SQL dialect, constraints, and broker behaviour match production. H2 hides dialect differences and passes tests that fail in prod. Reuse containers (singleton) to keep the suite fast."}, {"n": 7, "level": "intermediate", "q": "How do you test asynchronous code?", "a": "Use Awaitility (`await().atMost(5, SECONDS).untilAsserted(...)`) instead of `Thread.sleep`; inject a controllable clock/executor; for Kafka, produce and await a result in the sink; for `CompletableFuture`, join with timeouts."}, {"n": 8, "level": "intermediate", "q": "What is TDD and when is it worth it?", "a": "Red-Green-Refactor: write a failing test, make it pass minimally, refactor. Best for business logic with clear rules and bug fixes (write a failing test that reproduces the bug first). Less value for exploratory spikes or thin glue code."}, {"n": 9, "level": "intermediate", "q": "Consumer-driven contract testing?", "a": "The consumer defines expectations (Pact / Spring Cloud Contract); the provider verifies them in CI. Prevents breaking changes between services without a full environment. Publish contracts to a broker, gate provider builds."}, {"n": 10, "level": "intermediate", "q": "What code coverage target do you set?", "a": "Coverage is a signal, not a goal: ~70-80% on new code with meaningful assertions, 100% on critical business rules, and **mutation testing** (PIT) to check that tests really fail when code changes. Use SonarQube quality gates on new code, not only the total."}, {"n": 11, "level": "intermediate", "q": "Describe a good CI/CD pipeline for a Java service.", "a": "Commit -> build & unit tests -> static analysis (Sonar, SpotBugs) + dependency/license scan (OWASP Dependency-Check/Snyk) -> integration tests (Testcontainers) -> build image + SBOM + image scan -> push to registry -> deploy to dev automatically -> contract/smoke tests -> staging -> approval -> production canary with automated rollback. Pipeline-as-code (Jenkinsfile/GitHub Actions)."}, {"n": 12, "level": "intermediate", "q": "Branching strategy: GitFlow vs trunk-based?", "a": "GitFlow: long-lived develop/release branches, heavier merging, suits scheduled releases. Trunk-based: short-lived branches, small PRs, feature flags, continuous integration - best for fast delivery with strong tests. Choose per release cadence; avoid long-running branches."}, {"n": 13, "level": "intermediate", "q": "How do you handle dependency and vulnerability management?", "a": "Automated updates (Renovate/Dependabot), BOMs to align versions, scanning in CI with a policy (fail on critical CVEs), SBOM generation (CycloneDX), removing unused dependencies, tracking end-of-life versions (Spring Boot 3.x, Java 8), and a patch SLA by severity."}, {"n": 14, "level": "advanced", "q": "Zero-downtime release with database migration - how does the pipeline support it?", "a": "Migration step runs before the app rollout (Flyway/Liquibase) and must be backward compatible; app rollout is rolling/canary with readiness; smoke tests gate promotion; the cleanup migration (drop column) ships in a later release."}, {"n": 15, "level": "advanced", "q": "What is a flaky test and how do you fix them?", "a": "Passes/fails non-deterministically: time, concurrency, shared state, ordering, external services. Quarantine quickly, fix the root cause (fake clock, isolated data, proper waits), track flake rate; never let a flaky suite train people to ignore red builds."}, {"n": 16, "level": "advanced", "q": "Performance and load testing tools and approach?", "a": "Gatling/k6/JMeter, realistic data and think-time, ramp-up, steady state, spike and soak tests, measure p95/p99 and errors, watch saturation metrics, run in a production-like environment, automate a smoke load test in the pipeline with thresholds."}, {"n": 17, "level": "design", "q": "Design the quality strategy for a team of 8 working on 5 microservices.", "a": "Definition of Done (tests, review, docs, observability), unit + Testcontainers integration per service, contract tests across services, a few E2E smoke tests, Sonar gates on new code, ArchUnit rules, PR template and checklist, trunk-based dev with feature flags, shared pipeline templates, a weekly flaky-test and vulnerability review."}, {"n": 18, "level": "intermediate", "q": "Static analysis and code style tooling?", "a": "Checkstyle/Spotless (format), SpotBugs/Error Prone/PMD (bugs), So

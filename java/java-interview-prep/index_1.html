<script>
const DATA=[{"id": "01-java-core", "title": "Java Core, Collections, Streams (Java 8+)", "focus": "Fundamentals every Lead is expected to explain crisply and with trade-offs", "intro": "Lead interviews start here to check depth, not definitions. Always add \"when it breaks in production\".", "questions": [{"n": 1, "level": "basic", "q": "What is the difference between JDK, JRE and JVM?", "a": "JVM runs bytecode. JRE = JVM + core libraries. JDK = JRE + compiler (`javac`) and tools (`jar`, `jcmd`, `jshell`). Since Java 11 there is no separate JRE download; you ship the JDK or a trimmed runtime made with `jlink`."}, {"n": 2, "level": "basic", "q": "What is the equals/hashCode contract and what breaks if you violate it?", "a": "If `a.equals(b)` then `a.hashCode() == b.hashCode()`. Equal objects must land in the same hash bucket.\n- Override `equals` only -> `HashMap.get()` returns null for an equal key because it looks in the wrong bucket.\n- Mutable fields inside `hashCode` -> the object \"disappears\" from a `HashSet` after you change it.\n- Use `Objects.equals` / `Objects.hash`, or a `record`, which generates both."}, {"n": 3, "level": "basic", "q": "Why is String immutable and what is the String pool?", "a": "Immutability makes strings thread-safe, cacheable (hash is computed once) and safe as map keys and security parameters. Literals are stored in the pool, so `\"a\" == \"a\"` is true but `new String(\"a\") == \"a\"` is false. Use `StringBuilder` in loops (`StringBuffer` is the old synchronized version)."}, {"n": 4, "level": "basic", "q": "Abstract class vs interface - which one when?", "a": "Interface = contract (can have `default`, `static`, `private` methods since Java 8/9; no instance state). Abstract class = shared state and partial implementation. A class can implement many interfaces but extend one class. Prefer interfaces for APIs; use an abstract class when subclasses share fields or a template-method skeleton."}, {"n": 5, "level": "basic", "q": "Checked vs unchecked exceptions? What is try-with-resources?", "a": "Checked exceptions (`IOException`) must be declared or caught; unchecked (`RuntimeException`) need not. Modern Spring code uses unchecked domain exceptions and handles them in one place. `try (var in = ...)` closes any `AutoCloseable` automatically, even on exception, and keeps the original exception with the close failures attached as *suppressed*."}, {"n": 6, "level": "basic", "q": "`final` vs `finally` vs `finalize`?", "a": "`final`: constant / not overridable / not subclassable. `finally`: block that runs after try/catch (except JVM exit). `finalize()`: deprecated for removal - unreliable; use `try-with-resources` or `Cleaner`."}, {"n": 7, "level": "intermediate", "q": "How does HashMap work internally (Java 8+)?", "a": "Array of buckets; index = `(n-1) & hash(key)`. Collisions form a linked list; when a bucket reaches 8 entries and the table is at least 64 long, it becomes a red-black tree (O(log n) worst case). Default capacity 16, load factor 0.75, resize doubles the table and redistributes. Not thread-safe: concurrent resize can lose data.\n> Follow-up they may ask: why capacity is a power of two (fast bit-mask index)."}, {"n": 8, "level": "intermediate", "q": "HashMap vs Hashtable vs ConcurrentHashMap vs Collections.synchronizedMap?", "a": "`Hashtable` and `synchronizedMap` lock the whole map. `ConcurrentHashMap` (Java 8+) uses CAS plus per-bucket `synchronized`, so reads are lock-free and writes lock only one bucket. It forbids null keys/values and gives atomic `computeIfAbsent`, `merge`. Prefer it for shared caches/counters."}, {"n": 9, "level": "intermediate", "q": "ArrayList vs LinkedList? Fail-fast vs fail-safe iterators?", "a": "ArrayList: array, O(1) index, O(n) insert in the middle, cache friendly - the default choice. LinkedList: O(1) add/remove at the ends, but O(n) access and more memory; rarely wins in practice. Fail-fast iterators (`ArrayList`, `HashMap`) throw `ConcurrentModificationException` if the structure changes during iteration; fail-safe ones (`CopyOnWriteArrayList`, `ConcurrentHashMap`) iterate on a snapshot / weakly consistent view."}, {"n": 10, "level": "intermediate", "q": "Comparable vs Comparator? HashSet vs LinkedHashSet vs TreeSet?", "a": "`Comparable` = natural order inside the class (`compareTo`); `Comparator` = external, composable order (`Comparator.comparing(Emp::dept).thenComparing(Emp::salary).reversed()`). HashSet: O(1), no order. LinkedHashSet: insertion order. TreeSet: sorted, O(log n), needs ordering consistent with `equals`."}, {"n": 11, "level": "intermediate", "q": "What is a functional interface? Name the common ones.", "a": "An interface with one abstract method; a lambda or method reference implements it. `Function<T,R>`, `Predicate<T>`, `Consumer<T>`, `Supplier<T>`, `BiFunction`, `UnaryOperator`, `Runnable`, `Callable`. Lambdas capture only effectively-final variables, and `this` inside a lambda is the enclosing class (unlike an anonymous class)."}, {"n": 12, "level": "intermediate", "q": "Intermediate vs terminal stream operations? map vs flatMap?", "a": "Intermediate ops (`filter`, `map`, `sorted`, `distinct`) are lazy and return a stream; nothing runs until a terminal op (`collect`, `forEach`, `reduce`, `findFirst`). A stream can be consumed once. `map` is 1->1; `flatMap` is 1->many and flattens: `orders.stream().flatMap(o -> o.items().stream())`."}, {"n": 13, "level": "intermediate", "q": "Write a stream that groups employees by department and gets the average salary.", "a": "```java\nMap<String, Double> avg = emps.stream()\n    .collect(Collectors.groupingBy(Employee::dept,\n             Collectors.averagingDouble(Employee::salary)));\n```\nAlso know `partitioningBy`, `toMap` (needs a merge function for duplicate keys or it throws), `counting`, `joining`, `teeing` (Java 12)."}, {"n": 14, "level": "intermediate", "q": "How should Optional be used - and abused?", "a": "Use it as a **return type** to say \"may be empty\": `findById(id).map(...).orElseThrow(NotFound::new)`. Don't use it for fields, method parameters or collections (return an empty list). Avoid `get()` without `isPresent()`; prefer `orElseGet` (lazy) over `orElse` (always evaluated) for expensive defaults."}, {"n": 15, "level": "intermediate", "q": "How do you make a class truly immutable?", "a": "`final` class, `private final` fields, no setters, defensive copies of mutable inputs/outputs (dates, lists - or `List.copyOf`), no `this` escape in the constructor. Today: use a `record` (shallow immutable - still copy collections inside the compact constructor). Immutable objects are thread-safe by design."}, {"n": 16, "level": "advanced", "q": "When does `parallelStream()` hurt?", "a": "It uses the shared common ForkJoinPool, so a blocking call (DB/HTTP) inside starves every other parallel stream in the JVM. It helps only for CPU-bound work on large, cheap-to-split data (arrays, `ArrayList`) with stateless, non-blocking lambdas. For I/O, use an explicit executor or virtual threads. Always measure."}, {"n": 17, "level": "advanced", "q": "Explain generics, type erasure and PECS.", "a": "Generics are checked at compile time and erased at runtime (`List<String>` and `List<Integer>` are both `List`), so you cannot do `new T()` or `instanceof List<String>`. PECS: **P**roducer **E**xtends, **C**onsumer **S**uper - read from `List<? extends Number>`, write into `List<? super Integer>`. `Collections.copy(dest, src)` is the classic example."}, {"n": 18, "level": "advanced", "q": "How can a Java application leak memory despite the GC?", "a": "GC frees only unreachable objects, so leaks are *reachable-but-unused* objects: static maps/caches without eviction, listeners never removed, `ThreadLocal` not cleared on pooled threads, unclosed resources, classloader leaks on redeploy, and a mutable key in a `HashMap`. Diagnose with a heap dump (`jcmd <pid> GC.heap_dump`) in Eclipse MAT: find the dominator tree and \"path to GC roots\"."}, {"n": 19, "level": "advanced", "q": "Why is Java serialization discouraged and what is serialVersionUID for?", "a": "Default deserialization can instantiate arbitrary classes - a well-known security hole (gadget chains); it also freezes your class layout. `serialVersionUID` is the version stamp; a mismatch throws `InvalidClassException`. Prefer JSON/Avro/Protobuf with an explicit schema. If you must, use serialization filters (`ObjectInputFilter`)."}, {"n": 20, "level": "advanced", "q": "What is the difference between `Comparable` consistency with equals, and why does `BigDecimal` surprise people?", "a": "`new BigDecimal(\"2.0\").equals(new BigDecimal(\"2.00\"))` is **false** (scale differs) but `compareTo` returns 0. So a `HashSet` keeps both, while a `TreeSet` keeps one. For money use `BigDecimal` with explicit scale and `RoundingMode`, never `double`; construct from `String`, not `double`."}, {"n": 21, "level": "design", "q": "Design a thread-safe LRU cache. What would you use in production?", "a": "Interview version: `LinkedHashMap` with `accessOrder=true` and `removeEldestEntry`, wrapped in `Collections.synchronizedMap` (or a `ReentrantLock`).\n```java\nclass Lru<K,V> extends LinkedHashMap<K,V> {\n  private final int max;\n  Lru(int max){ super(16,0.75f,true); this.max=max; }\n  protected boolean removeEldestEntry(Map.Entry<K,V> e){ return size()>max; }\n}\n```\nProduction: use **Caffeine** (window-TinyLFU, async loading, TTL, stats) or Redis for a shared cache. Discuss invalidation, stampede protection (`LoadingCache` loads once per key) and cache metrics."}, {"n": 22, "level": "design", "q": "Design an exception strategy for a layered service (controller -> service -> repository).", "a": "- One `AppException` base (unchecked) with an error code; subclasses by *decision*: `NotFoundException`, `ValidationException`, `ConflictException`, `DependencyUnavailableException` (retryable).\n- Lower layers wrap with a cause (`throw new X(\"...\", e)`) and never leak persistence types upward.\n- One `@RestControllerAdvice` maps exceptions to HTTP status + a stable error body (RFC 7807 `ProblemDetail`).\n- Log once, at the boundary, with a correlation id; never log and rethrow at every layer."}]}, {"id": "02-modern-java", "title": "Modern Java (11 -> 25 LTS)", "focus": "What changed since Java 8 and which LTS to target - a favourite opener for Lead profiles", "intro": "LTS releases: 8, 11, 17, 21, **25 (Sept 2025)**. Spring Boot 4 requires Java 17 as a minimum and supports Java 25 first-class. Be ready to say \"I moved/would move from 8 to 17 to 21/25 in these steps\".", "questions": [{"n": 1, "level": "basic", "q": "Which Java versions are LTS and which one should a new project use in 2026?", "a": "LTS: 8, 11, 17, 21, 25. A new project should start on **Java 21 or 25**; Java 25 is the newest LTS (released Sept 2025) and the natural upgrade for teams on 21. Non-LTS releases get only six months of support, so enterprises skip them."}, {"n": 2, "level": "basic", "q": "What are `var`, text blocks and `String` helper methods?", "a": "`var` (Java 10) = local type inference (the type is still static): `var list = new ArrayList<String>();`. Text blocks (Java 15) are multi-line strings with `\"\"\"` - great for SQL/JSON. Helpers: `isBlank`, `strip`, `lines`, `repeat`, `formatted`."}, {"n": 3, "level": "basic", "q": "What are List.of, Set.of, Map.of?", "a": "Java 9 factory methods that return **immutable** collections (no nulls, `Map.of` rejects duplicate keys). `List.copyOf` makes an immutable copy. Modifying them throws `UnsupportedOperationException`."}, {"n": 4, "level": "intermediate", "q": "What is a record? What can't it do?", "a": "A compact immutable data carrier: `record Money(BigDecimal amount, String ccy) {}` generates the constructor, accessors, `equals`, `hashCode`, `toString`. It is implicitly final, cannot extend a class, and fields are shallow-immutable. Add validation in a compact constructor. Great for DTOs, events and map keys; not for JPA entities (needs a no-arg constructor and mutability)."}, {"n": 5, "level": "intermediate", "q": "What are sealed classes and pattern matching for switch?", "a": "`sealed interface Payment permits Card, Upi, Wallet {}` limits who can implement it, so the compiler knows all cases. With pattern matching (final in Java 21):\n```java\nString label = switch (payment) {\n  case Card c   -> \"card \" + c.last4();\n  case Upi u    -> \"upi \" + u.vpa();\n  case Wallet w -> \"wallet\";\n};  // no default needed: compiler checks exhaustiveness\n```\nAlso `instanceof` patterns (`if (o instanceof String s)`) and record patterns for destructuring."}, {"n": 6, "level": "intermediate", "q": "What are virtual threads (Java 21) and when do they help?", "a": "Lightweight threads scheduled by the JVM onto a small pool of carrier (OS) threads. A blocking call parks the virtual thread and frees the carrier, so you can run hundreds of thousands of blocking tasks with the simple thread-per-request style. They help **I/O-bound** workloads (HTTP, JDBC); they do nothing for CPU-bound work.\n```java\ntry (var ex = Executors.newVirtualThreadPerTaskExecutor()) {\n  ex.submit(() -> callSlowService());\n}\n```\nSpring Boot 3.2+: `spring.threads.virtual.enabled=true`."}, {"n": 7, "level": "intermediate", "q": "Virtual threads vs reactive (WebFlux) - how do you choose?", "a": "Virtual threads keep imperative code, normal stack traces and debuggability, with most of the scalability. Reactive gives backpressure and streaming operators but costs a steep learning curve and hard debugging. Default to virtual threads for typical request/response services; keep WebFlux for streaming, backpressure-heavy pipelines or an existing reactive codebase."}, {"n": 8, "level": "advanced", "q": "What are the virtual thread pitfalls (pinning, pools, ThreadLocal)?", "a": "- **Pinning:** blocking inside `synchronized` (before Java 24) pinned the carrier thread; Java 24 (JEP 491) removed most of this. Native calls can still pin.\n- Don't pool virtual threads; create one per task and limit concurrency with a `Semaphore`.\n- Millions of `ThreadLocal` copies are costly -> use **ScopedValue** (final in Java 25).\n- The DB connection pool is now the real bottleneck; a pool of 20 still limits you to 20 concurrent queries."}, {"n": 9, "level": "advanced", "q": "What are Structured Concurrency and Scoped Values?", "a": "**Scoped Values** (final in Java 25): immutable, inheritable per-request context that replaces `ThreadLocal` for virtual threads. **Structured Concurrency** (still preview in Java 25): treat related subtasks as one unit - if one fails, siblings are cancelled and the parent sees the error, so no leaked threads. Say \"preview\" - don't claim it is production-final."}, {"n": 10, "level": "intermediate", "q": "What improved in the JVM/GC since 8?", "a": "G1 is the default since 9. ZGC and Shenandoah give pause times in the low milliseconds on big heaps; **generational ZGC** (Java 21) improved throughput. Containers: the JVM respects cgroup CPU/memory limits (use `-XX:MaxRAMPercentage`). Compact object headers and faster startup (AppCDS, Project Leyden) keep arriving."}, {"n": 11, "level": "intermediate", "q": "What is the HTTP Client and what replaced `HttpURLConnection`?", "a": "`java.net.http.HttpClient` (Java 11): HTTP/2, async `sendAsync` returning `CompletableFuture`, WebSocket. In Spring use `RestClient` (6.1+) or declarative HTTP interfaces; keep `HttpClient` for plain Java services."}, {"n": 12, "level": "intermediate", "q": "What does Stream API add after Java 8?", "a": "`takeWhile`/`dropWhile` (9), `toList()` (16, returns unmodifiable list), `mapMulti` (16), `Collectors.teeing` (12) and **Stream Gatherers** (Java 24 final) for custom intermediate operations such as windowing."}, {"n": 13, "level": "advanced", "q": "How would you migrate a large Java 8 app to Java 21/25?", "a": "1. Upgrade build tools (Maven/Gradle, plugins) and run on 11 first; fix `--add-opens`, removed `javax.xml.bind`, `sun.misc.Unsafe` usage.\n2. Move 11 -> 17: strong encapsulation of JDK internals; update Lombok, Mockito, ByteBuddy, Jackson.\n3. Move frameworks: Spring Boot 2 -> 3 means `javax.*` -> `jakarta.*` (use OpenRewrite recipes).\n4. Move to 21/25, run load tests, compare GC logs, then switch to virtual threads where the profile says so.\n5. Roll out with canary and the old JVM flags removed.\n> Follow-up: what blocks the jump? Old libraries and reflection-heavy code."}, {"n": 14, "level": "intermediate", "q": "What is the module system (JPMS) and do you use it?", "a": "Java 9 modules (`module-info.java`) give strong encapsulation and `jlink` small runtimes. Most Spring apps stay on the classpath; JPMS matters mostly for libraries and for understanding errors like `InaccessibleObjectException` (\"module java.base does not open ...\")."}, {"n": 15, "level": "intermediate", "q": "What is GraalVM Native Image and its trade-offs?", "a": "Ahead-of-time compiles the app into a native executable: startup in tens of milliseconds and low memory (great for serverless/scale-to-zero). Costs: long build, no runtime class generation, reflection/proxies need hints (Spring AOT generates them), peak throughput is usually lower than a warmed-up JIT. Use it for Lambda/CLI/short-lived services, not by default."}, {"n": 16, "level": "intermediate", "q": "What are `Stream.toList()`, `Optional.orElseThrow()` and `switch` expressions worth in code reviews?", "a": "Small readability wins: `toList()` replaces `collect(Collectors.toList())`; no-arg `orElseThrow()` replaces `get()`; switch expressions return values and avoid fall-through bugs. Lead point: set these in your team's style guide, enforce with Checkstyle/Sonar and OpenRewrite."}, {"n": 17, "level": "advanced", "q": "What is Project Valhalla / Leyden / Panama in one line each?", "a": "Valhalla: value types to remove object-header overhead. Leyden: faster startup/warmup via AOT cache. Panama: safe, fast native-memory and foreign function API (replacing JNI). None needs to be used today; knowing the direction signals that you track the platform."}, {"n": 18, "level": "design", "q": "Your team is on Java 8 with Spring Boot 2.x. Make the case and plan for upgrading.", "a": "- **Why:** Spring Boot 2 and Java 8 are out of free support (security fixes, CVE exposure), better GC/containers, virtual threads, records/sealed types reduce code.\n- **Plan:** inventory dependencies -> automated recipes (OpenRewrite) -> upgrade in small steps with green CI at each step -> performance baseline before/after -> feature-flag/canary rollout -> remove old runtime.\n- **Risks:** `javax` -> `jakarta`, old libraries, reflection, Hibernate 6 query changes.\n- **Measure:** startup time, p95 latency, memory, GC pause, build time."}]}, {"id": "03-concurrency", "title": "Concurrency & Multithreading", "focus": "Thread safety, executors, CompletableFuture, locks, Java Memory Model", "intro": "Interviewers look for: \"can you find the race condition\", \"can you size a pool\", \"do you know the JMM\".", "questions": [{"n": 1, "level": "basic", "q": "Process vs thread? How do you create a thread?", "a": "A process has its own memory; threads inside a process share heap and have their own stack. Prefer submitting a `Runnable`/`Callable` to an `ExecutorService` over `new Thread()`; extend `Thread` only for special cases."}, {"n": 2, "level": "basic", "q": "What is the difference between `synchronized` and `volatile`?", "a": "`synchronized` gives **mutual exclusion + visibility** (one thread in the block; changes visible after release). `volatile` gives **visibility and ordering only** for one variable - no atomicity, so `count++` on a volatile is still a race. Use `AtomicInteger`/`LongAdder` for counters."}, {"n": 3, "level": "basic", "q": "What are the thread states and what does `wait/notify` do?", "a": "NEW, RUNNABLE, BLOCKED (waiting for a monitor), WAITING, TIMED_WAITING, TERMINATED. `wait()` releases the monitor and sleeps until `notify()`; always call it in a `while(!condition)` loop (spurious wakeups). In modern code use `BlockingQueue`, `CountDownLatch` or `Condition` instead."}, {"n": 4, "level": "intermediate", "q": "What is a race condition vs a deadlock vs a livelock vs starvation?", "a": "Race: result depends on timing (check-then-act, `i++`). Deadlock: two threads each hold a lock the other needs. Livelock: threads keep reacting to each other and make no progress. Starvation: a thread never gets the CPU/lock (unfair locks, priority). Fix deadlock by **global lock ordering**, `tryLock(timeout)`, or fewer locks."}, {"n": 5, "level": "intermediate", "q": "How do you detect a deadlock in production?", "a": "`jcmd <pid> Thread.print` or `jstack` - the dump prints \"Found one Java-level deadlock\" with the cycle. Take 3 dumps 10 seconds apart to see which threads never move. Also `ThreadMXBean.findDeadlockedThreads()` can be exposed as a health metric."}, {"n": 6, "level": "intermediate", "q": "ExecutorService - how do you size a thread pool?", "a": "CPU-bound: ~ number of cores (+1). I/O-bound: `cores * (1 + wait/compute)` - e.g. 8 cores, 90% waiting -> ~80. Always use a **bounded queue** and a rejection policy (`CallerRunsPolicy` gives back-pressure); `Executors.newFixedThreadPool` uses an unbounded queue and can cause OOM. Name your threads and export pool metrics (active, queue size, rejected)."}, {"n": 7, "level": "intermediate", "q": "Runnable vs Callable vs Future vs CompletableFuture?", "a": "`Callable` returns a value and can throw. `Future.get()` blocks. `CompletableFuture` chains non-blocking steps:\n```java\nCompletableFuture.supplyAsync(() -> userSvc.get(id), pool)\n  .thenCombine(CompletableFuture.supplyAsync(() -> orderSvc.get(id), pool),\n               Profile::new)\n  .orTimeout(2, TimeUnit.SECONDS)\n  .exceptionally(ex -> Profile.fallback());\n```\nPass your own executor - the default is the common pool. Know `allOf`, `anyOf`, `thenCompose` (flatMap) vs `thenApply` (map)."}, {"n": 8, "level": "intermediate", "q": "ReentrantLock vs synchronized? ReadWriteLock vs StampedLock?", "a": "`ReentrantLock` adds `tryLock`, timeouts, interruptibility, fairness and multiple `Condition`s - and must be released in `finally`. `ReadWriteLock` allows many readers or one writer (good for read-heavy). `StampedLock` adds optimistic reads (fastest, not reentrant, easy to misuse)."}, {"n": 9, "level": "intermediate", "q": "What are CountDownLatch, CyclicBarrier, Semaphore, Phaser?", "a": "Latch: wait until N events happen (one-shot). Barrier: N threads wait for each other, reusable. Semaphore: limit concurrent access (e.g. 10 calls to a partner API). Phaser: flexible multi-phase barrier. Example: a `Semaphore(20)` around a rate-limited downstream call."}, {"n": 10, "level": "intermediate", "q": "What is the Java Memory Model \"happens-before\"?", "a": "A set of rules that guarantee one thread's write is visible to another: unlock -> later lock of the same monitor, volatile write -> later read, `Thread.start()` -> actions in the thread, thread end -> `join()` return, final fields after safe construction. Without a happens-before edge the compiler/CPU may reorder or cache values."}, {"n": 11, "level": "advanced", "q": "Why is double-checked locking broken without `volatile`?", "a": "`instance = new Singleton()` is three steps (allocate, construct, publish the reference) and may be reordered, so another thread can see a non-null but half-built object. Declare the field `volatile`, or better use the holder idiom or an `enum` singleton."}, {"n": 12, "level": "advanced", "q": "ConcurrentHashMap: what is atomic and what is not?", "a": "Single operations (`put`, `putIfAbsent`, `computeIfAbsent`, `merge`) are atomic. A sequence like `if(!map.containsKey(k)) map.put(k,v)` is a race - use `putIfAbsent`. Don't do slow work or modify the map inside `computeIfAbsent` (it holds the bucket lock). `size()` is an estimate under concurrent updates."}, {"n": 13, "level": "advanced", "q": "What is ForkJoinPool and work stealing?", "a": "A pool where each worker has its own deque; idle workers *steal* tasks from others, which keeps all cores busy for divide-and-conquer jobs (parallel streams, `RecursiveTask`). Don't block inside it."}, {"n": 14, "level": "advanced", "q": "ThreadLocal: use, danger and the alternative?", "a": "Per-thread storage (user context, MDC). In pooled threads values leak to the next request unless you `remove()` in `finally`. With virtual threads, copies multiply. Use `ScopedValue` (Java 25) or pass context explicitly."}, {"n": 15, "level": "advanced", "q": "Explain `@Async` and `@Scheduled` pitfalls in Spring.", "a": "`@Async` works only through the proxy (calling it from the same class does nothing); the default executor in older setups is a `SimpleAsyncTaskExecutor` (new thread each time) - define a bounded `ThreadPoolTaskExecutor`. `@Scheduled` runs on a single thread by default and every pod runs it -> use **ShedLock/Quartz cluster** or a leader election so the job runs once."}, {"n": 16, "level": "advanced", "q": "How do you make a check-then-act operation safe across multiple pods?", "a": "JVM locks don't cross processes. Use a DB constraint/optimistic lock (`@Version`), `SELECT ... FOR UPDATE`, an atomic Redis `SET NX PX` lease, or serialize by partition key in Kafka. Always combine with **idempotency keys** so a retry is harmless."}, {"n": 17, "level": "design", "q": "Design a rate limiter for an API (single node, then distributed).", "a": "- Single node: token bucket (`tokens`, `refillRate`, `lastRefill`) guarded by a lock or `AtomicLong`; per-key map with eviction (Caffeine).\n- Distributed: Redis Lua script doing the token-bucket math atomically, or a gateway (Kong / Spring Cloud Gateway `RequestRateLimiter` / Resilience4j `RateLimiter`).\n- Decide: fail-open or fail-closed if Redis is down; return `429` + `Retry-After`; limit by API key, not IP only; export \"rejected\" metrics."}, {"n": 18, "level": "design", "q": "Design a bulk-processing job that calls a slow partner API 1 million times with a limit of 50 calls/second.", "a": "Producer reads work in pages -> bounded queue -> N workers (virtual threads or a pool of 50) guarded by a rate limiter (token bucket) -> results written in batches -> failures to a retry/DLQ table with attempt count. Make each call idempotent, store a checkpoint so a restart resumes, add a circuit breaker, and track progress (processed / failed / ETA) as metrics."}, {"n": 19, "level": "intermediate", "q": "A service's CPU is at 100%. How do you find the busy thread?", "a": "`top -H -p <pid>` shows the hot native thread id -> convert to hex -> find `nid=0x..` in `jstack`/`jcmd Thread.print`. Or use async-profiler / JFR for a flame graph. Typical causes: infinite loop, regex backtracking, GC thrash (check GC logs), lock spinning."}, {"n": 20, "level": "advanced", "q": "Explain false sharing and `LongAdder`.", "a": "Two threads update different variables that sit on the same CPU cache line, so the cores keep invalidating each other. `LongAdder` spreads increments over several cells and sums them on read - far faster than `AtomicLong` under heavy contention, but `sum()` is not an atomic snapshot."}]}, {"id": "04-jvm-performance", "title": "JVM Internals, GC & Performance Tuning", "focus": "Memory model, garbage collectors, profiling, containers - what Leads use in RCA", "intro": "", "questions": [{"n": 1, "level": "basic", "q": "Describe JVM memory areas.", "a": "Heap (young: eden + survivor; old), Metaspace (class metadata, native memory), thread stacks, code cache (JIT output), direct buffers. `OutOfMemoryError: Java heap space` vs `Metaspace` vs `unable to create native thread` point to different areas."}, {"n": 2, "level": "basic", "q": "What is garbage collection and what are GC roots?", "a": "GC reclaims objects that cannot be reached from **roots**: thread stacks/locals, static fields, JNI references, active threads. Reachable objects live even if the code never uses them again (that is how leaks happen)."}, {"n": 3, "level": "basic", "q": "Stack vs heap?", "a": "Stack: per-thread, holds frames, locals and references; fast; `StackOverflowError` on deep recursion. Heap: shared objects, managed by GC."}, {"n": 4, "level": "intermediate", "q": "How does generational GC work?", "a": "Most objects die young. New objects go to eden; a minor GC copies survivors to a survivor space and ages them; after a threshold they are promoted to old gen. Old gen is collected less often (mixed/major GC). Premature promotion (survivors too small) fills old gen and causes long pauses."}, {"n": 5, "level": "intermediate", "q": "G1 vs ZGC vs Parallel vs Shenandoah - which when?", "a": "| GC | Strength | Use when |\n|---|---|---|\n| Parallel | max throughput, longer pauses | batch jobs |\n| G1 (default) | balanced, tunable pause goal | most services, heaps up to ~tens of GB |\n| ZGC | pauses ~ms, large heaps, generational since 21 | low-latency, big heaps |\n| Shenandoah | low pause, concurrent compaction | similar to ZGC (OpenJDK builds) |"}, {"n": 6, "level": "intermediate", "q": "Which JVM flags do you set for a containerised service?", "a": "`-XX:MaxRAMPercentage=70` (not a fixed `-Xmx` that ignores pod limits), `-XX:+ExitOnOutOfMemoryError` (let Kubernetes restart), `-XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/dumps`, GC logging `-Xlog:gc*:file=gc.log`, and size the pod request/limit to heap + metaspace + threads + direct memory (heap is only ~60-70% of RSS)."}, {"n": 7, "level": "intermediate", "q": "A pod gets OOMKilled but heap looks fine. Why?", "a": "OOMKilled = the **container** exceeded its memory limit, not a Java `OutOfMemoryError`. Non-heap memory counts: metaspace, thread stacks (1MB each x thousands of threads), direct buffers (Netty), JIT, native libraries. Check with Native Memory Tracking (`-XX:NativeMemoryTracking=summary`, `jcmd VM.native_memory`) and lower `MaxRAMPercentage`."}, {"n": 8, "level": "intermediate", "q": "How do you read a GC log to see if GC is the problem?", "a": "Look at pause time and frequency, \"Pause Young/Full\", heap after GC, and the % of time in GC. Red flags: repeated Full GCs, heap-after-GC trending up (leak), pauses above your SLO, \"to-space exhausted\", humongous allocations in G1. Tools: GCeasy, JDK Mission Control."}, {"n": 9, "level": "advanced", "q": "How do you do a heap dump analysis step by step?", "a": "1. Capture: `jcmd <pid> GC.heap_dump /tmp/h.hprof` (or auto on OOM).\n2. Open in Eclipse MAT -> Leak Suspects report.\n3. Check Dominator Tree for the biggest retained sizes; use \"Path to GC Roots (exclude weak refs)\".\n4. Typical findings: huge `HashMap` cache, session objects, a list in a singleton, `ThreadLocal` values.\n5. Fix + add a bound/eviction + a metric/alert on old-gen usage after GC."}, {"n": 10, "level": "advanced", "q": "What is JIT compilation and warm-up?", "a": "HotSpot interprets first, then compiles hot methods with C1 (quick) and C2 (optimizing, with inlining and escape analysis). Cold JVMs are slow for the first seconds -> use readiness probes, warm-up requests, CDS/AppCDS, or native image for serverless. Benchmark with JMH, never with `System.currentTimeMillis()` loops."}, {"n": 11, "level": "advanced", "q": "What is escape analysis?", "a": "If the JIT proves an object never escapes a method, it may allocate it on the stack or remove it (scalar replacement) - which is why tiny temporary objects are cheap and why micro-optimising allocation by hand is usually pointless."}, {"n": 12, "level": "intermediate", "q": "How do you profile a slow endpoint?", "a": "Start with the trace (which span is slow: DB, remote call, or CPU?). Then JFR / async-profiler for CPU and allocation flame graphs, `jcmd Thread.print` for blocked threads, DB slow-query log/`EXPLAIN`. Fix the biggest bar in the flame graph first, then re-measure."}, {"n": 13, "level": "intermediate", "q": "What are common performance anti-patterns in Spring apps?", "a": "N+1 queries, `findAll()` without paging, fetching entities when a projection is enough, synchronous calls in a chain, huge JSON payloads, logging at DEBUG in hot paths, unbounded caches, creating `ObjectMapper`/`SimpleDateFormat` per request, connection pool too small/large, missing indexes."}, {"n": 14, "level": "advanced", "q": "How do you size the DB connection pool (HikariCP)?", "a": "A small pool is usually faster. A good start: `pool = (cores * 2) + effective_spindles`, then tune with load tests; **total across all pods must stay below DB max connections**. Set `connectionTimeout`, `maxLifetime` below the DB/firewall idle timeout, and watch `hikaricp.connections.pending`. With virtual threads, cap concurrency with a semaphore."}, {"n": 15, "level": "advanced", "q": "What is the difference between latency, throughput and why p99 matters?", "a": "Latency = time per request; throughput = requests per second. Averages hide slow tails; one user request often fans out into many calls, so the p99 of each call dominates the user-visible time. Track p50/p95/p99, not the mean. Use Little's Law: `concurrency = throughput x latency`."}, {"n": 16, "level": "design", "q": "Design a performance test and capacity plan for a service that must handle 5x traffic next quarter.", "a": "Define SLOs (p95 < 300 ms, error < 0.1%) -> build a realistic workload from production traces -> test with Gatling/k6 in a prod-like environment, ramp until SLO breaks -> find the bottleneck (CPU, DB, pool, downstream) -> fix and repeat -> compute pods needed with 30-40% headroom -> verify autoscaling (HPA on CPU/RPS) and run a soak test for memory leaks -> document limits and alerts."}, {"n": 17, "level": "intermediate", "q": "What are JFR and JMC?", "a": "Java Flight Recorder is a low-overhead (~1-2%) built-in recorder of GC, allocations, locks, I/O and method samples; start with `jcmd <pid> JFR.start duration=60s filename=rec.jfr` and analyse in JDK Mission Control. Safe to run in production, which is why it is the first tool before external profilers."}, {"n": 18, "level": "advanced", "q": "Explain class loading and a ClassLoader leak.", "a": "Bootstrap -> Platform -> Application loaders (parent-first delegation). On hot redeploy in an app server, if any static reference/thread/`ThreadLocal` holds a class from the old loader, the whole old loader and its classes stay in Metaspace -> `OutOfMemoryError: Metaspace` after N redeploys. Fix by cleaning threads/drivers on shutdown or restart the process instead of redeploying."}]}, {"id": "05-spring-boot", "title": "Spring Framework & Spring Boot (3.x / 4.x)", "focus": "IoC, auto-configuration, proxies, configuration, Boot 4 changes", "intro": "Boot 4.0 (Nov 2025) is built on Spring Framework 7; Boot 3.5 open-source support ended June 2026. Mention both versions if asked \"what are you on\".", "questions": [{"n": 1, "level": "basic", "q": "What are IoC and Dependency Injection?", "a": "IoC: the container creates and wires objects instead of your code calling `new`. DI is how: constructor, setter or field injection. **Prefer constructor injection** - dependencies are final, required and testable without Spring."}, {"n": 2, "level": "basic", "q": "What are bean scopes?", "a": "`singleton` (default, one per container - must be stateless/thread-safe), `prototype` (new each request), `request`, `session`, `application`. Injecting a prototype into a singleton gives you one instance only - use `ObjectProvider<T>` or a scoped proxy."}, {"n": 3, "level": "basic", "q": "What does `@SpringBootApplication` do?", "a": "Combines `@Configuration`, `@EnableAutoConfiguration` and `@ComponentScan` (from the package of the class downward). Put the main class in the root package or your components are not found."}, {"n": 4, "level": "basic", "q": "`@Component` vs `@Service` vs `@Repository` vs `@Controller` vs `@Bean`?", "a": "First four are stereotypes found by component scanning; `@Repository` also translates persistence exceptions to `DataAccessException`. `@Bean` is a factory method inside a `@Configuration` class - used for third-party classes you cannot annotate."}, {"n": 5, "level": "intermediate", "q": "How does auto-configuration work?", "a": "Boot reads the list of auto-configuration classes (`META-INF/spring/...AutoConfiguration.imports`) and applies each one only if its `@Conditional...` passes: `@ConditionalOnClass` (library on classpath), `@ConditionalOnMissingBean` (you did not define your own), `@ConditionalOnProperty`. See what happened with `--debug` or the Actuator `conditions` endpoint. Boot 4 splits the big autoconfigure jars into smaller technology modules."}, {"n": 6, "level": "intermediate", "q": "Describe the bean lifecycle.", "a": "Instantiate -> inject dependencies -> `Aware` callbacks -> `BeanPostProcessor.before` -> `@PostConstruct` / `afterPropertiesSet` -> `BeanPostProcessor.after` (AOP proxies are created here) -> ready -> `@PreDestroy` on shutdown. Knowing that proxies are made in `postProcessAfterInitialization` explains most \"why didn't my annotation work\" bugs."}, {"n": 7, "level": "intermediate", "q": "How does Spring AOP work and what is the self-invocation problem?", "a": "Spring wraps beans in a JDK or CGLIB proxy that applies advice (`@Transactional`, `@Async`, `@Cacheable`). A call from **inside** the same class bypasses the proxy, so the annotation is ignored. Fixes: move the method to another bean, inject self lazily, or use AspectJ weaving. Also: only `public` methods on proxied beans, and `final` classes/methods cannot be proxied by CGLIB."}, {"n": 8, "level": "intermediate", "q": "Circular dependency - why does it happen and how to fix?", "a": "A needs B and B needs A. Constructor injection fails fast (good); Boot 2.6+ forbids cycles by default. Fix the design: extract the shared logic into a third bean or use events. `@Lazy` is a last resort."}, {"n": 9, "level": "intermediate", "q": "How do you manage configuration and profiles?", "a": "`application.yml` + `application-{profile}.yml`, environment variables (override file values), `@ConfigurationProperties` with validation (`@Validated`) for typed config, and secrets from Vault/AWS Secrets Manager/Kubernetes Secrets - never in Git. Order of precedence: command line > env vars > profile file > default file."}, {"n": 10, "level": "intermediate", "q": "`@ConfigurationProperties` vs `@Value`?", "a": "`@ConfigurationProperties` binds a whole prefix into a typed, validated, relaxed-binding object (best for groups of settings, works with records in Boot 3+). `@Value` injects a single value with SpEL - fine for one-offs but scattered and not type-checked as a group."}, {"n": 11, "level": "intermediate", "q": "What are the Actuator endpoints you rely on?", "a": "`/actuator/health` (liveness/readiness groups for Kubernetes), `metrics` + Prometheus registry, `info`, `loggers` (change log level at runtime), `threaddump`, `heapdump`, `env`, `conditions`. Secure them: expose only what's needed, put them on a separate management port, require auth for sensitive ones."}, {"n": 12, "level": "intermediate", "q": "How do you handle exceptions globally in a REST app?", "a": "`@RestControllerAdvice` with `@ExceptionHandler` methods returning `ProblemDetail` (RFC 7807, built in since Spring 6) with a stable `type`, `title`, `status`, `detail` and a correlation id. Validation errors (`MethodArgumentNotValidException`) become a 400 with field errors; unknown errors become a 500 with no stack trace leaked."}, {"n": 13, "level": "intermediate", "q": "How does bean validation work?", "a": "Annotate DTOs (`@NotNull`, `@Size`, `@Email`, custom constraint) and add `@Valid` on the controller parameter; use `@Validated` on a class for method-level validation and validation groups. Validate at the boundary and again in the domain for invariants."}, {"n": 14, "level": "intermediate", "q": "What is the difference between `RestTemplate`, `WebClient`, `RestClient`, and HTTP interfaces?", "a": "`RestTemplate`: blocking, in maintenance mode. `WebClient`: reactive and non-blocking. `RestClient` (6.1): modern blocking fluent API, the replacement for RestTemplate. HTTP Interface clients: declare an interface with `@GetExchange` and Spring generates the client; Boot 4 adds `@ImportHttpServices` to register them with little configuration. Always set connect/read timeouts."}, {"n": 15, "level": "advanced", "q": "What's new and important in Spring Framework 7 / Boot 4?", "a": "- Built-in resilience: `@Retryable`, `@ConcurrencyLimit`, `@EnableResilientMethods` (Spring Retry features moved into core).\n- First-class **API versioning** in `@RequestMapping` (MVC and WebFlux).\n- **JSpecify** null-safety annotations across the portfolio.\n- Modularised auto-configuration (smaller starters like `spring-boot-starter-webmvc`).\n- Jackson 3 support, `BeanRegistrar` for programmatic bean registration, Spring Security 7, Jakarta EE 11.\n- Spring Data AOT for faster startup; Java 17 minimum, Java 25 recommended.\nSay you'd verify against the migration guide before upgrading."}, {"n": 16, "level": "advanced", "q": "How would you migrate Spring Boot 2.x to 3.x/4.x?", "a": "Upgrade to the last 2.7 first -> fix deprecations -> Java 17 -> `javax.*` to `jakarta.*` (OpenRewrite) -> Hibernate 6 query/ID-generation changes -> Spring Security lambda DSL (`WebSecurityConfigurerAdapter` removed) -> then 3.5 -> then 4.x via the migration guide. Run integration tests after each hop and check third-party libs for Jakarta versions."}, {"n": 17, "level": "advanced", "q": "Spring MVC request flow end to end?", "a": "Servlet container -> `DispatcherServlet` -> `HandlerMapping` finds the controller method -> interceptors `preHandle` -> argument resolvers/`HttpMessageConverter` (JSON -> object) + validation -> controller -> return value converter (object -> JSON) -> interceptors `postHandle` -> response. Filters run before the servlet; exceptions go to `HandlerExceptionResolver`/`@ControllerAdvice`."}, {"n": 18, "level": "advanced", "q": "Filter vs Interceptor vs AOP?", "a": "Filter: servlet level, sees raw request/response (security, CORS, request ids). Interceptor: Spring MVC level, knows the handler method. AOP: method level on any bean (transactions, auditing, metrics). Use the lowest level that has the information you need."}, {"n": 19, "level": "advanced", "q": "How do you do graceful shutdown and health probes on Kubernetes?", "a": "`server.shutdown=graceful` + `spring.lifecycle.timeout-per-shutdown-phase=30s`; readiness probe flips to \"refusing traffic\" first, then in-flight requests finish, then beans are destroyed; set `terminationGracePeriodSeconds` > that timeout and add a `preStop` sleep (~5s) so the load balancer stops sending traffic. Liveness must not depend on downstream services."}, {"n": 20, "level": "advanced", "q": "What are common Spring Boot startup/memory problems and fixes?", "a": "Slow startup: too many auto-configs, classpath scanning, eager `@PostConstruct` calls -> use lazy init selectively, AOT/CDS/native, remove unused starters. Memory: too many beans per tenant, big caches, thread pools per feature. Measure with `--debug`, `spring.main.lazy-initialization`, and startup actuator (`BufferingApplicationStartup`)."}, {"n": 21, "level": "design", "q": "Design a Spring Boot service skeleton you would give a new team (golden path).", "a": "Layers: `api` (controllers/DTO) -> `application` (services/use-cases, transactions) -> `domain` (entities, rules) -> `infrastructure` (repositories, clients, messaging). Cross-cutting: `ProblemDetail` error handling, correlation-id filter, structured JSON logs, Micrometer metrics + OpenTelemetry tracing, Resilience (timeouts, retry, circuit breaker), Flyway migrations, Testcontainers tests, ArchUnit rules, Dockerfile with layered jars, health probes, `/actuator` hardened. Publish it as a template repo or Maven archetype."}, {"n": 22, "level": "design", "q": "Monolith vs modular monolith vs microservices for a new product - how do you decide?", "a": "Start with a **modular monolith** (Spring Modulith 2.0 can verify module boundaries) when the domain is unclear and the team is small; split into services only for independent scaling, different release cadence, team ownership or fault isolation. Microservices add network failure, distributed transactions and operational cost - pay only when the benefit is real."}]}, {"id": "06-data-security", "title": "Spring Data, JPA/Hibernate, Transactions & Spring Security", "focus": "Persistence pitfalls, transaction boundaries, OAuth2/JWT security", "intro": "", "questions": [{"n": 1, "level": "basic", "q": "What is JPA vs Hibernate vs Spring Data JPA?", "a": "JPA = specification (Jakarta Persistence). Hibernate = the most common implementation. Spring Data JPA = repository abstraction on top (`JpaRepository`, derived queries, `@Query`, paging). Know that Hibernate is doing the SQL."}, {"n": 2, "level": "basic", "q": "What are the entity states?", "a": "Transient (new), Managed/Persistent (in the persistence context, changes auto-flushed), Detached (session closed), Removed. \"Dirty checking\" means a managed entity changed in a transaction is updated at flush without calling `save()`."}, {"n": 3, "level": "basic", "q": "LAZY vs EAGER loading?", "a": "LAZY loads a relation when first accessed (a proxy); EAGER loads it immediately. Default is LAZY for `@OneToMany`/`@ManyToMany` and EAGER for `@ManyToOne`/`@OneToOne` - set `@ManyToOne(fetch = LAZY)` explicitly. `LazyInitializationException` = you touched a lazy field after the session closed; fix with a fetch join/DTO projection, not `open-in-view`."}, {"n": 4, "level": "intermediate", "q": "What is the N+1 select problem and how do you fix it?", "a": "Loading 1 list of orders then 1 query per order for its items = N+1 queries. Fix with `JOIN FETCH`, `@EntityGraph`, `@BatchSize`/`default_batch_fetch_size`, or a DTO projection. Detect: enable SQL logging in tests and assert query counts (Hypersistence Utils / datasource-proxy)."}, {"n": 5, "level": "intermediate", "q": "How does `@Transactional` work and what are its traps?", "a": "A proxy opens a transaction, runs the method, commits or rolls back. Traps: self-invocation bypasses the proxy; only **unchecked** exceptions roll back by default (`rollbackFor = Exception.class` for checked); `private`/`final` methods; the transaction is thread-bound so work in another thread is outside it; long transactions hold connections - never call remote services inside one."}, {"n": 6, "level": "intermediate", "q": "Propagation and isolation levels?", "a": "Propagation: `REQUIRED` (join or create, default), `REQUIRES_NEW` (suspend and start a separate one - e.g. audit log that must survive rollback), `NESTED` (savepoint), `SUPPORTS`, `MANDATORY`, `NEVER`. Isolation: READ COMMITTED (default in Oracle/Postgres), REPEATABLE READ (MySQL default), SERIALIZABLE. Higher isolation = fewer anomalies, more locking/retries."}, {"n": 7, "level": "intermediate", "q": "Optimistic vs pessimistic locking?", "a": "Optimistic: a `@Version` column; the update fails with `OptimisticLockException` if someone else changed the row - good for low contention, retry on failure. Pessimistic: `SELECT ... FOR UPDATE` (`@Lock(PESSIMISTIC_WRITE)`) - good for high contention on the same row, but risks waits/deadlocks. Use `SKIP LOCKED` for job queues in a table."}, {"n": 8, "level": "intermediate", "q": "First-level vs second-level cache?", "a": "L1 is the persistence context (per transaction, always on). L2 is shared across sessions (Ehcache/Caffeine/Infinispan) and only suits read-mostly reference data; it adds invalidation complexity. Query cache is rarely worth it. Prefer an application-level cache with explicit TTL."}, {"n": 9, "level": "intermediate", "q": "When do you use JdbcTemplate/jOOQ/native SQL instead of JPA?", "a": "Reporting queries, bulk updates, complex joins/window functions, Oracle-specific features, and hot paths where you need exact SQL. JPA suits CRUD with an aggregate; mixing both is normal (CQRS-style: JPA for writes, SQL/projections for reads)."}, {"n": 10, "level": "intermediate", "q": "How do you do paging safely?", "a": "`Pageable` with a stable sort. Offset paging gets slower with depth (O(offset)); for large tables use keyset/seek paging (`WHERE id > :last ORDER BY id LIMIT 50`). Avoid `Page` (it runs an extra `count(*)`) when you only need `Slice`."}, {"n": 11, "level": "advanced", "q": "Why is `equals/hashCode` on JPA entities tricky?", "a": "The id is null before persist and the proxy class differs from the entity class. Use a stable business key or compare ids only when non-null with a constant `hashCode`. Never include lazy collections in `equals`, `hashCode` or `toString` (it triggers loading or infinite recursion)."}, {"n": 12, "level": "advanced", "q": "How do you manage schema changes safely?", "a": "Flyway/Liquibase versioned migrations, run by the pipeline, never `ddl-auto=update` in production. For zero downtime use **expand/contract**: add nullable column -> deploy code writing both -> backfill in batches -> switch reads -> drop the old column in a later release. Keep every migration backward compatible with the previous app version."}, {"n": 13, "level": "advanced", "q": "How do you do bulk inserts efficiently with JPA?", "a": "`hibernate.jdbc.batch_size=50`, `order_inserts/order_updates=true`, avoid `IDENTITY` ids (disables batching) - use sequences with `allocationSize`, flush and clear the persistence context every batch. For millions of rows use JDBC batch, `COPY` (Postgres), or SQL*Loader/`MERGE` (Oracle)."}, {"n": 14, "level": "basic", "q": "How does Spring Security's filter chain work?", "a": "Requests pass through a `SecurityFilterChain` of filters: authentication filters build an `Authentication`, authorization filters check rules (`authorizeHttpRequests`), then the request reaches the controller. Configure with a `SecurityFilterChain` bean and the lambda DSL (the old `WebSecurityConfigurerAdapter` is gone)."}, {"n": 15, "level": "intermediate", "q": "Authentication vs authorization; sessions vs JWT?", "a": "Authentication = who are you; authorization = what may you do. Session: server state, easy revoke, needs sticky/shared store. JWT: stateless signed token, scales easily, hard to revoke before expiry -> short TTL access token + refresh token + a revocation list when needed. Always validate signature, `exp`, `iss`, `aud`."}, {"n": 16, "level": "intermediate", "q": "Explain OAuth2 / OIDC flows you would use.", "a": "Authorization Code + PKCE for user login (SPA/mobile/web), Client Credentials for service-to-service, refresh token for renewal. The API acts as a **resource server** validating JWTs from the IdP (Keycloak, Azure AD/Entra ID, Okta, Cognito). Use scopes/roles for authorization; never use the implicit flow."}, {"n": 17, "level": "advanced", "q": "Method security and common vulnerabilities to mention?", "a": "`@PreAuthorize(\"hasRole('ADMIN') or #id == authentication.name\")` for fine-grained rules. OWASP list: broken access control (check ownership, not just roles - IDOR), injection (parameterised queries), mass assignment (use DTOs), SSRF, security misconfiguration, vulnerable dependencies (SBOM + Dependabot/Snyk), secrets in code. Add CSRF protection for cookie sessions, CORS allow-list, rate limiting, security headers."}, {"n": 18, "level": "design", "q": "Design authentication/authorization for a set of microservices.", "a": "Edge: API gateway validates the JWT from the IdP (or passes it on); each service re-validates (zero trust) as a resource server. Service-to-service: client-credentials tokens or mTLS from a service mesh. Propagate user identity via the token, not custom headers. Central policy/roles with least privilege, audit logging, short TTL + key rotation (JWKS), secrets in a vault."}, {"n": 19, "level": "intermediate", "q": "How do you protect sensitive data in the database and logs?", "a": "Encrypt at rest (TDE / disk), encrypt specific columns (PII) with envelope encryption (KMS), hash passwords with bcrypt/argon2, mask PII in logs, never log tokens/card data, restrict DB users per service, and rotate credentials (the API-key rotation work you did is a good story)."}, {"n": 20, "level": "design", "q": "Design the data access layer so that the service can later move from Oracle to PostgreSQL (or add Couchbase).", "a": "Repository interfaces in the domain layer, implementations in infrastructure; avoid vendor SQL in the service; keep SQL in one place; use Flyway per vendor if dialects differ; contract tests that run against both DBs with Testcontainers; map entities <-> domain objects so the model does not depend on JPA annotations."}]}, {"id": "07-rest-api", "title": "REST API Design & Integration", "focus": "Idempotency, versioning, pagination, errors, security, performance", "intro": "", "questions": [{"n": 1, "level": "basic", "q": "What makes an API RESTful?", "a": "Resources identified by URLs (`/orders/42`), standard HTTP verbs, stateless requests, representations (JSON), correct status codes, cacheability, and (ideally) hypermedia. Nouns in URLs, verbs in HTTP methods."}, {"n": 2, "level": "basic", "q": "GET vs POST vs PUT vs PATCH vs DELETE - which are safe and idempotent?", "a": "Safe (no change): GET, HEAD. Idempotent (same result if repeated): GET, PUT, DELETE, HEAD. POST is neither; PATCH is not guaranteed idempotent. PUT replaces the whole resource; PATCH changes part of it."}, {"n": 3, "level": "basic", "q": "Which status codes do you use and when?", "a": "200 OK, 201 Created (+`Location`), 202 Accepted (async), 204 No Content, 400 bad input, 401 not authenticated, 403 not allowed, 404 not found, 409 conflict (version/duplicate), 422 semantic validation, 429 too many requests, 500 server bug, 502/503/504 upstream problems. Never return 200 with an error inside."}, {"n": 4, "level": "intermediate", "q": "How do you make a POST idempotent (e.g. payment/order creation)?", "a": "Client sends an `Idempotency-Key` header. Server stores `key -> request hash -> response` (unique constraint) in the same transaction as the business write; a repeat returns the stored response; same key with a different body returns 409/422. Keys expire after ~24h. This is what makes retries safe."}, {"n": 5, "level": "intermediate", "q": "How do you version an API?", "a": "Options: URL (`/v2/orders`), header/media type (`Accept: application/vnd.app.v2+json`), query param. URL versioning is the most visible and simplest for consumers; Spring Framework 7 now has built-in versioning support. Policy matters more than mechanism: only version for breaking changes, add fields compatibly, publish a deprecation date, support N-1."}, {"n": 6, "level": "intermediate", "q": "How do you design pagination, filtering and sorting?", "a": "`GET /orders?status=PAID&sort=-createdAt&limit=50&cursor=abc`. Offset/limit is simple but slow and unstable on large/changing data; **cursor (keyset)** pagination is stable and fast. Return `nextCursor` and a total only if it's cheap. Cap `limit`; whitelist sortable fields."}, {"n": 7, "level": "intermediate", "q": "How do you design the error response?", "a": "One consistent shape (RFC 7807 Problem Details): `type`, `title`, `status`, `detail`, `instance`, plus `code` and `errors[]` for field problems and a `traceId` for support. Stable machine codes, human text, no stack traces."}, {"n": 8, "level": "intermediate", "q": "PUT vs PATCH and optimistic concurrency over HTTP?", "a": "Use `ETag`/`If-Match` (or a `version` field): the client sends the version it read; the server returns `412 Precondition Failed` (or 409) if it changed - prevents lost updates in concurrent edits."}, {"n": 9, "level": "intermediate", "q": "How do you handle long-running operations?", "a": "Return `202 Accepted` with `Location: /jobs/123`; the client polls `GET /jobs/123` (status, progress, result link) or receives a webhook/event. Persist the job, make the worker idempotent, expire results. Good example: the large file upload pipeline."}, {"n": 10, "level": "intermediate", "q": "How do you handle large file upload/download?", "a": "Don't stream large files through the service if you can avoid it: return a **pre-signed URL** so the client uploads directly to S3/Blob storage, using **multipart upload** (parallel parts, resume on failure), then notify the service (event). Validate size/type, scan for malware, and use `Range` requests for downloads."}, {"n": 11, "level": "intermediate", "q": "REST vs GraphQL vs gRPC?", "a": "REST: simple, cacheable, universal. GraphQL: flexible client-chosen fields, avoids over/under-fetching, but needs query cost limits and is harder to cache. gRPC: binary Protobuf over HTTP/2, strongly typed, streaming, best for internal service-to-service. Typical choice: REST for public, gRPC internal, GraphQL for a BFF over many backends."}, {"n": 12, "level": "intermediate", "q": "How do you secure a REST API?", "a": "TLS everywhere, OAuth2/JWT, least-privilege scopes, object-level authorization (IDOR checks), input validation, rate limiting, request size limits, CORS allow-list, no secrets in URLs, audit logs, and an API gateway/WAF in front. Return 404 vs 403 deliberately for resources the caller must not know exist."}, {"n": 13, "level": "intermediate", "q": "What is HATEOAS and do you use it?", "a": "Responses include links to the next possible actions. It's the \"full REST\" maturity level; in practice few teams use it - clear documentation and stable URLs matter more. Be honest: \"I know it, I use it only where clients really are generic\"."}, {"n": 14, "level": "advanced", "q": "How do you document and test the contract?", "a": "OpenAPI spec (design-first or generated by springdoc), published to a portal; **consumer-driven contract tests** (Pact / Spring Cloud Contract) so a provider can't break a consumer; schema/breaking-change checks (openapi-diff) in CI; mock servers for parallel development."}, {"n": 15, "level": "advanced", "q": "How do you make API calls to other services resilient?", "a": "Always set connect and read **timeouts**; retry only idempotent calls with exponential backoff + jitter and a cap; **circuit breaker** to stop hammering a failing service; **bulkhead** to isolate pools; fallback/cached response where acceptable; propagate a deadline so downstream doesn't work for a caller that already gave up. (Resilience4j or Spring Framework 7 `@Retryable`/`@ConcurrencyLimit`.)"}, {"n": 16, "level": "advanced", "q": "Compression, caching and performance tips?", "a": "Enable gzip/br for JSON, HTTP caching (`Cache-Control`, `ETag`, 304), pagination, field selection, avoid chatty APIs (batch endpoints), connection reuse (HTTP keep-alive/HTTP2), asynchronous processing for slow work, and measure p95/p99 per endpoint."}, {"n": 17, "level": "intermediate", "q": "What is a webhook and how do you make it reliable?", "a": "The server calls the client's URL on an event. Reliability: sign payloads (HMAC), retries with backoff, idempotent event ids, a delivery log and replay endpoint, a dead-letter list, and timeouts on the receiver. Treat the receiver as unreliable."}, {"n": 18, "level": "design", "q": "Design a public \"Orders\" API for 3rd-party partners.", "a": "Resources: `/orders`, `/orders/{id}`, `/orders/{id}/payments`. Auth: OAuth2 client credentials + per-partner rate limits via gateway. Writes: idempotency keys, optimistic version. Reads: cursor pagination, filtering, ETag caching. Errors: Problem Details. Evolution: URL major version, additive changes only, changelog, sandbox environment. Observability: per-partner dashboards, request ids, SLOs, usage metering. Async events: webhooks with signing."}, {"n": 19, "level": "design", "q": "Design an API gateway layer. What belongs there and what does not?", "a": "Belongs: TLS termination, authentication, coarse authorization, rate limiting, routing, request/response logging, CORS, caching of public GETs, canary routing. Does **not** belong: business logic, data orchestration across many domains (use a BFF/aggregator service), heavy transformations. Make it highly available and observable; keep config in Git."}, {"n": 20, "level": "intermediate", "q": "How do you deprecate an endpoint without breaking clients?", "a": "Announce with a date, add `Deprecation`/`Sunset` headers, log which clients still call it (by API key), contact heavy users, run both versions, and remove only when usage is ~zero. Metrics decide the removal date."}]}, {"id": "08-microservices", "title": "Microservices Architecture & Patterns", "focus": "Boundaries, data, sagas, resilience, communication, deployment", "intro": "", "questions": [{"n": 1, "level": "basic", "q": "What is a microservice and what are the benefits and costs?", "a": "A small, independently deployable service owning one business capability and its data. Benefits: independent scaling/deploys, team autonomy, fault isolation, technology choice. Costs: network failures, distributed data consistency, testing and debugging complexity, operational overhead (deploy, monitor, secure N services)."}, {"n": 2, "level": "basic", "q": "How do you decide service boundaries?", "a": "Use Domain-Driven Design: **bounded contexts** around business capabilities (Orders, Payments, Inventory), high cohesion inside, low coupling between. A good boundary changes for one reason and one team owns it. Splitting by technical layer (a \"DB service\") is a smell."}, {"n": 3, "level": "intermediate", "q": "Synchronous vs asynchronous communication?", "a": "Sync (REST/gRPC): simple, immediate answer, but couples availability and latency. Async (Kafka/RabbitMQ events): decouples, absorbs spikes, enables fan-out, but is eventually consistent and harder to trace. Rule: commands that need an immediate answer = sync; facts that others react to = events."}, {"n": 4, "level": "intermediate", "q": "Why \"database per service\" and how do you handle joins?", "a": "Shared DBs couple services at the schema level. Each service owns its data and exposes it by API/events. For cross-service queries: API composition (aggregator/BFF), **CQRS read models** built from events, or replicate needed reference data via events."}, {"n": 5, "level": "intermediate", "q": "Explain the Saga pattern. Choreography vs orchestration?", "a": "A saga is a sequence of local transactions with **compensating actions** if a later step fails (Order -> Reserve stock -> Charge payment; on payment failure release stock and cancel order). Choreography: services react to each other's events (simple, hard to see the whole flow). Orchestration: a coordinator drives steps (clear flow, central logic; Temporal, Camunda, Step Functions). Compensations must be idempotent."}, {"n": 6, "level": "intermediate", "q": "What is the Transactional Outbox pattern and why?", "a": "You can't atomically write to the DB **and** publish to Kafka. Write the event into an `outbox` table in the same DB transaction, then a relay (poller or CDC such as Debezium) publishes it. Consumers dedupe by event id. This gives at-least-once publishing without dual-write bugs."}, {"n": 7, "level": "intermediate", "q": "How do you handle distributed transactions without 2PC?", "a": "Avoid them: design aggregates inside one service, use sagas/outbox, make operations idempotent, accept eventual consistency, and add reconciliation jobs that detect and repair drift. 2PC (XA) hurts availability and is not supported by most cloud messaging."}, {"n": 8, "level": "intermediate", "q": "Which resilience patterns do you apply on every remote call?", "a": "Timeout, retry with backoff + jitter (idempotent calls only), circuit breaker, bulkhead, rate limiter, fallback, and load shedding. Order matters: `Retry( CircuitBreaker( RateLimiter( TimeLimiter( call ))))`. Test with fault injection (Chaos Monkey, Toxiproxy)."}, {"n": 9, "level": "intermediate", "q": "What is service discovery and how does it work in Kubernetes?", "a": "Clients find instances by name. In Kubernetes a `Service` gives a stable DNS name (`orders.default.svc`) and load-balances across ready pods, so Eureka/Consul are usually unnecessary. Client-side load balancing (Spring Cloud LoadBalancer) matters for non-Kubernetes setups."}, {"n": 10, "level": "intermediate", "q": "What is an API Gateway vs BFF vs Service Mesh?", "a": "Gateway: one entry point for external traffic (auth, routing, limits). BFF (Backend for Frontend): an API tailored per client type (web, mobile). Service mesh (Istio/Linkerd): sidecar proxies handling mTLS, retries, traffic shifting and telemetry for east-west traffic - adds operational complexity, so adopt when you have many services."}, {"n": 11, "level": "intermediate", "q": "How do you handle configuration and secrets across services?", "a": "Externalised config (ConfigMaps, Spring Cloud Config, AWS Parameter Store/AppConfig), secrets in Vault/Secrets Manager (injected at runtime, rotated), environment-specific overlays (Kustomize/Helm), no secrets in images or Git, and feature flags for runtime toggles."}, {"n": 12, "level": "advanced", "q": "How do you version events and APIs between services?", "a": "Add-only changes (new optional fields), never repurpose a field, use a schema registry (Avro/Protobuf/JSON Schema) with BACKWARD compatibility, tolerate unknown fields (tolerant reader), dual-publish old+new versions during migration, and use consumer-driven contract tests."}, {"n": 13, "level": "advanced", "q": "How do you test microservices?", "a": "Pyramid: many unit tests, service-level integration tests with **Testcontainers** (real DB/Kafka), consumer-driven **contract tests** between services, a few end-to-end tests in a staging environment, plus load and chaos tests. Avoid relying on full-system E2E for every change."}, {"n": 14, "level": "advanced", "q": "How do you do deployments safely?", "a": "CI builds an immutable image -> deploy to staging -> smoke/contract tests -> **canary or blue/green** with automatic rollback on SLO breach -> feature flags to decouple deploy from release. Database changes follow expand/contract so old and new versions run together."}, {"n": 15, "level": "advanced", "q": "How do you decompose a monolith (strangler fig)?", "a": "Put a facade/gateway in front, route one capability at a time to a new service, keep the monolith running, sync data via events/CDC, and delete the old code once traffic is moved. Start with a module that has clear boundaries and high change rate; avoid a big-bang rewrite."}, {"n": 16, "level": "advanced", "q": "What are the signs you've built a \"distributed monolith\"?", "a": "Services must be deployed together, share a database, call each other in long synchronous chains, share a big common library with domain logic, or one failure takes everything down. Remedy: re-draw boundaries, introduce events, remove shared DB, shrink shared libs to technical utilities."}, {"n": 17, "level": "design", "q": "Design an e-commerce checkout across Order, Inventory, Payment and Notification services.", "a": "Orchestrated saga: Order creates `PENDING` -> Inventory reserves stock -> Payment charges (idempotency key) -> Order marks `CONFIRMED` -> Notification sends email from the `OrderConfirmed` event. Failure paths: payment fails -> release stock -> `CANCELLED`; timeouts handled by a saga timer. Use outbox for every event, idempotent consumers, a dead-letter queue, a status API for the UI, and dashboards for stuck sagas."}, {"n": 18, "level": "design", "q": "Design for high availability: what do you do at service, data and infrastructure level?", "a": "Service: multiple replicas across zones, readiness/liveness, graceful shutdown, timeouts and breakers. Data: replicated DB with failover, backups and tested restore, idempotent writes. Infra: multi-AZ nodes, pod anti-affinity/topology spread, PodDisruptionBudgets, autoscaling, no single point of failure (gateway, DNS, queue). Define RTO/RPO and test failover regularly."}, {"n": 19, "level": "design", "q": "Design the observability for 30 microservices.", "a": "Three pillars with one correlation id: **metrics** (RED: rate, errors, duration per endpoint + JVM/pool metrics), **logs** (structured JSON with `traceId`, central search), **traces** (OpenTelemetry across HTTP and Kafka headers). SLOs and burn-rate alerts per service, golden-signal dashboards, an on-call runbook per alert."}, {"n": 20, "level": "intermediate", "q": "When should you NOT use microservices?", "a": "Small team, unclear domain, simple CRUD, low scale, or no DevOps maturity. A modular monolith with clean module boundaries is faster to build and easy to split later."}, {"n": 21, "level": "intermediate", "q": "What is CQRS and when is Event Sourcing worth it?", "a": "CQRS separates the write model from read models optimised for queries (often separate stores). Event sourcing stores state as an append-only list of events - great for audit and replay, but adds complexity (schema evolution, snapshots, eventual consistency). Use it only where history is a core requirement (finance, ledger)."}]}, {"id": "09-kafka", "title": "Apache Kafka (and RabbitMQ) for Java Developers", "focus": "Delivery guarantees, ordering, consumer groups, failure handling, Spring Kafka, Kafka 4", "intro": "Kafka 4.0 (Mar 2025) removed ZooKeeper: clusters run **KRaft** only. Queues for Kafka (share groups, KIP-932) arrived in early access, then preview in 4.1. Spring for Apache Kafka 4.0 supports the new consumer rebalance protocol (KIP-848).", "questions": [{"n": 1, "level": "basic", "q": "What is Kafka and what problems does it solve?", "a": "A distributed, durable, partitioned commit log. Producers append events to topics, consumers read at their own pace and can replay. Used for decoupling services, event streaming, log/CDC pipelines, and buffering spikes. Difference from a classic queue: messages are **not deleted on read**; they're retained by time/size."}, {"n": 2, "level": "basic", "q": "Explain topic, partition, offset, broker, replica.", "a": "Topic = named stream. Partition = ordered, append-only slice of a topic (unit of parallelism). Offset = position of a record in a partition. Broker = Kafka server. Each partition has a leader and follower replicas (replication factor, usually 3)."}, {"n": 3, "level": "basic", "q": "What is a consumer group?", "a": "Consumers with the same `group.id` share the partitions of a topic - each partition is read by **one consumer in the group**, so parallelism is limited by the partition count. Different groups each get all messages (pub/sub). Extra consumers beyond partitions sit idle."}, {"n": 4, "level": "intermediate", "q": "How does Kafka guarantee ordering?", "a": "Only **within a partition**. Records with the same key go to the same partition (hash of key), so all events for one order/customer stay ordered. No global ordering across partitions. Changing partition count breaks the key->partition mapping for existing keys."}, {"n": 5, "level": "intermediate", "q": "Explain delivery semantics: at-most-once, at-least-once, exactly-once.", "a": "At-most-once: commit offset before processing (can lose). At-least-once: process, then commit (can duplicate) - the practical default. Exactly-once: idempotent producer + transactions (read-process-write within Kafka) with `read_committed` consumers. For an external DB sink, make the write **idempotent** (unique event id / upsert)."}, {"n": 6, "level": "intermediate", "q": "What producer settings give \"don't lose messages\"?", "a": "`acks=all`, `enable.idempotence=true` (dedupes broker-side retries; implies safe `max.in.flight`), `retries` high with `delivery.timeout.ms` bounded, topic `min.insync.replicas=2` with replication factor 3, and always handle the send callback/future failure. `linger.ms` and `batch.size` trade latency for throughput; `compression.type=lz4/zstd`."}, {"n": 7, "level": "intermediate", "q": "Why disable auto-commit and how do you commit offsets?", "a": "Auto-commit commits on a timer, possibly before your processing finishes -> silent loss on a crash. Use manual commit after success (`AckMode.RECORD`/`BATCH`/`MANUAL` in Spring Kafka) or commit transactionally with the DB write result. Commit per batch to reduce overhead."}, {"n": 8, "level": "intermediate", "q": "What is a rebalance and why does it hurt?", "a": "When consumers join/leave or time out, partitions are reassigned and consumption pauses. Causes: slow processing exceeding `max.poll.interval.ms`, missed heartbeats (`session.timeout.ms`), deployments. Reduce impact: cooperative sticky assignor (incremental), static membership (`group.instance.id`), smaller `max.poll.records`, fast handlers; the new protocol (KIP-848) moves assignment to the broker and is much smoother."}, {"n": 9, "level": "intermediate", "q": "How do you handle a poison message and retries?", "a": "Classify errors: **non-retryable** (bad schema/validation) -> straight to a Dead Letter Topic; **retryable** (DB down) -> bounded retries with backoff. In Spring Kafka use `DefaultErrorHandler` with `ExponentialBackOff` and `DeadLetterPublishingRecoverer`, or `@RetryableTopic` for non-blocking retry topics (trade-off: loses strict ordering per key). Never block the poll loop with long `sleep`."}, {"n": 10, "level": "intermediate", "q": "How do you make a consumer idempotent?", "a": "Store a processed event id (unique key) in the same transaction as the side effect; use upserts (`INSERT ... ON CONFLICT DO NOTHING`, `MERGE` in Oracle); make state changes conditional on version. Redelivery is normal (rebalance, retry), so every handler must tolerate duplicates."}, {"n": 11, "level": "intermediate", "q": "Kafka vs RabbitMQ - when each?", "a": "Kafka: high throughput, retention/replay, event streaming, ordering per key, many independent consumer groups. RabbitMQ: smart broker with routing (exchanges), per-message ack/TTL/priorities, request/reply, work queues, lower latency for small loads. Pick Kafka for event log/analytics/integration; RabbitMQ for task distribution and complex routing."}, {"n": 12, "level": "intermediate", "q": "RabbitMQ basics: exchange types, acks, DLQ?", "a": "Producers publish to an **exchange** (direct, topic, fanout, headers) which routes to **queues** by binding key. Consumers `ack` after processing (`nack`/requeue on failure); use publisher confirms, durable queues + persistent messages, prefetch (QoS) to limit in-flight messages, and a dead-letter exchange with TTL/`x-delivery-limit` for poison messages. Quorum queues are the recommended HA type."}, {"n": 13, "level": "advanced", "q": "How does replication and `min.insync.replicas` work?", "a": "Writes go to the partition leader and followers copy it; the **ISR** (in-sync replicas) are followers caught up. With `acks=all`, a write succeeds only when all ISR have it, and fails if ISR size < `min.insync.replicas`. RF=3, min.isr=2 survives one broker loss without data loss or unavailability. `unclean.leader.election` should stay off."}, {"n": 14, "level": "advanced", "q": "How do you size partitions and choose keys?", "a": "Partitions >= max consumers you want in parallel; start from target throughput / per-partition throughput (~10 MB/s is a rough rule), leave growth room (you can add but not reduce, and adding changes key mapping). Choose a key with even distribution and the ordering unit you need (orderId, accountId). Beware hot keys (one huge customer) - consider salting if ordering allows."}, {"n": 15, "level": "advanced", "q": "Explain log compaction and retention.", "a": "Retention deletes old segments by time/size. Compaction keeps the **latest value per key** (a changelog / table-like topic; tombstone = null value deletes the key). Used for state topics, CDC, config. Compaction doesn't guarantee immediate removal."}, {"n": 16, "level": "advanced", "q": "How do you manage schemas and evolution?", "a": "Schema Registry with Avro/Protobuf/JSON Schema; messages carry a schema id. Use BACKWARD (or BACKWARD_TRANSITIVE) compatibility: new consumers read old data - so add fields with defaults, don't rename/remove required fields. Disable auto-register in production; CI registers schemas after a compatibility check."}, {"n": 17, "level": "advanced", "q": "How do you monitor Kafka consumers?", "a": "**Consumer lag** per partition (the most important metric), records consumed rate, processing time, rebalance count, error/DLT rate, under-replicated partitions and request latency on brokers (JMX -> Prometheus/Datadog/CloudWatch). Alert on lag growing for N minutes, not on one spike. Burrow/Kafka UI/Conduktor help inspect."}, {"n": 18, "level": "advanced", "q": "Consumer lag is growing - how do you debug?", "a": "1. Is the producer rate up or the consumer rate down? 2. Check the handler time per record (slow DB call, downstream timeout). 3. Rebalance loops (poll interval exceeded). 4. Partition skew (one hot partition). 5. Poison message retrying forever. Fix: optimise the handler/batch writes, increase partitions + consumers (not beyond partitions), use concurrency in the listener, move slow work off the poll thread safely, scale downstream."}, {"n": 19, "level": "advanced", "q": "What are Kafka transactions and exactly-once in Kafka Streams?", "a": "A transactional producer atomically writes output records and the consumed offsets; consumers using `read_committed` only see committed data. Kafka Streams enables it with `processing.guarantee=exactly_once_v2`. It covers Kafka-to-Kafka only; an external database still needs idempotency."}, {"n": 20, "level": "advanced", "q": "What changed with Kafka 4.0 (KRaft, queues)?", "a": "ZooKeeper is gone: metadata is managed by a Raft quorum inside Kafka (simpler ops, faster failover and recovery, higher partition limits). Clusters on ZooKeep

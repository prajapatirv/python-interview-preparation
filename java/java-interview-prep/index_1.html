narQube (quality gate, security hotspots), ArchUnit (architecture rules), OpenRewrite (automated refactors/migrations). Automate in CI and IDE; reviews then focus on design."}, {"n": 19, "level": "intermediate", "q": "How do you secure the build pipeline (supply chain)?", "a": "Pinned and verified dependencies, private artifact repository, signed images (cosign) and provenance (SLSA), least-privilege pipeline credentials via OIDC (no long-lived secrets), protected branches with required reviews, secret scanning, and isolated build runners."}, {"n": 20, "level": "intermediate", "q": "How are you using AI assistants (Copilot / Claude Code / Amazon Q) in engineering - and what are the guardrails?", "a": "Use them for boilerplate, tests, refactors, code review hints and documentation, and for exploring unfamiliar code. Guardrails: humans own the code (review everything), never paste secrets/customer data, run the full test and security pipeline, keep prompts/context scoped (e.g. via Amazon Bedrock inside the company boundary), measure impact (cycle time, defect rate), and teach the team good prompting. Relevant to your Claude-via-Bedrock and Amazon Q rollout."}]}, {"id": "19-resume-stack", "title": "Resume Tech-Stack Deep Dive (Quarkus, Dropwizard, Spring Batch, RabbitMQ, OpenSearch, AWS)", "focus": "Questions an interviewer asks about technologies listed on a Java lead's resume (Python/Groovy/Grails excluded)", "intro": "Interviewers pick 2-3 resume items and drill down. For each, prepare: what the system did, your decision, a trade-off, a number, and a failure you handled. Replace placeholders in answers with your real figures.", "questions": [{"n": 1, "level": "basic", "q": "Quarkus vs Spring Boot - why would you choose Quarkus?", "a": "Quarkus does work at **build time** (CDI wiring, config, reflection hints) so it starts fast with low memory and supports native images well; it has live coding dev mode, a Dev Services feature (auto-starts DB/Kafka containers) and a Spring-compat layer. Spring Boot has the bigger ecosystem and hiring pool. Quarkus fits CLI tools, serverless and many small services; use what the team can support."}, {"n": 2, "level": "intermediate", "q": "How does Quarkus DI differ from Spring?", "a": "Quarkus uses **ArC**, a build-time CDI-lite implementation (`@ApplicationScoped`, `@Inject`, `@Produces`); beans are resolved at build time, no runtime classpath scanning or reflection-heavy proxying. Config via `application.properties` and MicroProfile Config (`@ConfigProperty`). Unused beans are removed at build."}, {"n": 3, "level": "intermediate", "q": "What is Picocli and why did you use it for parsers?", "a": "A Java library for building command-line tools with annotations (`@Command`, `@Option`, `@Parameters`), generating help, validation, subcommands and shell completion; the Quarkus Picocli extension integrates DI and can build a native executable. Good for batch utilities: each parser runs as `parse --format csv --input file --output out.json`, easy to run in Airflow/ECS/Lambda or locally."}, {"n": 4, "level": "intermediate", "q": "How did you design the multi-format file parsers (CSV, XLS/XLSX, XML, PDF, ZIP -> standard JSON)?", "a": "Strategy per format behind one `Parser` interface; streaming readers (SAX/StAX for XML, streaming CSV, Apache POI streaming reader for big XLSX, PDFBox for text extraction) to bound memory; ZIP handled by iterating entries and delegating by extension; court-specific mapping config to the canonical JSON schema; validation + a quarantine path for malformed rows; unit tests with sample files per court. Mention numbers (files/day, max size).\n> Follow-up: how do you avoid zip bombs (limit entries, size, nesting)?"}, {"n": 5, "level": "intermediate", "q": "How did you handle very large file uploads to S3?", "a": "Use **multipart upload** (parts of 8-100 MB uploaded in parallel, retry a failed part, complete at the end; abort incomplete uploads with a lifecycle rule), a transfer manager/async client, streaming from source so memory stays flat, checksum verification, and pre-signed URLs when clients upload directly. Track progress and make the step idempotent (same key + checksum)."}, {"n": 6, "level": "intermediate", "q": "Explain the end-to-end data-acquisition workflow architecture.", "a": "Sources (SFTP/FTP, email attachments/links, portals, physical media) -> ingestion -> S3 landing -> orchestrated by an Airflow DAG (MWAA) with retries/SLAs -> court-specific parser (Java/Quarkus) -> canonical JSON -> database or Kafka for downstream consumers -> SES notifications on success/failure -> audit and replay. Be ready to draw it and to say where it can fail and how it recovers."}, {"n": 7, "level": "intermediate", "q": "Why Airflow for orchestration, and what are its limits for a Java engineer?", "a": "DAGs give scheduling, dependency management, retries, backfills, visibility and alerting without custom code. Limits: not a streaming engine, task latency overhead, DAG code is Python (Java parsers run as containers/CLI/Lambda tasks). Keep tasks idempotent and small; pass references (S3 keys), not data, between tasks."}, {"n": 8, "level": "intermediate", "q": "How do you send notifications with SES and avoid problems?", "a": "SES for transactional email (success/failure alerts): verified identities (SPF/DKIM/DMARC), sandbox limits, bounce/complaint handling through SNS, rate limits, templated messages, retries with backoff, and alert aggregation to avoid noise. For incident alerting also route to Slack/PagerDuty."}, {"n": 9, "level": "intermediate", "q": "What is Dropwizard and how is it different from Spring Boot?", "a": "An opinionated Java framework bundling Jetty, Jersey (JAX-RS), Jackson, Hibernate Validator, metrics, health checks and Logback with a YAML config class and a simple `Application`/`Resource` model. Lightweight and explicit (little \"magic\"), fast to understand; smaller ecosystem than Spring. You ran Dropwizard 4.0.10 at Cvent: be ready to talk about `Managed` lifecycle, health checks, bundles, Jersey filters and metrics."}, {"n": 10, "level": "intermediate", "q": "How did you do the Elasticsearch -> OpenSearch migration?", "a": "OpenSearch is the AWS-led fork of Elasticsearch 7.10. Steps: check client compatibility (switch to the OpenSearch Java client or REST client), verify mappings/analyzers and queries, test plugins, snapshot/restore or reindex into the new domain, run dual-write or shadow reads and compare results, cut over, monitor latency and relevance, keep rollback. Risks: version-specific APIs, auth changes (IAM/fine-grained access), index lifecycle policies."}, {"n": 11, "level": "intermediate", "q": "How do you design search with OpenSearch/Elasticsearch in a Java service?", "a": "Source-of-truth DB + an index populated by events/CDC; explicit mappings (keyword vs text), analyzers, aliases for zero-downtime reindex, pagination with `search_after`, bulk indexing with backoff, circuit breaker around searches, and a rebuild job. Search is eventually consistent."}, {"n": 12, "level": "intermediate", "q": "RabbitMQ in your projects - how did you use it reliably?", "a": "Durable exchanges/queues, persistent messages, publisher confirms, manual acks after processing, prefetch tuning, dead-letter exchange with retry delay queues, idempotent consumers, and monitoring queue depth/consumer count. Compare honestly with Kafka (see the Kafka topic)."}, {"n": 13, "level": "intermediate", "q": "Spring Batch - chunk processing, restart and scaling?", "a": "Job -> Steps; a chunk step reads N items, processes, writes in one transaction (`chunk(100)`); `JobRepository` stores execution state so a failed job **restarts** from the last committed chunk; skip/retry policies, listeners, partitioning and remote chunking for scale; idempotent writers; Spring Batch 5/6 uses `JobBuilder`/`StepBuilder` (no `JobBuilderFactory`). You used 3.0 for batch submission to a vendor REST service - describe retries and status polling."}, {"n": 14, "level": "intermediate", "q": "How did you handle submitting files in batches to a third-party REST service and tracking status?", "a": "Batch table with parent/child batch status, submit in controlled batch size with timeouts and retries, store vendor correlation ids, scheduled poller (Spring Batch/Scheduler) updates status, dashboard reads from DB, failures flagged for resubmission, idempotent submit to avoid duplicates, audit logs of requests/responses."}, {"n": 15, "level": "intermediate", "q": "Maven build and dependency upgrade work (ConfStrMig) - what did you handle?", "a": "Parent POM/BOM alignment, dependency convergence (`mvn dependency:tree`, enforcer plugin), upgrading vulnerable versions, plugin upgrades, removing duplicates, reproducible builds, profiles, multi-module layout, faster CI with caching. Story: the biggest risk you hit and how tests protected the upgrade."}, {"n": 16, "level": "intermediate", "q": "API key rotation - how do you do it without downtime?", "a": "Support **two valid keys** during a window (old + new), distribute the new key via a secret store, roll clients gradually, monitor usage per key, then revoke the old key; automate expiry alerts and rotation schedule; audit every use. Never hard-code keys; reload without restart."}, {"n": 17, "level": "intermediate", "q": "Logging improvement work - what did you change?", "a": "Structured JSON logging, correlation ids via MDC, consistent levels, removal of noisy/PII logs, log aggregation with searchable fields, and metrics for the key events. Show before/after impact (search time, incident time-to-diagnose)."}, {"n": 18, "level": "intermediate", "q": "Multi-tenant / \"DB sharding\" work in the ERP (CBOS).", "a": "For 30+ clients: per-tenant data separation (shared schema with tenant id or separate DBs), routing by tenant at connection level (routing DataSource), per-tenant migrations, noisy-neighbour control, and tenant-aware backups. Describe how you maintained the sharding module and any incident."}, {"n": 19, "level": "intermediate", "q": "OSGi/iDempiere - what should you say?", "a": "Only claim what you know: OSGi gives modular bundles with their own classloaders and lifecycle; iDempiere is an OSGi-based open-source ERP; you built warehouse/manufacturing/signature modules as plug-ins. If probed on OSGi internals, say it was a legacy platform and pivot to modular design lessons."}, {"n": 20, "level": "intermediate", "q": "How are you using Claude via Amazon Bedrock and Amazon Q in engineering?", "a": "Integrated Claude (through Bedrock) across Bitbucket repositories for code review/insights and used Amazon Q for generation, reviews and explanations. Talk about guardrails (data stays in AWS, human review, tests/security still gate merges), productivity metrics, and prompt standards for the team."}, {"n": 21, "level": "design", "q": "Redesign the data-acquisition pipeline to handle 10x volume and add Azure support.", "a": "Make ingestion event-driven (object-created events), parsers as stateless containers autoscaled by queue depth, Kafka (or Event Hubs on Azure) between parse and sink, idempotent upserts, per-source backpressure and quotas, metadata in a relational DB, orchestrations in Airflow/Durable Functions, IaC for both clouds, and observability with OpenTelemetry. Show the trade-offs and migration path."}, {"n": 22, "level": "design", "q": "Describe the agentic infrastructure workflow from your hackathon (Ops Master Agent) as an architecture.", "a": "Seven-stage workflow: plain-English request -> LLM (Claude on Bedrock) plans -> Terraform generated -> validation + human approval gate -> apply to AWS (ECS Fargate, RDS PostgreSQL, ALB) -> verification checks -> second approval and audit trail. Highlight guardrails: approval gates, least-privilege credentials, plan-before-apply, verification, full audit log, rollback."}]}, {"id": "20-lead-behavioral", "title": "Lead / Technical Leadership & Behavioral Questions", "focus": "Team lead (4+ yrs) - delivery, mentoring, estimation, stakeholder management, conflict", "intro": "Use STAR with numbers. Keep each story to ~2 minutes and prepare 6-8 stories you can bend to many questions: a production incident, a conflict, a mentoring win, a failed decision, a delivery under pressure, a technical migration, an improvement you drove, a disagreement with a client.", "questions": [{"n": 1, "level": "basic", "q": "Tell me about yourself (90-second version).", "a": "Structure: current role and scale -> core strengths -> 2 proof points -> why this role. Example frame: \"12+ years in Java, last 4+ leading teams at Cybage; I design and deliver Spring Boot/Quarkus services, event-driven pipelines on Kafka and AWS, and I lead code reviews, mentoring and client communication. Recently I built [X] and cut [Y]. I'm looking for a Lead role where I own architecture and delivery for [Z].\""}, {"n": 2, "level": "basic", "q": "What does a Lead Java developer do beyond coding?", "a": "Owns technical design and quality, breaks down work, estimates, unblocks the team, reviews code, mentors, interfaces with product/clients, manages risk and tech debt, ensures operability (monitoring, runbooks) and keeps delivery predictable. Still codes, but multiplies the team's output."}, {"n": 3, "level": "intermediate", "q": "How do you estimate and plan a feature?", "a": "Clarify requirements and acceptance criteria -> split into small slices -> identify risks/unknowns (spike) -> estimate with the team (relative points or ranges, not single numbers) -> add buffer for review, testing and deployment -> track via burn-down and revise early. Be explicit about assumptions and communicate changes quickly."}, {"n": 4, "level": "intermediate", "q": "How do you handle a team member who is underperforming?", "a": "Understand the cause first (skill gap, unclear expectations, personal issues, motivation) in a private 1:1, set clear specific goals and a short feedback loop, pair programming/mentoring, adjust task difficulty, document progress, involve the manager if there is no improvement. Be fair, concrete, and supportive."}, {"n": 5, "level": "intermediate", "q": "How do you mentor juniors?", "a": "Pair on real tasks, give small scoped stories with growing difficulty, code reviews that explain why, guided design discussions, learning goals each quarter, brown-bag sessions, and let them present their work. Measure growth by independence and quality of PRs."}, {"n": 6, "level": "intermediate", "q": "How do you run effective code reviews in a team?", "a": "Small PRs, a checklist (correctness, tests, security, performance, readability), review within 24 hours, comment on code not people, distinguish blocking vs optional comments, automate style, rotate reviewers to share knowledge, and track review turnaround time."}, {"n": 7, "level": "intermediate", "q": "Tell me about a conflict with a teammate/stakeholder and how you resolved it.", "a": "Frame: facts -> perspectives -> shared goal -> options with trade-offs -> decision criteria (data) -> agreement and follow-up. Show empathy, keep it professional, and end with the outcome and what you learned."}, {"n": 8, "level": "intermediate", "q": "How do you handle unclear or changing requirements?", "a": "Clarify with questions and examples, write down assumptions, deliver in increments with frequent demos (you ran weekly demos), prefer reversible decisions, use feature flags, keep the backlog visible, and escalate impact on scope/timeline early."}, {"n": 9, "level": "intermediate", "q": "How do you handle tight deadlines without sacrificing quality?", "a": "Negotiate scope (MVP vs nice-to-have), cut work not quality (tests and monitoring stay), prioritise by risk, parallelise with clear interfaces, add temporary capacity only if it helps, and record deliberate shortcuts as tracked tech debt with a payback plan."}, {"n": 10, "level": "intermediate", "q": "How do you communicate with clients and stakeholders?", "a": "Daily/weekly updates in plain language: progress, risks, decisions needed. Weekly demos, a shared status doc, early bad news with options, written follow-up after calls, and translating technical constraints into business impact."}, {"n": 11, "level": "intermediate", "q": "Describe a technical decision you made with trade-offs.", "a": "Pick a real case (e.g. choosing Quarkus + Picocli for parsers, Kafka vs RabbitMQ, expand/contract migration). Present options, criteria (performance, team skills, cost, risk), the decision, the outcome and what you would change."}, {"n": 12, "level": "intermediate", "q": "How do you drive engineering best practices in the team?", "a": "Lightweight standards (definition of done, coding guidelines, ADRs), automate with CI quality gates and templates, lead by example, run retros to improve one thing per sprint, share learnings (tech talks), and measure outcomes (defects, cycle time, incident count)."}, {"n": 13, "level": "intermediate", "q": "How do you manage on-call and production support in the team?", "a": "Rotation with clear escalation, runbooks, alert quality reviews, blameless post-incident reviews, a support-vs-feature capacity split, and fixing top recurring causes so on-call load shrinks over time."}, {"n": 14, "level": "intermediate", "q": "How do you keep up with technology and bring it into the team?", "a": "Follow release notes (Java 25, Spring Boot 4, Kafka 4), try small spikes, evaluate against real problems, run a short proof of concept with success criteria, document findings, and adopt gradually. Mention structured learning (Claude Code certifications, Copilot, Bedrock)."}, {"n": 15, "level": "intermediate", "q": "How do you handle disagreement with your manager or architect?", "a": "Seek to understand their constraints, bring data and options, propose a small experiment, disagree and commit once the decision is made, and document the rationale. Escalate only for risks to safety, security or compliance."}, {"n": 16, "level": "intermediate", "q": "What is your biggest weakness / area to improve?", "a": "Pick a real, non-fatal one with a concrete plan: e.g. \"Observability stack breadth (Prometheus/Grafana/Splunk) - I know the concepts from Datadog/CloudWatch and I'm building hands-on labs\", or \"NoSQL depth - I'm modelling a service on Couchbase\". Show progress, not excuses."}, {"n": 17, "level": "intermediate", "q": "Why are you leaving your current company / why this role?", "a": "Positive framing: growth in scope (architecture ownership), new domain/scale, modern stack, learning. Never criticise the employer. Tie to what the new company needs and what you bring."}, {"n": 18, "level": "intermediate", "q": "What are your achievements you are proudest of?", "a": "Prepare 3 with numbers: automation that saved hours/week, a migration delivered with zero downtime, the Ops Master Agent hackathon win delivered to leadership, mentoring that produced promotions, reduced incident count after logging/alerting improvements."}, {"n": 19, "level": "design", "q": "How would you set up a new team of 6 for a new product?", "a": "Define the mission and boundaries, split ownership by components/domains, agree working agreements (branching, reviews, DoD), set up the golden-path repo (CI/CD, observability, security), pick the first thin vertical slice to prove the pipeline, ADRs for key decisions, onboarding guide, and a metrics dashboard (lead time, deploy frequency, change failure rate, MTTR)."}, {"n": 20, "level": "design", "q": "How do you balance feature delivery with technical debt and platform work?", "a": "Reserve capacity (e.g. 20%), link debt items to measurable pain (incidents, slow builds), bundle debt work into related features, keep a visible roadmap, and report the effect (e.g. build time down 40%, incidents halved) to justify continued investment."}, {"n": 21, "level": "intermediate", "q": "Which metrics do you track as a Lead?", "a": "DORA: deployment frequency, lead time for changes, change failure rate, time to restore. Plus: PR turnaround, defect escape rate, test flakiness, on-call load, sprint predictability, team health (survey). Use them to improve the system, not to rank people."}, {"n": 22, "level": "intermediate", "q": "Questions you should ask the interviewer.", "a": "How is the team structured and what does the Lead own? What is the deployment frequency and incident process? What does the tech roadmap look like (Java/Spring upgrades, cloud)? How is technical debt handled? What does success look like in the first 6 months?"}]}, {"id": "21-trending-2026", "title": "Hot & Trending Topics for Lead Java Interviews (2026)", "focus": "Task 7 - what companies are asking right now, with ready answers", "intro": "Priority order for your interview (most likely first): 1) Java 21/25 + virtual threads, 2) Spring Boot 3.5 -> 4 migration, 3) event-driven design with Kafka (outbox, idempotency, DLQ), 4) resilience + observability (OpenTelemetry, SLOs), 5) system design/RCA stories, 6) cloud/Kubernetes basics, 7) AI-assisted engineering and GenAI integration, 8) security/supply chain. Verify versions before quoting them.", "questions": [{"n": 1, "level": "intermediate", "q": "What are the biggest Java platform changes a Lead should know in 2026?", "a": "Java 25 is the current LTS (Sept 2025). Virtual threads are final (Java 21) and no longer pin on `synchronized` (Java 24). **Scoped Values are final in 25**; Structured Concurrency is still preview; Stream Gatherers (final in 24); records/sealed types/pattern matching are mainstream; faster startup via Leyden/AOT cache; GraalVM native image for serverless."}, {"n": 2, "level": "intermediate", "q": "Why is \"Spring Boot 3 -> 4\" a hot question right now?", "a": "Boot 3.5 open-source support ended in June 2026, so many teams must migrate to Boot 4 (Spring Framework 7, Jakarta EE 11, Spring Security 7). Expect \"plan the migration\": upgrade to latest 3.5 first, clear deprecations, use the migration guide and OpenRewrite, handle modular starters, Jackson 3, test-annotation changes, third-party compatibility, run perf/regression tests, roll out via canary."}, {"n": 3, "level": "intermediate", "q": "What new Spring Framework 7 features are interview favourites?", "a": "Built-in resilience annotations (`@Retryable`, `@ConcurrencyLimit`), API versioning, JSpecify null safety, `@ImportHttpServices` for declarative HTTP clients, `BeanRegistrar`, `RestTestClient`, Spring Data AOT (faster startup), modular auto-configuration. The best answer connects each feature to a problem it removes (e.g. dropping Resilience4j for simple retry cases)."}, {"n": 4, "level": "advanced", "q": "Virtual threads in production: what is your adoption playbook?", "a": "Enable on Java 21+ (`spring.threads.virtual.enabled=true`), load-test before/after, watch pinning (`-Djdk.tracePinnedThreads`/JFR), limit concurrency to protect DB pools (semaphore/bulkhead), replace `ThreadLocal` heavy code with scoped values where possible, keep CPU-bound work on bounded platform pools, and monitor carrier thread and pool saturation. Not a free win for CPU-bound or lock-heavy code."}, {"n": 5, "level": "advanced", "q": "Event-driven architecture: what do interviewers probe?", "a": "Outbox + CDC, idempotent consumers, ordering by key, retries/DLQ topics, schema evolution (Avro/Protobuf registry), exactly-once myths, saga orchestration vs choreography, replay/backfill, consumer lag SLOs, and testing with Testcontainers. Kafka 4.0 specifics: KRaft-only, new consumer rebalance protocol, share groups (queues, preview in 4.1)."}, {"n": 6, "level": "advanced", "q": "Observability with OpenTelemetry and SLOs - what is expected?", "a": "Instrument with Micrometer/OTel, propagate `traceparent` through HTTP and Kafka headers, use the Collector to export to any backend, define SLIs/SLOs and burn-rate alerts, correlate logs/metrics/traces by id, control cardinality and cost (sampling), and write runbooks. Spring Boot's observability stack is built around Micrometer Observation."}, {"n": 7, "level": "advanced", "q": "Resilience engineering (timeouts, retries, circuit breakers, bulkheads) - expected depth?", "a": "Know ordering and when each backfires (retry storms, retries on non-idempotent calls), deadline propagation, fallback design, chaos testing, and capacity limits. Know both Resilience4j and the new Spring Framework 7 core resilience annotations and when to use which."}, {"n": 8, "level": "advanced", "q": "GenAI in Java backends: what should a Lead say?", "a": "Use **Spring AI** or LangChain4j for model calls, prompt templates, structured output, RAG (embeddings + vector store such as pgvector/OpenSearch), tool calling, and MCP integration. Design concerns: latency and cost, caching, streaming responses, evaluation and guardrails, PII redaction, rate limits and fallbacks, observability of prompts/tokens, and keeping the model behind a port/adapter. Your Bedrock (Claude) and agentic-workflow experience is a strong story."}, {"n": 9, "level": "advanced", "q": "How is AI-assisted development changing engineering practice?", "a": "Faster scaffolding, tests and refactors; code review assistants; documentation. Lead responsibilities: policy on data/secrets, mandatory human review, tests/security gates unchanged, measure impact (cycle time, defect rate), train juniors to verify not just accept, avoid skill atrophy, and standardise prompts/context files (e.g. repo conventions)."}, {"n": 10, "level": "advanced", "q": "Modular monolith vs microservices - what is the 2026 stance?", "a": "Many companies are moving back toward **modular monoliths** (Spring Modulith) for cost and simplicity, using microservices only where independent scaling/ownership is real. Be ready with a decision framework and a story of consolidating or splitting a service."}, {"n": 11, "level": "intermediate", "q": "Platform engineering and \"golden paths\" - what is it?", "a": "An internal developer platform provides templates, pipelines, observability, security defaults and self-service infra so product teams ship faster. As a Lead you contribute service templates, shared starters and docs. Tools: Backstage, Crossplane, Terraform modules, Argo CD."}, {"n": 12, "level": "intermediate", "q": "Software supply-chain security - what questions come up?", "a": "SBOM (CycloneDX/SPDX), dependency scanning, signed artifacts (cosign), SLSA provenance, pinning, private registries, secret scanning, least-privilege CI (OIDC), CVE patch SLAs, and regulatory drivers (e.g. EU Cyber Resilience Act). Mention how you track EOL (Java 8, Boot 2/3)."}, {"n": 13, "level": "intermediate", "q": "Zero-trust and API security in microservices?", "a": "mTLS between services (mesh), short-lived tokens, OAuth2/OIDC at the edge and re-validation inside, authorization per object, secrets in vaults, policy-as-code, audit logs, rate limiting, and input validation. Know OWASP API Top 10."}, {"n": 14, "level": "intermediate", "q": "Cloud cost (FinOps) as an engineering concern?", "a": "Right-sizing, autoscaling, spot instances, storage tiering, log/metric cost control, efficient runtimes (virtual threads, native image for serverless), cost allocation tags, and cost dashboards per team. Interviewers like candidates who quote concrete savings."}, {"n": 15, "level": "intermediate", "q": "Kubernetes expectations for a Java Lead?", "a": "Probes, requests/limits tuned for JVM, HPA/KEDA by lag, graceful shutdown, PDBs, config/secrets, Helm/Kustomize, GitOps (Argo CD), basic troubleshooting (CrashLoop, OOMKilled, Pending), and awareness of OpenShift differences (Routes, SCC non-root)."}, {"n": 16, "level": "intermediate", "q": "Data and caching trends interviewers raise?", "a": "CDC with Debezium, outbox, lakehouse/analytics offload, Redis/Caffeine caching strategies, polyglot persistence (Postgres + search + cache), vector databases for AI features, and consistency trade-offs in multi-region setups."}, {"n": 17, "level": "advanced", "q": "Performance and cost efficiency: JVM startup/footprint techniques?", "a": "AppCDS/AOT cache (Leyden), Spring AOT + native image for short-lived workloads, `MaxRAMPercentage` and G1/ZGC tuning, lazy initialisation, removing unused starters, virtual threads to avoid oversized pools, and profiling with JFR before tuning."}, {"n": 18, "level": "advanced", "q": "Testing trends: what is \"expected\" now?", "a": "Testcontainers for all external dependencies, contract tests, mutation testing, property-based testing (jqwik), ArchUnit, performance tests in CI, and AI-assisted test generation reviewed by humans. Boot 4 introduces `RestTestClient`."}, {"n": 19, "level": "design", "q": "A common 2026 design question: \"Design an AI-assisted support/ops assistant for an enterprise platform.\"", "a": "Gateway service in Spring Boot calling an LLM (Bedrock/Azure OpenAI) via a port; retrieval from runbooks/tickets (vector store + keyword search); tool calling to read-only ops APIs; guardrails (PII masking, allow-listed tools, human approval for actions); caching and rate limits; async processing for long tasks; audit log of prompts/responses; evaluation sets and feedback loop; metrics for latency, cost per request, answer quality."}, {"n": 20, "level": "design", "q": "\"Design a high-throughput event pipeline with exactly-once-like behaviour and replay.\"", "a": "Kafka topics keyed by entity, producers with idempotence, outbox from the source DB, consumers with idempotent upserts and offset commit after DB commit, DLT + replay tool, schema registry with compatibility checks, lag/error SLOs, backfill by reading from a retained topic or compacted topic, and capacity planning by partitions."}, {"n": 21, "level": "intermediate", "q": "Interview day checklist for a Lead Java role.", "a": "Prepare 6 stories (incident, conflict, mentoring, migration, failure, improvement); two system designs you can draw (file ingestion pipeline, order saga); a 2-minute explanation of each project on your resume; honest \"gap\" answers for NoSQL, Azure, OpenShift, Splunk/Grafana/Prometheus, each paired with your nearest equivalent; and 5 questions to ask them."}]}];
const KEY="prep-done-v1";let done={};try{done=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
let cur="ALL",mock=null,hideAns=false;
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function inline(s){return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")}
function md(t){const L=t.split("\n");let o="",i=0;
while(i<L.length){let l=L[i];
if(l.startsWith("```")){let b=[];i++;while(i<L.length&&!L[i].startsWith("```")){b.push(L[i]);i++}i++;o+="<pre><code>"+esc(b.join("\n"))+"</code></pre>";continue}
if(/^\s*\|/.test(l)){let r=[];while(i<L.length&&/^\s*\|/.test(L[i])){r.push(L[i]);i++}
r=r.filter(x=>!/^\s*\|[\s:|-]+\|?\s*$/.test(x));o+="<table>"+r.map((x,k)=>"<tr>"+x.trim().replace(/^\||\|$/g,"").split("|").map(c=>(k?"<td>":"<th>")+inline(c.trim())+(k?"</td>":"</th>")).join("")+"</tr>").join("")+"</table>";continue}
if(/^\s*[-*]\s+/.test(l)){o+="<ul>";while(i<L.length&&/^\s*[-*]\s+/.test(L[i])){o+="<li>"+inline(L[i].replace(/^\s*[-*]\s+/,""))+"</li>";i++}o+="</ul>";continue}
if(/^\s*\d+\.\s+/.test(l)){o+="<ol>";while(i<L.length&&/^\s*\d+\.\s+/.test(L[i])){o+="<li>"+inline(L[i].replace(/^\s*\d+\.\s+/,""))+"</li>";i++}o+="</ol>";continue}
if(l.startsWith("> ")){o+="<p><i>"+inline(l.slice(2))+"</i></p>";i++;continue}
if(l.trim()==="" ){i++;continue}
o+="<p>"+inline(l)+"</p>";i++}return o}
function all(){const a=[];DATA.forEach(t=>t.questions.forEach(q=>a.push({...q,tid:t.id,tt:t.title,k:t.id+"#"+q.n})));return a}
function render(){const s=document.getElementById("s").value.toLowerCase(),lv=document.getElementById("lv").value;
let qs=mock||all().filter(q=>cur==="ALL"||q.tid===cur);
qs=qs.filter(q=>(!lv||q.level===lv)&&(!s||(q.q+" "+q.a).toLowerCase().includes(s)));
const t=DATA.find(x=>x.id===cur);let h=(cur!=="ALL"&&!mock&&t&&t.intro)?'<div class="intro">'+md(t.intro)+"</div>":"";
h+=qs.map(q=>`<details class="q ${done[q.k]?"done":""}" data-k="${q.k}"><summary><span class="tag ${q.level}">${q.level}</span><span>${cur==="ALL"||mock?"["+esc(q.tt)+"] ":""}Q${q.n}. ${inline(q.q)}</span></summary><div class="body">${hideAns?"<p><i>Answer hidden - say it out loud first, then toggle 'Hide answers'.</i></p>":md(q.a)}<p><label><input type="checkbox" ${done[q.k]?"checked":""} onchange="mark('${q.k}',this.checked)"> I can answer this confidently</label></p></div></details>`).join("")||"<p>No questions match.</p>";
document.getElementById("out").innerHTML=h;
const tot=all().length,d=Object.values(done).filter(Boolean).length;document.getElementById("stat").textContent=`${d}/${tot} confident - ${qs.length} shown`}
function mark(k,v){done[k]=v;try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}render()}
function toc(){const c=k=>k==="ALL"?all().length:DATA.find(t=>t.id===k).questions.length;
document.getElementById("toc").innerHTML=[["ALL","All topics"],...DATA.map(t=>[t.id,t.title])].map(([k,n])=>`<a data-k="${k}" class="${k===cur?"on":""}">${esc(n)}<small>${c(k)}</small></a>`).join("");
document.querySelectorAll("#toc a").forEach(a=>a.onclick=()=>{cur=a.dataset.k;mock=null;toc();render();scrollTo(0,0)})}
document.getElementById("s").oninput=render;document.getElementById("lv").onchange=render;
document.getElementById("mock").onclick=()=>{mock=all().sort(()=>Math.random()-.5).slice(0,10);hideAns=true;document.getElementById("hide").textContent="Hide answers: on";render()};
document.getElementById("hide").onclick=e=>{hideAns=!hideAns;e.target.textContent="Hide answers: "+(hideAns?"on":"off");render()};
document.getElementById("exp").onclick=e=>{const o=e.target.textContent==="Expand all";document.querySelectorAll("details.q").forEach(d=>d.open=o);e.target.textContent=o?"Collapse all":"Expand all"};
toc();render();
</script></body></html>

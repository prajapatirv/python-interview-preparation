<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interview Coach</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f0f2f5; --text: #1b1f24; --muted: #5d6673; --line: #dde1e6;
  --accent: #2f5bd3; --accent-soft: #e6edff; --good: #1f8a4c; --good-soft: #e3f4ea; --warn: #a15c00; --warn-soft: #fff1dc;
  --bad: #b3261e; --code: #eef0f3; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
  --lv-fresher: #1f8a4c; --lv-mid: #2f5bd3; --lv-senior: #8a3fd1; --lv-architect: #b3261e;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111418; --panel: #191d23; --panel-2: #20252c; --text: #e6e9ee; --muted: #9aa4b2; --line: #2c333c;
    --accent: #7d9cff; --accent-soft: #1f2a48; --good: #5cc98a; --good-soft: #17301f; --warn: #f0b35a; --warn-soft: #33270f;
    --bad: #ff8a80; --code: #232931; --shadow: none;
    --lv-fresher: #5cc98a; --lv-mid: #7d9cff; --lv-senior: #c39bff; --lv-architect: #ff8a80;
  }
}
:root[data-theme="dark"] {
  --bg: #111418; --panel: #191d23; --panel-2: #20252c; --text: #e6e9ee; --muted: #9aa4b2; --line: #2c333c;
  --accent: #7d9cff; --accent-soft: #1f2a48; --good: #5cc98a; --good-soft: #17301f; --warn: #f0b35a; --warn-soft: #33270f;
  --bad: #ff8a80; --code: #232931; --shadow: none;
  --lv-fresher: #5cc98a; --lv-mid: #7d9cff; --lv-senior: #c39bff; --lv-architect: #ff8a80;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
code { background: var(--code); padding: 1px 5px; border-radius: 4px; font: 13px/1.4 ui-monospace, Consolas, monospace; }
pre { background: var(--code); padding: 10px 12px; border-radius: 6px; overflow-x: auto; }
pre code { background: none; padding: 0; }
table { border-collapse: collapse; margin: 8px 0; display: block; overflow-x: auto; }
th, td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; vertical-align: top; }
th { background: var(--panel-2); }
blockquote { margin: 8px 0; padding: 4px 12px; border-left: 3px solid var(--line); color: var(--muted); }

header { position: sticky; top: 0; z-index: 10; background: var(--panel); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 10px; padding: 8px 16px; flex-wrap: wrap; max-width: 1240px; margin: 0 auto; }
.brand { font-weight: 700; font-size: 17px; margin-right: 6px; white-space: nowrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 5px 12px; }
.seg button.on { background: var(--accent); color: #fff; }
nav.views { display: flex; gap: 2px; flex-wrap: wrap; }
nav.views button { border: 0; background: transparent; padding: 6px 10px; border-radius: 6px; color: var(--muted); }
nav.views button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.spacer { flex: 1; }
.pill { font-size: 12px; padding: 3px 9px; border-radius: 99px; background: var(--panel-2); color: var(--muted); white-space: nowrap; }
.pill.live { background: var(--good-soft); color: var(--good); }
.icon-btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 4px 9px; }

main { max-width: 1240px; margin: 0 auto; padding: 18px 16px 60px; }
h1 { font-size: 22px; margin: 0 0 4px; } h2 { font-size: 18px; margin: 18px 0 8px; } h3 { font-size: 16px; margin: 14px 0 6px; }
.sub { color: var(--muted); margin: 0 0 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; box-shadow: var(--shadow); }
.topic-card { cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
.topic-card:hover { border-color: var(--accent); }
.topic-card h3 { margin: 0; }
.topic-card p { margin: 0; color: var(--muted); font-size: 13.5px; flex: 1; }
.counts { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--panel-2); color: var(--muted); border: 1px solid transparent; }
button.chip { border: 1px solid var(--line); background: var(--panel); }
button.chip.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.progress { height: 6px; background: var(--panel-2); border-radius: 99px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--good); }
.hero { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 18px; }
.hero .card { cursor: pointer; }
.hero .card b { display: block; margin-bottom: 2px; }
.hero .card span { color: var(--muted); font-size: 13.5px; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 18px; align-items: start; }
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.layout > *, .grid > *, .q, .card { min-width: 0; }
.q > .qh .t { min-width: 0; overflow-wrap: anywhere; }
@media (max-width: 600px) { .q > .qh .kind { display: none; } nav.views button { padding: 6px 7px; } }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0 12px; }
.toolbar input[type=search] { flex: 1; min-width: 180px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.toggles { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); margin-bottom: 10px; }
.toggles label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }

.q { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; }
.q > .qh { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; cursor: pointer; }
.q > .qh .t { flex: 1; font-weight: 550; }
.q.mastered > .qh .t::after { content: "  \2713"; color: var(--good); }
.lv { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; padding: 2px 7px; border-radius: 4px; white-space: nowrap; border: 1px solid currentColor; }
.lv.fresher { color: var(--lv-fresher); } .lv.mid { color: var(--lv-mid); } .lv.senior { color: var(--lv-senior); } .lv.architect { color: var(--lv-architect); }
.kind { font-size: 11px; color: var(--muted); white-space: nowrap; padding-top: 2px; }
.qb { padding: 0 14px 14px; border-top: 1px solid var(--line); }
.sec { margin-top: 12px; }
.sec > .lbl { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 2px; }
.sec.spoken { background: var(--accent-soft); border-radius: 8px; padding: 8px 12px; }
.sec.spoken > .lbl { color: var(--accent); }
.sec.scenario { background: var(--warn-soft); border-radius: 8px; padding: 8px 12px; }
.sec.scenario > .lbl { color: var(--warn); }
.md p { margin: 6px 0; } .md ul, .md ol { margin: 6px 0; padding-left: 22px; } .md li { margin: 2px 0; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 6px 12px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.good { color: var(--good); border-color: var(--good); }
.btn:disabled { opacity: .55; cursor: default; }
textarea { width: 100%; min-height: 130px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); resize: vertical; }
select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); }
.ai { margin-top: 12px; border: 1px solid var(--accent); border-radius: 10px; padding: 4px 14px 10px; background: var(--panel); }
.ai .who { font-size: 12px; color: var(--accent); font-weight: 700; margin-top: 8px; }
.ai.busy .who::after { content: " ..."; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .2; } }
.side .card { margin-bottom: 12px; }
.side h3 { margin: 0 0 8px; font-size: 14px; }
.side ul { margin: 0; padding-left: 18px; font-size: 13.5px; }
.side li { margin: 3px 0; overflow-wrap: anywhere; }
.side code { font-size: 12px; }
.empty { color: var(--muted); padding: 20px 0; }
.more { text-align: center; margin: 12px 0; }
.score-row { display: grid; grid-template-columns: 170px 1fr 34px; gap: 8px; align-items: center; font-size: 13.5px; margin: 4px 0; }
.meter { height: 8px; background: var(--panel-2); border-radius: 99px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--accent); }
.form-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 8px 0; }
.check-list { display: flex; flex-wrap: wrap; gap: 6px; }
.banner { padding: 10px 14px; border-radius: 8px; margin: 10px 0; }
.banner.ok { background: var(--good-soft); color: var(--good); }
.banner.bad { background: var(--warn-soft); color: var(--warn); }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; z-index: 50; padding: 30px 16px; overflow-y: auto; }
.modal.open { display: block; }
.modal .card { max-width: 900px; margin: 0 auto; }
.modal .close { float: right; }
@media (max-width: 600px) { .score-row { grid-template-columns: 110px 1fr 30px; } .brand { font-size: 15px; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <span class="brand">Interview Coach</span>
    <span class="seg" id="stacks"></span>
    <nav class="views" id="views">
      <button data-view="home">Topics</button>
      <button data-view="ask">Ask anything</button>
      <button data-view="mock">Mock interview</button>
      <button data-view="jd">Job description</button>
      <button data-view="coverage">Coverage</button>
    </nav>
    <span class="spacer"></span>
    <span class="pill" id="ai-pill">AI: ...</span>
    <button class="icon-btn" id="theme" title="Toggle theme">&#9680;</button>
  </div>
</header>
<main id="main"></main>
<div class="modal" id="modal"><div class="card"><button class="btn close" id="modal-close">Close</button><div id="modal-body"></div></div></div>

<script>
"use strict";
// ---------------------------------------------------------------- helpers
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem('coach.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('coach.' + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } }
};
async function api(path, opts) {
  const r = await fetch(path, opts);
  const ct = r.headers.get('content-type') || '';
  const body = ct.includes('json') ? await r.json() : await r.text();
  if (!r.ok) throw new Error((body && body.detail) || r.statusText);
  return body;
}
const LEVELS = ['fresher', 'mid', 'senior', 'architect'];
const LEVEL_HINT = { fresher: '0-2 yrs', mid: '3-6 yrs', senior: '6-10 yrs', architect: '10+ yrs' };
const KIND_LABEL = { scenario: 'Scenario', crib: 'Crib sheet', deepdive: 'Deep dive', guide: 'Guide', index: 'Index' };
const DIMS = [['scenario', 'Scenario & context'], ['depth', 'Technical depth'], ['tradeoffs', 'Trade-offs'],
              ['monitoring', 'Monitoring & ops'], ['clarity', 'Clarity & structure']];

// ---------------------------------------------------------------- markdown (offline subset)
function inline(s) {
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
  s = esc(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
       .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
       .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, text, href) => {
         href = href.replace(/&amp;/g, '&');
         if (/^https?:\/\//.test(href)) return '<a href="' + esc(href) + '" target="_blank" rel="noopener">' + text + '</a>';
         if (/\.md(#.*)?$/.test(href)) return '<a href="#" data-doc-rel="' + esc(href.split('#')[0]) + '">' + text + '</a>';
         return text;
       });
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => '<code>' + esc(codes[+i]) + '</code>');
}
function md(text) {
  const lines = String(text || '').replace(/\r\n/g, '\n').split('\n');
  const out = []; let i = 0;
  const isSep = l => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
  const cells = l => l.trim().replace(/^\|/, '').replace(/\|$/, '').split(/(?<!\\)\|/).map(c => c.trim());
  const listRe = /^\s*([-*+]|\d+[.)])\s+/;
  while (i < lines.length) {
    const l = lines[i]; let m;
    if (/^\s*```/.test(l)) {
      const buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
      i++; out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>');
    } else if ((m = /^(#{1,6})\s+(.*)$/.exec(l))) {
      const n = Math.min(6, m[1].length + 1); out.push('<h' + n + '>' + inline(m[2]) + '</h' + n + '>'); i++;
    } else if (/^\s*(-{3,}|\*{3,})\s*$/.test(l)) { out.push('<hr>'); i++; }
    else if (/^\s*>/.test(l)) {
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ''));
      out.push('<blockquote>' + md(buf.join('\n')) + '</blockquote>');
    } else if (l.includes('|') && i + 1 < lines.length && isSep(lines[i + 1])) {
      let h = '<table><thead><tr>' + cells(l).map(c => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>'; i += 2;
      while (i < lines.length && lines[i].includes('|') && lines[i].trim()) h += '<tr>' + cells(lines[i++]).map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>';
      out.push(h + '</tbody></table>');
    } else if (listRe.test(l)) {
      const stack = []; let html = '';
      while (i < lines.length && (listRe.test(lines[i]) || (/^\s+\S/.test(lines[i]) && stack.length))) {
        const lm = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/.exec(lines[i]);
        if (!lm) { html += ' ' + inline(lines[i].trim()); i++; continue; }
        const depth = Math.floor(lm[1].length / 2), tag = /\d/.test(lm[2]) ? 'ol' : 'ul';
        while (stack.length && stack[stack.length - 1].d > depth) html += '</li></' + stack.pop().t + '>';
        if (stack.length && stack[stack.length - 1].d === depth) html += '</li>';
        else { html += '<' + tag + '>'; stack.push({ d: depth, t: tag }); }
        html += '<li>' + inline(lm[3]); i++;
      }
      while (stack.length) html += '</li></' + stack.pop().t + '>';
      out.push(html);
    } else if (!l.trim()) { i++; }
    else {
      const buf = [l]; i++;
      while (i < lines.length && lines[i].trim() && !/^(#{1,6}\s|\s*```|\s*>)/.test(lines[i]) && !listRe.test(lines[i])
             && !(lines[i].includes('|') && i + 1 < lines.length && isSep(lines[i + 1]))) buf.push(lines[i++]);
      out.push('<p>' + inline(buf.join(' ')) + '</p>');
    }
  }
  return out.join('\n');
}

// ---------------------------------------------------------------- state
const S = {
  stacks: [], stack: store.get('stack', 'java'), view: 'home', topic: null, status: null,
  mastered: new Set(store.get('mastered', [])),
  filters: store.get('filters', { level: '', kinds: [], q: '', practice: false, quick: false }),
  shown: 40,
};
const topicCache = {};
function saveMastered() { store.set('mastered', [...S.mastered]); }
function curStack() { return S.stacks.find(s => s.id === S.stack) || S.stacks[0]; }

// ---------------------------------------------------------------- routing (hash: #/java/topic/kafka)
function go(view, topic) {
  const h = '#/' + S.stack + '/' + view + (topic ? '/' + topic : '');
  if (location.hash !== h) location.hash = h; else route();
}
function route() {
  const [, stack, view, topic] = (location.hash || '').split('/');
  if (stack && S.stacks.some(s => s.id === stack)) { S.stack = stack; store.set('stack', stack); }
  S.view = view || 'home'; S.topic = topic || null;
  document.querySelectorAll('#views button').forEach(b => b.classList.toggle('on', b.dataset.view === (S.view === 'topic' ? 'home' : S.view)));
  document.querySelectorAll('#stacks button').forEach(b => b.classList.toggle('on', b.dataset.stack === S.stack));
  window.scrollTo(0, 0);
  render();
}
window.addEventListener('hashchange', route);
document.querySelectorAll('#views button').forEach(b => b.onclick = () => go(b.dataset.view));
$('#theme').onclick = () => {
  const cur = document.documentElement.dataset.theme;
  const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'light' : 'dark';
  store.set('theme', document.documentElement.dataset.theme);
};
{ const t = store.get('theme', null); if (t) document.documentElement.dataset.theme = t; }

function render() {
  const main = $('#main');
  const v = S.view;
  if (v === 'topic' && S.topic) return renderTopic(main, S.topic);
  if (v === 'ask') return renderAsk(main);
  if (v === 'mock') return renderMock(main);
  if (v === 'jd') return renderJD(main);
  if (v === 'coverage') return renderCoverage(main);
  if (v === 'q' && S.topic) { renderHome(main); openQuestion(S.topic).catch(() => {}); return; }   // deep link to one question
  return renderHome(main);
}

// ---------------------------------------------------------------- AI streaming
async function streamAI(payload, box, onDone) {
  box.classList.add('busy');
  const who = '<div class="who">' + (S.status && S.status.ai.provider === 'claude' ? 'AI coach (' + esc(S.status.ai.model) + ')' : 'Coach (offline mock)') + '</div>';
  box.innerHTML = who + '<div class="md"></div>';
  const out = $('.md', box);
  let text = '', pending = false;
  const paint = () => { pending = false; out.innerHTML = md(text.replace(/\nSCORES:.*$/m, '')); };
  let resp;
  try {
    resp = await fetch('/api/ai', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ stack: S.stack }, payload)) });
    if (!resp.ok) { const e = await resp.json().catch(() => ({})); throw new Error(e.detail || resp.statusText); }
    const reader = resp.body.getReader(), dec = new TextDecoder();
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      text += dec.decode(value, { stream: true });
      if (!pending) { pending = true; requestAnimationFrame(paint); }
    }
    text += dec.decode();
  } catch (e) { text += '\n\n> Error: ' + e.message; }
  box.classList.remove('busy');
  paint();
  if (onDone) onDone(text, resp);
}
function parseScores(text) {
  const m = /SCORES:\s*(.*)$/m.exec(text || '');
  if (!m) return null;
  const s = {};
  m[1].replace(/(\w+)=(\d)/g, (_, k, v) => { s[k] = +v; });
  return Object.keys(s).length ? s : null;
}

// ---------------------------------------------------------------- question card
function sectionsHtml(q, quick) {
  if (!q.sections || !q.sections.length) return '<div class="md">' + md(q.body) + '</div>';
  const secs = quick ? q.sections.filter(s => s.key === 'spoken') : q.sections;
  return secs.map(s => '<div class="sec ' + esc(s.key) + '"><div class="lbl">' + esc(s.label) + '</div><div class="md">' + md(s.md) + '</div></div>').join('');
}
function qCard(q, opts = {}) {
  const el = document.createElement('div');
  el.className = 'q' + (S.mastered.has(q.id) ? ' mastered' : '');
  el.innerHTML = '<div class="qh"><span class="lv ' + q.level + '">' + q.level + '</span><span class="t">' + inline(q.title) +
    '</span><span class="kind">' + (KIND_LABEL[q.kind] || q.kind) + '</span></div>';
  let body = null;
  const open = () => {
    if (body) { body.remove(); body = null; return; }
    body = document.createElement('div'); body.className = 'qb';
    const practice = opts.practice ?? S.filters.practice, quick = opts.quick ?? S.filters.quick;
    body.innerHTML = practice
      ? '<p class="sub" style="margin-top:12px">Answer out loud or type it first, then get feedback or reveal the model answer.</p><textarea placeholder="Your answer..."></textarea>' +
        '<div class="actions"><button class="btn primary" data-a="grade">Get feedback</button><button class="btn" data-a="improve">Rewrite my answer</button><button class="btn" data-a="reveal">Reveal model answer</button></div><div class="ans"></div>'
      : '<div class="ans">' + sectionsHtml(q, quick) + '</div>' +
        '<div class="actions"><button class="btn good" data-a="master">' + (S.mastered.has(q.id) ? 'Unmark' : 'I can answer this') + '</button>' +
        '<button class="btn" data-a="deeper">Go deeper (AI)</button><button class="btn" data-a="practice">Practice this</button>' +
        (quick && q.sections && q.sections.length ? '<button class="btn" data-a="full">Full answer</button>' : '') + '</div>';
    const aiBox = document.createElement('div'); aiBox.className = 'ai'; aiBox.style.display = 'none';
    body.appendChild(aiBox);
    body.onclick = ev => {
      const a = ev.target.dataset && ev.target.dataset.a; if (!a) return;
      const show = () => { aiBox.style.display = ''; return aiBox; };
      if (a === 'master') {
        S.mastered.has(q.id) ? S.mastered.delete(q.id) : S.mastered.add(q.id); saveMastered();
        el.classList.toggle('mastered', S.mastered.has(q.id)); ev.target.textContent = S.mastered.has(q.id) ? 'Unmark' : 'I can answer this';
      } else if (a === 'deeper') streamAI({ mode: 'explain', question_id: q.id }, show());
      else if (a === 'practice') { body.remove(); body = null; openWith({ practice: true }); }
      else if (a === 'full') { $('.ans', body).innerHTML = sectionsHtml(q, false); ev.target.remove(); }
      else if (a === 'reveal') { $('.ans', body).innerHTML = sectionsHtml(q, false); }
      else if (a === 'grade' || a === 'improve') {
        const answer = $('textarea', body).value.trim();
        if (!answer) { $('textarea', body).focus(); return; }
        streamAI({ mode: a === 'grade' ? 'interview' : 'improve', question_id: q.id, answer, level: q.level }, show(), t => {
          const sc = parseScores(t); if (sc) recordScore(q, sc);
        });
      }
    };
    el.appendChild(body);
  };
  const openWith = o => { const saved = opts; opts = Object.assign({}, opts, o); open(); opts = saved; };
  $('.qh', el).onclick = open;
  if (opts.expanded) open();
  return el;
}
function recordScore(q, scores) {
  const hist = store.get('scores', []);
  hist.push({ id: q.id, topic: q.topic, stack: q.stack, at: Date.now(), scores });
  store.set('scores', hist.slice(-500));
}

async function runRound(list) {
  const run = $('#m-run'), results = [];
  $('#m-setup').style.display = 'none';
  for (let i = 0; i < list.length; i++) {
    const q = await api('/api/question/' + list[i].id);
    const sc = await new Promise(resolve => {
      run.innerHTML = '<div class="card"><p class="sub">Question ' + (i + 1) + ' of ' + list.length + ' &middot; <span class="lv ' + q.level + '">' + q.level + '</span></p>' +
        '<h2 style="margin-top:0">' + inline(q.title) + '</h2><textarea id="m-ans" placeholder="Your answer. Start with a real situation, then your decisions, trade-offs and how you would monitor it."></textarea>' +
        '<div class="actions"><button class="btn primary" id="m-sub">Submit answer</button><button class="btn" id="m-skip">Skip</button></div><div class="ai" id="m-out" style="display:none"></div><div id="m-next"></div></div>';
      $('#m-ans').focus();
      $('#m-skip').onclick = () => resolve(null);
      $('#m-sub').onclick = () => {
        const answer = $('#m-ans').value.trim(); if (!answer) return;
        $('#m-sub').disabled = true; $('#m-skip').disabled = true;
        const out = $('#m-out'); out.style.display = '';
        streamAI({ mode: 'interview', question_id: q.id, answer, level: q.level }, out, t => {
          const s = parseScores(t); if (s) recordScore(q, s);
          $('#m-next').innerHTML = '<div class="actions"><button class="btn" id="m-model">Show model answer</button><button class="btn primary" id="m-nx">' + (i + 1 < list.length ? 'Next question' : 'Finish') + '</button></div><div id="m-model-box"></div>';
          $('#m-model').onclick = () => { $('#m-model-box').innerHTML = sectionsHtml(q, false); };
          $('#m-nx').onclick = () => resolve(s);
        });
      };
    });
    results.push({ q, sc });
  }
  const scored = results.filter(r => r.sc);
  const avg = {};
  DIMS.forEach(([k]) => { avg[k] = scored.length ? scored.reduce((a, r) => a + (r.sc[k] || 0), 0) / scored.length : 0; });
  const weakest = DIMS.slice().sort((a, b) => avg[a[0]] - avg[b[0]])[0];
  run.innerHTML = '<div class="card"><h2 style="margin-top:0">Round summary</h2>' +
    (scored.length ? DIMS.map(([k, label]) => '<div class="score-row"><span>' + label + '</span><div class="meter"><i style="width:' + (avg[k] * 20) + '%"></i></div><b>' + avg[k].toFixed(1) + '</b></div>').join('') +
      '<p>Focus next on <b>' + weakest[1] + '</b>. ' + ({ scenario: 'Open every answer with a concrete production situation and numbers.', depth: 'Name the mechanism and the real config or API behind your answer.', tradeoffs: 'Say what can go wrong and what you gave up.', monitoring: 'End with the metric, log search or alert that proves it works.', clarity: 'Use a numbered structure and finish with a 60-second summary.' })[weakest[0]] + '</p>'
      : '<p class="empty">No answers were scored.</p>') +
    '<ul>' + results.map(r => '<li>' + esc(r.q.title) + (r.sc ? ' &mdash; ' + DIMS.map(([k]) => r.sc[k]).join('/') : ' &mdash; skipped') + '</li>').join('') + '</ul>' +
    '<div class="actions"><button class="btn primary" id="m-again">New round</button></div></div>';
  $('#m-again').onclick = () => render();
  renderHistory();
}

async function loadStacks() {
  S.stacks = await api('/api/stacks');
  if (!S.stacks.some(s => s.id === S.stack)) S.stack = S.stacks[0].id;
  $('#stacks').innerHTML = S.stacks.map(s => '<button data-stack="' + s.id + '">' + esc(s.title) + '</button>').join('');
  $('#stacks').querySelectorAll('button').forEach(b => b.onclick = () => { S.stack = b.dataset.stack; store.set('stack', S.stack); go(S.view === 'topic' ? 'home' : S.view); });
}
(async function boot() {
  try {
    S.status = await api('/api/status');
    const pill = $('#ai-pill');
    pill.textContent = S.status.ai.provider === 'claude' ? 'AI: ' + S.status.ai.model : 'AI: offline mock';
    pill.classList.toggle('live', S.status.ai.provider === 'claude');
    pill.title = S.status.ai.provider === 'claude' ? 'Answers stream from the Claude API' : 'Set ANTHROPIC_API_KEY and restart to use the real AI coach';
    await loadStacks();
    route();
  } catch (e) {
    $('#main').innerHTML = '<p class="empty">Could not reach the server: ' + esc(e.message) + '</p>';
  }
})();
</script>
</body>
</html>
